// ---------------------------------------------------------------------
// Three.js scene
// ---------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#22c9cd');
// The old fog started at 20 units, which under this camera is inside the
// field: fruit a couple of rows out were being blended into the sand and
// came out chalky. It now only softens the far edge of the board.
scene.fog = new THREE.Fog('#22c9cd', 46, 72);

const camera = new THREE.OrthographicCamera(-8, 8, 8, -8, 0.1, 100);

// Bright, mostly ambient light: the sun is there to place the shadows, not
// to model the fruit. A strong key light drops one side of every sphere
// into shade and reads as muddy at this size.
scene.add(new THREE.HemisphereLight('#ffffff', '#f0b877', 1.5));
scene.add(new THREE.AmbientLight('#fff4de', 0.45));
const sun = new THREE.DirectionalLight('#fff8e8', 0.72);
sun.position.set(5, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
scene.add(sun);

// ---------------------------------------------------------------------
// Fruit look: procedural textures + per-type geometry
//
// The camera sits nearly overhead, so what reads is the top of each
// fruit. Sphere UVs put the canvas top row at the north pole, which is
// where the top-facing detail is drawn.
// ---------------------------------------------------------------------
function newCanvas(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  return [c, c.getContext('2d')];
}
function finishTexture(canvas) {
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

// Sphere UVs put row 0 of the canvas at the north pole, so everything drawn
// in the top band lands on the cap facing the camera. The calyx goes there;
// the seeded body fills the rest.
function strawberryTexture(t) {
  const S = 256, [c, ctx] = newCanvas(S);
  const g = ctx.createLinearGradient(0, 0, 0, S);
  g.addColorStop(0, t.base);
  g.addColorStop(0.55, t.base);
  g.addColorStop(1, t.dark);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);

  // seeds: yellow pips in a staggered grid, each in a shallow dimple
  const cell = 24;
  for (let y = cell * 0.9; y < S; y += cell) {
    for (let x = 0; x < S + cell; x += cell) {
      const ox = (Math.round(y / cell) & 1) ? cell / 2 : 0;
      const px = x + ox, py = y;
      ctx.fillStyle = 'rgba(120,10,20,.45)';
      ctx.beginPath(); ctx.ellipse(px, py + 2.4, 4.6, 3.4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffdd6b';
      ctx.beginPath(); ctx.ellipse(px, py, 3.6, 2.6, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  // sheen down one side so the body does not read flat
  const sh = ctx.createLinearGradient(0, 0, S * 0.55, 0);
  sh.addColorStop(0, 'rgba(255,255,255,.30)');
  sh.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sh;
  ctx.fillRect(0, 0, S * 0.55, S);

  // calyx: green star across the pole band, plus a stub of stem at the centre
  ctx.fillStyle = '#3f9a3a';
  ctx.beginPath();
  for (let i = 0; i <= 64; i++) {
    const x = (i / 64) * S;
    const leaf = Math.abs(Math.cos((i / 64) * Math.PI * 6));
    ctx.lineTo(x, S * (0.055 + 0.085 * leaf));
  }
  ctx.lineTo(S, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2e7a2c';
  ctx.fillRect(0, 0, S, S * 0.035);
  return finishTexture(c);
}

function lycheeTexture(t) {
  const S = 256, [c, ctx] = newCanvas(S);
  ctx.fillStyle = t.base;
  ctx.fillRect(0, 0, S, S);
  // soft mottling
  for (let i = 0; i < 180; i++) {
    ctx.globalAlpha = 0.05 + Math.random() * 0.09;
    ctx.fillStyle = Math.random() < 0.5 ? t.dark : t.light;
    const x = Math.random() * S, y = Math.random() * S, r = 6 + Math.random() * 16;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // blush ring around the pole -> reads as the dimple on top
  const band = ctx.createLinearGradient(0, 0, 0, S * 0.13);
  band.addColorStop(0, t.speck);
  band.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = band;
  ctx.fillRect(0, 0, S, S * 0.13);
  return finishTexture(c);
}

// Cut face of a watermelon slice: red flesh, pale pith ring, green rind,
// seeds scattered off-centre so it does not look stamped.
function watermelonCapTexture(t) {
  const S = 256, [c, ctx] = newCanvas(S);
  const cx = S / 2, cy = S / 2, R = S / 2;

  ctx.fillStyle = t.speck;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = t.dark;
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.965, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f2fbd6';
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.86, 0, Math.PI * 2); ctx.fill();

  const g = ctx.createRadialGradient(cx - R * 0.22, cy - R * 0.26, R * 0.1, cx, cy, R * 0.83);
  g.addColorStop(0, t.light);
  g.addColorStop(0.6, t.base);
  g.addColorStop(1, '#d81b32');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.8, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#2a1a10';
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2 + 0.4;
    const d = R * (0.3 + (i % 3) * 0.16);
    ctx.save();
    ctx.translate(cx + Math.cos(a) * d, cy + Math.sin(a) * d);
    ctx.rotate(a + 1.2);
    ctx.beginPath(); ctx.ellipse(0, 0, R * 0.055, R * 0.033, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  return finishTexture(c);
}

// Striped rind for the curved side of the slice.
function watermelonRindTexture(t) {
  const S = 128, [c, ctx] = newCanvas(S);
  ctx.fillStyle = '#5ec24f';
  ctx.fillRect(0, 0, S, S);
  ctx.fillStyle = t.dark;
  for (let x = 0; x < S; x += 16) {
    ctx.beginPath();
    for (let y = 0; y <= S; y += 8) ctx.lineTo(x + Math.sin(y * 0.09) * 3, y);
    for (let y = S; y >= 0; y -= 8) ctx.lineTo(x + 7 + Math.sin(y * 0.09) * 3, y);
    ctx.closePath(); ctx.fill();
  }
  const tex = finishTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.repeat.set(4, 1);
  return tex;
}

function bananaCapTexture(t) {
  const S = 256, [c, ctx] = newCanvas(S);
  ctx.clearRect(0, 0, S, S);
  const cx = S / 2, cy = S / 2, R = S / 2;
  // peel edge
  ctx.fillStyle = t.dark;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
  // flesh
  const g = ctx.createRadialGradient(cx - R * 0.2, cy - R * 0.25, R * 0.1, cx, cy, R * 0.92);
  g.addColorStop(0, '#fffbe0');
  g.addColorStop(0.65, t.light);
  g.addColorStop(1, t.base);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.88, 0, Math.PI * 2); ctx.fill();
  // three-lobed core with seeds
  ctx.fillStyle = 'rgba(210,165,60,.5)';
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.24, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(180,135,45,.55)';
  ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * Math.PI * 2 - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * R * 0.24, cy + Math.sin(a) * R * 0.24);
    ctx.stroke();
    ctx.fillStyle = 'rgba(120,85,25,.75)';
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a + 1.05) * R * 0.12, cy + Math.sin(a + 1.05) * R * 0.12, R * 0.035, 0, Math.PI * 2);
    ctx.fill();
  }
  return finishTexture(c);
}

// A sphere pushed out along a repeating 3D wave: real bumps, so the
// blackberry keeps its texture from the overhead camera angle.
function bumpySphere(freq, amp, wSeg, hSeg) {
  const geo = new THREE.SphereGeometry(1, wSeg, hSeg);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = v.clone().normalize();
    const bump = Math.sin(n.x * freq) * Math.sin(n.y * freq) * Math.sin(n.z * freq);
    v.setLength(1 + bump * amp);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

// A strawberry is widest at the shoulders and narrows towards the tip, so
// the sphere is squeezed by how far below the equator each vertex sits.
function strawberryGeo() {
  const geo = new THREE.SphereGeometry(1, 30, 24);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const below = Math.max(0, -v.y);            // 0 at the equator, 1 at the tip
    const squeeze = 1 - 0.62 * below * below;
    pos.setXYZ(i, v.x * squeeze, v.y * 1.06, v.z * squeeze);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

const GEO = {
  berry:  strawberryGeo(),
  lychee: new THREE.SphereGeometry(1, 24, 18),
  melon:  new THREE.CylinderGeometry(1, 1, 1, 34),
  banana: new THREE.CylinderGeometry(1, 1, 1, 30),
};

const MAT = {};
TYPES.forEach(t => {
  if (t.id === 'berry') {
    MAT.berry = new THREE.MeshStandardMaterial({ map: strawberryTexture(t), roughness: 0.28, metalness: 0.04 });
  } else if (t.id === 'lychee') {
    MAT.lychee = new THREE.MeshStandardMaterial({ map: lycheeTexture(t), roughness: 0.34 });
  } else if (t.id === 'melon') {
    // CylinderGeometry groups: side, top, bottom
    const cap = new THREE.MeshStandardMaterial({ map: watermelonCapTexture(t), roughness: 0.36 });
    const rind = new THREE.MeshStandardMaterial({ map: watermelonRindTexture(t), roughness: 0.62 });
    MAT.melon = [rind, cap, cap];
  } else {
    const cap = new THREE.MeshStandardMaterial({ map: bananaCapTexture(t), roughness: 0.32 });
    const side = new THREE.MeshStandardMaterial({ color: t.dark, roughness: 0.55 });
    MAT.banana = [side, cap, cap];
  }
});

// Sliced fruit are cylinders centred on their own origin, so they sit at
// half their height; round fruit sit on the ground at y = radius.
const SLICE_H = { banana: 0.5, melon: 0.62 };

function fruitVisual(type, radius) {
  const h = SLICE_H[type];
  if (h) {
    const sy = radius * h;
    return { geo: GEO[type], mat: MAT[type], sx: radius, sy, baseY: sy / 2 };
  }
  return { geo: GEO[type], mat: MAT[type], sx: radius, sy: radius, baseY: radius };
}

const NORMAL_R = 0.50, BIG_R = 0.72;   // cell is 1.05, so fruit almost touches

const ROCK_GEO = bumpySphere(5, 0.16, 18, 12);
ROCK_GEO.scale(1, 0.72, 1);
function rockTexture() {
  const S = 128, [c, ctx] = newCanvas(S);
  ctx.fillStyle = '#8d8f96';
  ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 150; i++) {
    ctx.globalAlpha = 0.1 + Math.random() * 0.25;
    ctx.fillStyle = Math.random() < 0.5 ? '#6b6d74' : '#b3b6bd';
    const x = Math.random() * S, y = Math.random() * S, r = 2 + Math.random() * 7;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  return finishTexture(c);
}
const ROCK_MAT = new THREE.MeshStandardMaterial({ map: rockTexture(), roughness: 0.95 });

// ---------------------------------------------------------------------
// Ground
// ---------------------------------------------------------------------
function groundTexture() {
  const S = 256, [c, ctx] = newCanvas(S);
  ctx.fillStyle = '#f7cf95';
  ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 2400; i++) {
    ctx.globalAlpha = 0.03 + Math.random() * 0.05;
    ctx.fillStyle = Math.random() < 0.5 ? '#e6b877' : '#ffe6bb';
    const x = Math.random() * S, y = Math.random() * S, r = 1 + Math.random() * 2.6;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const tex = finishTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(14, 14);
  return tex;
}
// The sand is an island in turquoise water rather than sand to the horizon:
// it ties the board to the app icon, and it gives the field a visible edge —
// before this you could not tell where the board stopped.
const WATER = '#22c9cd';
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: WATER, roughness: 0.35, metalness: 0.05 })
);
water.rotation.x = -Math.PI / 2;
water.position.y = -0.06;
scene.add(water);

// Foam ring just inside the shoreline, so the two colours do not meet on a
// hard edge at this camera distance.
const shore = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({ color: '#bff3f5' })
);
shore.rotation.x = -Math.PI / 2;
shore.position.y = -0.03;
scene.add(shore);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshStandardMaterial({ map: groundTexture(), roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Called whenever the field changes size; the beach keeps a constant margin
// so the hole always has somewhere to stand at the edge of the board.
function fitGround() {
  const w = fieldHalfX * 2 + 3.0;
  const h = fieldHalfZ * 2 + 3.0;
  ground.scale.set(w, h, 1);
  shore.scale.set(w + 1.4, h + 1.4, 1);
}

// ---------------------------------------------------------------------
// Field
// ---------------------------------------------------------------------
const CELL = 1.05;
let fieldHalfX = (COLS * CELL) / 2;
let fieldHalfZ = (rows * CELL) / 2;
const fieldGroup = new THREE.Group();
scene.add(fieldGroup);
let fruits = [];
let eatenCount = 0;
let levelGoal = 0;   // fruit that must be eaten to finish the level
let rocks = [];   // never edible, and they block the hole -- they shape the route

// Levels keep going after the pattern list runs out; each full cycle is a
// harder tier with less time and more rocks in the way.
function tier() { return Math.floor((level - 1) / PATTERNS.length); }

function gridToWorld(row, col) {
  return {
    x: (col - (COLS - 1) / 2) * CELL,
    z: (row - (rows - 1) / 2) * CELL,
  };
}

// ---------------------------------------------------------------------
// Level patterns
//
// Levels are laid out by hand rather than scattered at random: each one
// puts the types into a readable shape, so a field looks planted instead
// of noisy and you can plan a route through it. Levels cycle through the
// list, so the shape tells you which level you are on.
//
//   type(r, c) -> type id for that cell
//   big(r, c)  -> true if the cell holds an oversized fruit (optional;
//                 oversized fruit needs a grown hole, so where they sit
//                 is what actually shapes the route)
// ---------------------------------------------------------------------
const ID = TYPES.map(t => t.id);
function midCol() { return (COLS - 1) / 2; }
function midRow() { return (rows - 1) / 2; }
function scatter(chance) { return Math.random() < chance; }

// Value noise: smooth, repeatable blobs. Regions grown from this have
// ragged edges, which is what makes a field look planted rather than
// printed -- straight rows of one fruit read as a spreadsheet.
function noiseAt(x, y, seed) {
  const rand = (xi, yi) => {
    const n = Math.sin(xi * 127.1 + yi * 311.7 + seed * 74.7) * 43758.5453;
    return n - Math.floor(n);
  };
  const smooth = t => t * t * (3 - 2 * t);
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const a = rand(xi, yi), b = rand(xi + 1, yi);
  const c = rand(xi, yi + 1), d = rand(xi + 1, yi + 1);
  const u = smooth(xf), v = smooth(yf);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

// Two octaves: big shapes with a little fray along their borders.
function blob(r, c, scale, seed) {
  return noiseAt(c * scale, r * scale, seed) * 0.72 +
         noiseAt(c * scale * 2.7, r * scale * 2.7, seed + 19) * 0.28;
}

function typeFromNoise(r, c, scale, seed) {
  // value noise bunches around the middle, so stretch the useful band
  // across all four types instead of leaving the outer two rare
  const n = (blob(r, c, scale, seed) - 0.26) / 0.48;
  return ID[Math.min(3, Math.max(0, Math.floor(n * 4)))];
}

// Clearings: patches of bare ground, so the field is not a solid carpet.
function clearing(r, c, seed, cut) {
  return blob(r, c, 0.18, seed + 51) < cut;
}

// Each level is one big shape sitting on open ground, not a carpet that
// fills the board. `empty` carves the silhouette; `type` only decides
// which fruit sits where inside it. Edges get a noise wobble so the
// outline is hand-drawn rather than stamped.
function shapeCoords(r, c) {
  return {
    nx: (c - midCol()) / (COLS / 2),
    ny: (r - midRow()) / (rows / 2),
    wob: (blob(r, c, 0.45, 91) - 0.5) * 0.22,
  };
}

// Sampling noise at a block's corner makes the whole block one fruit, so
// regions come out rectangular instead of rounded -- the packed-crate look.
function blockType(r, c, bw, bh, seed) {
  return typeFromNoise(Math.floor(r / bh) * bh, Math.floor(c / bw) * bw, 0.45, seed);
}

// Quantising a coordinate before a shape test turns a smooth outline into
// a staircase, which is how a dense field of boxes actually ends.
function stepped(v, size) { return Math.floor(v / size) * size; }

const PATTERNS = [
  {
    name: 'Pyramid', icon: '🔺',
    // wide at the bottom, narrowing to a point at the top -- and piled
    // higher toward the middle, so it is a pyramid from the side too
    empty: (r, c) => {
      const { nx, ny, wob } = shapeCoords(r, c);
      return ny > 0.82 || Math.abs(nx) > (ny + 1) * 0.46 + wob;
    },
    stack: (r, c) => {
      const { nx, ny } = shapeCoords(r, c);
      const edge = (ny + 1) * 0.46;
      return 1 + Math.round(Math.max(0, 1 - Math.abs(nx) / Math.max(0.15, edge)) * 2.4);
    },
    type: (r, c) => typeFromNoise(r, c, 0.2, 3),
    big: (r, c) => blob(r, c, 0.5, 71) > 0.72,
  },
  {
    name: 'Piles', icon: '🥞',
    // sparse ground with tall piles dotted across it
    empty: (r, c) => !(r % 2 === 1 && c % 2 === 1) || blob(r, c, 0.35, 13) < 0.32,
    stack: (r, c) => 2 + Math.round(blob(r, c, 0.4, 29) * 3),
    type: (r, c) => typeFromNoise(r, c, 0.5, 29),
    big: () => false,
  },
  {
    name: 'Walls', icon: '🧱',
    // winding walls with open corridors to work along
    empty: (r, c) => Math.abs(blob(r, c, 0.19, 77) - 0.5) > 0.11,
    stack: (r, c) => 1 + Math.round(blob(r, c, 0.5, 41) * 1.6),
    type: (r, c) => typeFromNoise(r, c, 0.28, 77),
    big: (r, c) => blob(r, c, 0.45, 9) > 0.76,
  },
  {
    name: 'Blocks', icon: '🧊',
    // rectangular crates of one fruit, mass ending in a stepped edge
    empty: (r, c) => {
      const qr = stepped(r, 3), qc = stepped(c, 3);
      const nx = (qc - midCol()) / (COLS / 2), ny = (qr - midRow()) / (rows / 2);
      return Math.abs(nx) > 0.94 || ny > 0.55 || ny < -0.95;
    },
    type: (r, c) => blockType(r, c, 4, 3, 55),
    stack: (r, c) => 1 + Math.round(blob(stepped(r, 3), stepped(c, 3), 0.5, 67) * 1.8),
    big: (r, c) => blockType(r, c, 4, 3, 55) === 'melon' && r % 3 === 1 && c % 4 === 2,
  },
  {
    name: 'Stairs', icon: '🪜',
    // the mass descends across the board in broad steps
    empty: (r, c) => {
      const stepH = 3;
      const line = midCol() + (stepped(r, stepH) - midRow()) * 0.55;
      return c < line - 5.5 || c > line + 5.5;
    },
    type: (r, c) => blockType(r, c, 3, 3, 83),
    stack: (r, c) => 1 + Math.round(blob(r, c, 0.45, 21) * 2),
    big: (r, c) => blob(r, c, 0.4, 47) > 0.76,
  },
  {
    name: 'Heart', icon: '💛',
    empty: (r, c) => {
      const { nx, ny, wob } = shapeCoords(r, c);
      const x = nx / 0.9, y = -ny / 0.85 + 0.28;
      const s = x * x + y * y - 1;
      return s * s * s - x * x * y * y * y > wob * 2;
    },
    type: (r, c) => typeFromNoise(r, c, 0.22, 61),
    big: (r, c) => blob(r, c, 0.4, 12) > 0.74,
  },
  {
    name: 'Star', icon: '⭐',
    empty: (r, c) => {
      const { nx, ny, wob } = shapeCoords(r, c);
      const d = Math.hypot(nx, ny * 0.95);
      const a = Math.atan2(ny, nx);
      return d > (0.55 + 0.4 * Math.cos(5 * a - Math.PI / 2)) + wob;
    },
    type: (r, c) => typeFromNoise(r, c, 0.34, 7),
    big: (r, c) => blob(r, c, 0.45, 88) > 0.74,
  },
  {
    name: 'Island', icon: '🏝️',
    // a ragged blob, the least regular of the set
    empty: (r, c) => {
      const { nx, ny } = shapeCoords(r, c);
      const d = Math.hypot(nx, ny * 0.9);
      return d > 0.55 + (blob(r, c, 0.3, 11) - 0.5) * 0.9;
    },
    type: (r, c) => typeFromNoise(r, c, 0.2, 11),
    big: (r, c) => blob(r, c, 0.45, 5) > 0.73,
  },
  {
    name: 'Ring', icon: '🎯',
    empty: (r, c) => {
      const { nx, ny, wob } = shapeCoords(r, c);
      const d = Math.hypot(nx, ny * 0.95);
      return d > 0.92 + wob || d < 0.42 + wob;
    },
    type: (r, c) => typeFromNoise(r, c, 0.26, 43),
    // a band of oversized fruit around the outer rim of the ring
    big: (r, c) => {
      const { nx, ny } = shapeCoords(r, c);
      const d = Math.hypot(nx, ny * 0.95);
      return d > 0.8 && d < 0.87;
    },
  },
  {
    name: 'Diamond', icon: '💎',
    empty: (r, c) => {
      const { nx, ny, wob } = shapeCoords(r, c);
      return Math.abs(nx) + Math.abs(ny) * 0.9 > 0.9 + wob;
    },
    type: (r, c) => typeFromNoise(r, c, 0.22, 31),
    big: (r, c) => blob(r, c, 0.4, 19) > 0.75,
  },
  {
    name: 'Spiral', icon: '🌀',
    // an arm curling out from the middle
    empty: (r, c) => {
      const { nx, ny, wob } = shapeCoords(r, c);
      const d = Math.hypot(nx, ny * 0.95);
      if (d > 1 || d < 0.1) return true;
      const a = Math.atan2(ny, nx) + d * 4.2;
      return Math.abs(Math.sin(a)) > 0.55 + wob;
    },
    type: (r, c) => typeFromNoise(r, c, 0.3, 17),
    big: () => scatter(0.1),
  },
  {
    name: 'Cross', icon: '🔀',
    // two broad bands crossing, leaving four open corners
    empty: (r, c) => {
      const { nx, ny, wob } = shapeCoords(r, c);
      if (Math.abs(nx) > 0.95 || Math.abs(ny) > 0.92) return true;
      return Math.abs(nx - ny) > 0.42 + wob && Math.abs(nx + ny) > 0.42 + wob;
    },
    type: (r, c) => typeFromNoise(r, c, 0.24, 97),
    big: (r, c) => blob(r, c, 0.42, 33) > 0.74,
  },
];

// Rocks replace fruit cells, so the field never gains cells the level
// goal counts -- clearing still means "every fruit eaten".
function placeRocks() {
  rocks = [];
  const count = level < 3 ? 0 : Math.min(40, 6 + tier() * 6 + Math.floor((level % PATTERNS.length) / 2) * 2);
  if (!count) return;
  const taken = new Set();
  // keep the bottom row clear: that is where the hole starts
  for (let i = 0; i < count * 6 && rocks.length < count; i++) {
    const r = Math.floor(Math.random() * (rows - 2));
    const c = Math.floor(Math.random() * COLS);
    const key = r + '_' + c;
    if (taken.has(key)) continue;
    taken.add(key);
    rocks.push({ row: r, col: c });
  }
}

function buildField() {
  fieldGroup.clear();
  fruits = [];
  eatenCount = 0;
  fieldHalfX = (COLS * CELL) / 2;
  fieldHalfZ = (rows * CELL) / 2;
  fitGround();
  currentPattern = PATTERNS[(level - 1) % PATTERNS.length];
  placeRocks();
  const rockAt = new Set(rocks.map(k => k.row + '_' + k.col));

  for (const k of rocks) {
    const { x, z } = gridToWorld(k.row, k.col);
    const radius = 0.5;
    const mesh = new THREE.Mesh(ROCK_GEO, ROCK_MAT);
    mesh.scale.setScalar(radius);
    mesh.position.set(x, radius * 0.72, z);
    mesh.rotation.y = Math.random() * Math.PI * 2;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    fieldGroup.add(mesh);
    k.x = x; k.z = z; k.r = radius;
  }

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < COLS; c++) {
      if (rockAt.has(r + '_' + c)) continue;
      if (currentPattern.empty && currentPattern.empty(r, c)) continue;
      const type = currentPattern.type(r, c);
      const big = currentPattern.big ? currentPattern.big(r, c) : scatter(0.12);
      const radius = big ? BIG_R : NORMAL_R;
      const vis = fruitVisual(type, radius);
      const { x, z } = gridToWorld(r, c);

      // A cell can hold a pile. Each fruit in it is its own entry, so the
      // hole takes the whole stack as it passes and the pile drops in.
      const height = currentPattern.stack ? Math.max(1, currentPattern.stack(r, c)) : 1;
      for (let k = 0; k < height; k++) {
        const mesh = new THREE.Mesh(vis.geo, vis.mat);
        const y = vis.baseY + k * vis.sy * 1.7;
        mesh.scale.set(vis.sx, vis.sy, vis.sx);
        mesh.position.set(x, y, z);
        mesh.rotation.y = Math.random() * Math.PI * 2;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        fieldGroup.add(mesh);
        fruits.push({ mesh, x, z, r: radius, type, big, eaten: false, baseY: y, nudge: 0 });
      }
    }
  }
  // A level ends when every fruit on the field has been eaten.
  levelGoal = fruits.length;
}

// ---------------------------------------------------------------------
// Hole
// ---------------------------------------------------------------------
const BASE_HOLE_R = 0.62;
const HOLE_MAX = BASE_HOLE_R + 2.2;
let holeRadius = BASE_HOLE_R;
let holeX = 0, holeZ = 0;
let holeGroup;

// The ground is a solid plane, so the pit cannot be real geometry without
// a stencil cut-out. From this near-overhead camera a disc painted as a
// brick shaft falling away into darkness reads as depth just as well.
function holeInteriorTexture() {
  const S = 256, [c, ctx] = newCanvas(S);
  const cx = S / 2, cy = S / 2, R = S / 2;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = '#5c3517';
  ctx.fillRect(0, 0, S, S);
  const rings = 5;
  for (let i = 0; i < rings; i++) {
    const r0 = R * (1 - i / rings), r1 = R * (1 - (i + 1) / rings);
    const seg = 14 + i * 2;
    for (let s = 0; s < seg; s++) {
      const a0 = (s / seg) * Math.PI * 2 + (i % 2 ? Math.PI / seg : 0);
      const a1 = a0 + (Math.PI * 2 / seg) * 0.86;
      ctx.fillStyle = ['#6b3d18', '#5a3213', '#7a4a20'][s % 3];
      ctx.beginPath();
      ctx.arc(cx, cy, r0, a0, a1);
      ctx.arc(cx, cy, r1, a1, a0, true);
      ctx.closePath(); ctx.fill();
    }
  }
  const g = ctx.createRadialGradient(cx, cy, R * 0.04, cx, cy, R);
  g.addColorStop(0, 'rgba(0,0,0,1)');
  g.addColorStop(0.45, 'rgba(0,0,0,.94)');
  g.addColorStop(1, 'rgba(0,0,0,.18)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  ctx.restore();
  return finishTexture(c);
}
const HOLE_INTERIOR_MAT = new THREE.MeshBasicMaterial({ map: holeInteriorTexture() });

function buildHole() {
  if (holeGroup) scene.remove(holeGroup);
  holeGroup = new THREE.Group();
  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(BASE_HOLE_R, 0.14, 14, 32),
    new THREE.MeshStandardMaterial({ color: '#f59321', roughness: 0.42 })
  );
  rim.rotation.x = Math.PI / 2;
  rim.position.y = 0.02;
  rim.castShadow = true;
  const inner = new THREE.Mesh(
    new THREE.CircleGeometry(BASE_HOLE_R * 0.92, 32),
    HOLE_INTERIOR_MAT
  );
  inner.rotation.x = -Math.PI / 2;
  inner.position.y = 0.03;
  holeGroup.add(rim, inner);
  scene.add(holeGroup);
}

function resetHole() {
  holeRadius = BASE_HOLE_R + (sizeStage - 1) * 0.05 + upg('size') * 0.06;
  holeX = 0;
  holeZ = fieldHalfZ * 0.55;
  buildHole();
}

// ---------------------------------------------------------------------
// Camera
// ---------------------------------------------------------------------
let camX = 0, camZ = 0;
// The field is only seven columns wide, so the width sets the zoom -- that
// keeps fruit a readable size on a phone instead of shrinking it to fit a
// tall screen. Height then follows from the aspect ratio.
function fitCamera() {
  const aspect = innerWidth / innerHeight;
  const halfH = 5.4;   // fixed view width; the field runs past it and the camera travels
  const halfV = halfH / aspect;
  camera.left = -halfH; camera.right = halfH;
  camera.top = halfV; camera.bottom = -halfV;
  camera.updateProjectionMatrix();
}

// Keep the view inside the field: following the hole to the very edge
// would otherwise park half the screen on empty ground.
// The camera used to stop right at the last row, so the board looked like
// it went on forever. It may now overshoot far enough to put the beach and
// the water's edge on screen — that is what tells you where the field ends.
function clampCamera() {
  const limX = Math.max(0, fieldHalfX + 4 - camera.right);
  const limZ = Math.max(0, fieldHalfZ + 4 - camera.top);
  camX = Math.max(-limX, Math.min(limX, camX));
  camZ = Math.max(-limZ, Math.min(limZ, camZ));
}
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  fitCamera();
}
addEventListener('resize', resize);

// ---------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------
let state = 'menu';           // 'menu' | 'playing' | 'won' | 'lost'
let timeLeft = 0;
let lastWholeSecond = -1;
let streak = 0, lastEatAt = -9999;
let runStart = 0;
let revivedThisLevel = false;

function levelTime() {
  // A grown hole sweeps several columns per pass, so the clock scales
  // with the area to cover rather than with the fruit count.
  const base = Math.round(60 + levelGoal * 0.35);
  const squeeze = 1 - Math.min(0.28, tier() * 0.07);   // later cycles are tighter
  return Math.round(base * squeeze) + upg('time') * 5;
}

// Stars reflect how much time is still on the clock, so clearing fast is
// worth more than clearing at all. Shown live during play, awarded on clear.
function liveStars() {
  const ratio = timeLeft / Math.max(1, levelTime());
  return ratio >= 0.45 ? 3 : ratio >= 0.2 ? 2 : 1;
}

let lastProgPct = -1, lastStarCount = -1;
function updateProgressUI() {
  const pct = levelGoal ? Math.min(100, Math.round((eatenCount / levelGoal) * 100)) : 0;
  if (pct !== lastProgPct) { progFillEl.style.width = pct + '%'; lastProgPct = pct; }
  if (state !== 'playing') return;
  const s = liveStars();
  if (s !== lastStarCount) {
    lastStarCount = s;
    [...starRowEl.children].forEach((el, i) => el.classList.toggle('on', i < s));
  }
}

// ---------------------------------------------------------------------
// Size badge
//
// Rides under the hole in screen space: the hole's world position is
// projected through the camera every frame, so the badge tracks it as
// the camera moves and the hole grows.
// ---------------------------------------------------------------------
const sizeTagEl = document.getElementById('sizeTag');
const sizeNEl = document.getElementById('sizeN');
const _proj = new THREE.Vector3();
let shownSize = 0;

function holeSizeStep() { return 1 + Math.floor((holeRadius - BASE_HOLE_R) / 0.2); }

function updateSizeTag() {
  const step = holeSizeStep();
  if (step !== shownSize) {
    shownSize = step;
    sizeNEl.textContent = step;
    sizeTagEl.classList.remove('grow');
    void sizeTagEl.offsetWidth;
    sizeTagEl.classList.add('grow');
  }
  // bottom edge of the hole, then a little further down
  _proj.set(holeX, 0, holeZ + holeRadius + 0.35).project(camera);
  sizeTagEl.style.left = ((_proj.x * 0.5 + 0.5) * innerWidth) + 'px';
  sizeTagEl.style.top = ((-_proj.y * 0.5 + 0.5) * innerHeight) + 'px';
}

function flash(text) {
  comboEl.textContent = text;
  comboEl.classList.remove('show');
  void comboEl.offsetWidth;
  comboEl.classList.add('show');
}
function showCombo(mult) { flash(`x${mult} COMBO!`); }

// ---------------------------------------------------------------------
// Booster bar
// ---------------------------------------------------------------------
let magnetBoostUntil = 0;

function renderBoosters() {
  boosterBarEl.innerHTML = '';
  // Locked slots are left out entirely: a row of "Lvl 7" plates reads as
  // nothing to a new player and sits on top of the fruit it hides. The
  // booster announces itself when it unlocks instead.
  BOOSTERS.filter(boosterUnlocked).forEach(b => {
    const n = boosters[b.id] || 0;
    const btn = document.createElement('button');
    btn.className = 'slot' + (n <= 0 ? ' empty' : '');
    btn.innerHTML = b.icon + (n > 0 ? `<span class="badge">${n}</span>` : '');
    btn.disabled = n <= 0;
    btn.onclick = () => useBooster(b);
    boosterBarEl.appendChild(btn);
  });
}

function useBooster(b) {
  if (state !== 'playing' || !boosterUnlocked(b) || (boosters[b.id] || 0) <= 0) return;
  boosters[b.id]--;
  saveBoosters();

  if (b.id === 'time') {
    timeLeft += 15;
    lastWholeSecond = -1;
    updateTimeUI();
  } else if (b.id === 'grow') {
    holeRadius = Math.min(HOLE_MAX, holeRadius + 0.4);
  } else if (b.id === 'magnet') {
    magnetBoostUntil = performance.now() + 8000;
  }

  sfx.booster();
  flash(`${b.icon} ${b.desc}`);
  renderBoosters();
}

function startLevel() {
  sizeStage = level;
  rows = Math.min(22 + Math.floor((level - 1) / 2) * 2, 34);
  buildField();
  resetHole();
  camX = holeX; camZ = holeZ;
  fitCamera();
  timeLeft = levelTime();
  lastWholeSecond = -1;
  streak = 0;
  revivedThisLevel = false;
  runStart = performance.now();
  showBanner();
  refreshLevelTag();
  updateTimeUI();
  lastProgPct = -1; lastStarCount = -1;
  updateProgressUI();
  magnetBoostUntil = 0;
  renderBoosters();
  boosterBarEl.classList.add('show');
  shownSize = 0;
  sizeTagEl.classList.add('show');
  parkJoystick();
  joyBaseEl.classList.add('show'); joyKnobEl.classList.add('show');
  menuEl.classList.remove('show');
  upgradesEl.classList.remove('show');
  overlayEl.classList.remove('show');
  topbarEl.classList.add('show');
  hintEl.style.opacity = '.8';
  state = 'playing';
}

function updateTimeUI() {
  const s = Math.max(0, Math.ceil(timeLeft));
  if (s !== lastWholeSecond) {
    lastWholeSecond = s;
    timeNEl.textContent = s >= 60
      ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0')
      : String(s);
    if (s <= 10 && s > 0 && state === 'playing') sfx.tick();
  }
  timeTagEl.classList.toggle('low', s <= 10);
}

function showOverlay(title, sub, btnText, action, offerRevive) {
  overlayTitleEl.textContent = title;
  overlaySubEl.textContent = sub;
  actionBtnEl.textContent = btnText;
  actionBtnEl.onclick = action;
  actionBtnEl.classList.toggle('ghost', !!offerRevive);
  reviveBtnEl.hidden = !offerRevive;
  boosterBarEl.classList.remove('show');
  sizeTagEl.classList.remove('show');
  joyBaseEl.classList.remove('show'); joyKnobEl.classList.remove('show');
  overlayEl.classList.add('show');
}

// One rewarded continue per level: watch an ad, get 15 more seconds and
// carry on with the field exactly as it was.
async function revive() {
  if (revivedThisLevel || state !== 'lost') return;
  reviveBtnEl.disabled = true;
  const ok = await showRewarded();
  reviveBtnEl.disabled = false;
  if (!ok) return;
  revivedThisLevel = true;
  timeLeft = 15;
  lastWholeSecond = -1;
  updateTimeUI();
  overlayEl.classList.remove('show');
  boosterBarEl.classList.add('show');
  sizeTagEl.classList.add('show');
  joyBaseEl.classList.add('show'); joyKnobEl.classList.add('show');
  state = 'playing';
}
reviveBtnEl.addEventListener('click', revive);

// An interstitial every third level, shown on the way into the next one
// rather than over the win screen.
function nextLevel() {
  if (level % 3 === 1 && level > 1) showInterstitial();
  startLevel();
}

function fillStats(earnedStars) {
  const secs = Math.round((performance.now() - runStart) / 1000);
  const starLine = earnedStars
    ? `<span class="pill">${'★'.repeat(earnedStars)}${'☆'.repeat(3 - earnedStars)}</span>`
    : '';
  overlayStatsEl.innerHTML = starLine +
    `<span class="pill">🍇 ${eatenCount} fruit</span>` +
    `<span class="pill">⏱ ${secs}s</span>`;
}

function onCleared() {
  if (state !== 'playing') return;
  const cleared = level;
  const earned = liveStars();
  state = 'won';
  sfx.win();
  fillStats(earned);

  const prevBest = stars[cleared] || 0;
  const isBest = earned > prevBest;
  if (isBest) { stars[cleared] = earned; saveStars(); }

  stats.levels++;
  stats.stars += earned;
  daily.levels = (daily.levels || 0) + 1;
  daily.stars = (daily.stars || 0) + earned;
  saveStats();
  saveDaily();
  refreshGoalsBadge();

  level++;
  localStorage.setItem('fruithole_level', String(level));
  refreshMenuLevel();
  const sub = isBest && prevBest > 0 ? 'New best!' : `Next: level ${level}`;
  showOverlay('Level Complete! 🎉', sub, 'Next', nextLevel, false);
}

function onTimeUp() {
  if (state !== 'playing') return;
  state = 'lost';
  sfx.lose();
  fillStats();
  const left = Math.max(0, levelGoal - eatenCount);
  showOverlay("Time's Up! ⏱", `${left} fruit left`, 'Retry', startLevel, !revivedThisLevel);
}

// ---------------------------------------------------------------------
// Eating
// ---------------------------------------------------------------------
function checkEat(now) {
  for (const f of fruits) {
    if (f.eaten) continue;
    const dx = f.x - holeX, dz = f.z - holeZ;
    const dist = Math.hypot(dx, dz);
    if (dist > holeRadius + f.r) continue;
    if (f.r <= holeRadius * 0.92) {
      // over the opening is enough -- it falls in. Demanding a near-exact
      // pass over each centre made sweeping a field far too slow.
      if (dist < holeRadius * 0.95) eatFruit(f, now);
    } else if (dist < holeRadius && f.nudge <= 0) {
      f.nudge = 0.28;
      sfx.blocked();
    }
  }
}

function eatFruit(f, now) {
  f.eaten = true;
  eatenCount++;
  // chaining eats pays a multiplier, so sweeping a same-type patch in one
  // pass is worth more than picking fruit off one at a time
  streak = (now - lastEatAt < 900) ? streak + 1 : 1;
  lastEatAt = now;
  const mult = Math.min(5, 1 + Math.floor(streak / 4));
  bumpCurrency(f.type, mult);
  stats.fruits++;
  daily.fruits = (daily.fruits || 0) + 1;
  if (mult > stats.bestCombo) stats.bestCombo = mult;
  if (mult > (daily.bestCombo || 0)) daily.bestCombo = mult;
  if (mult >= 2 && streak % 4 === 0) showCombo(mult);
  updateProgressUI();
  sfx.eat(streak);
  // clamp must never shrink a hole that already starts above the cap
  if (holeRadius < HOLE_MAX) holeRadius = Math.min(holeRadius + (f.big ? 0.05 : 0.017), HOLE_MAX);

  const mesh = f.mesh;
  const t0 = performance.now();
  const startPos = mesh.position.clone();
  const startScale = mesh.scale.clone();
  const dur = 180;
  (function step(t) {
    const p = Math.min(1, (t - t0) / dur);
    mesh.position.set(
      startPos.x + (holeX - startPos.x) * p,
      startPos.y * (1 - p),
      startPos.z + (holeZ - startPos.z) * p
    );
    mesh.scale.set(startScale.x * (1 - p), startScale.y * (1 - p), startScale.z * (1 - p));
    if (p < 1) requestAnimationFrame(step);
    else {
      fieldGroup.remove(mesh);
      if (eatenCount >= levelGoal) onCleared();
    }
  })(t0);
}

// ---------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------
let touchId = null, joyBaseX = 0, joyBaseY = 0;
let joyX = 0, joyY = 0;
const MAX_JOY = 55;

// The stick sits at the bottom of the screen when idle, the way the other
// hole games show it, and only jumps to the finger while a drag is live.
function parkJoystick() {
  const x = innerWidth / 2;
  const y = innerHeight - 132;
  joyBaseEl.style.left = x + 'px'; joyBaseEl.style.top = y + 'px';
  joyKnobEl.style.left = x + 'px'; joyKnobEl.style.top = y + 'px';
}
addEventListener('resize', parkJoystick);

app.addEventListener('pointerdown', (e) => {
  if (state !== 'playing') return;
  if (e.target.closest && e.target.closest('button')) return;
  touchId = e.pointerId;
  joyBaseX = e.clientX; joyBaseY = e.clientY;
  joyBaseEl.style.left = joyBaseX + 'px'; joyBaseEl.style.top = joyBaseY + 'px';
  joyKnobEl.style.left = joyBaseX + 'px'; joyKnobEl.style.top = joyBaseY + 'px';
  joyBaseEl.classList.add('drag'); joyKnobEl.classList.add('drag');
  app.setPointerCapture(e.pointerId);
  hintEl.style.opacity = '0';
});
app.addEventListener('pointermove', (e) => {
  if (e.pointerId !== touchId) return;
  let dx = e.clientX - joyBaseX, dy = e.clientY - joyBaseY;
  const len = Math.hypot(dx, dy);
  if (len > MAX_JOY) { dx = dx / len * MAX_JOY; dy = dy / len * MAX_JOY; }
  joyKnobEl.style.left = (joyBaseX + dx) + 'px';
  joyKnobEl.style.top = (joyBaseY + dy) + 'px';
  joyX = dx / MAX_JOY; joyY = dy / MAX_JOY;
});
function endDrag(e) {
  if (e.pointerId !== touchId) return;
  touchId = null; joyX = 0; joyY = 0;
  joyBaseEl.classList.remove('drag'); joyKnobEl.classList.remove('drag');
  parkJoystick();
}
app.addEventListener('pointerup', endDrag);
app.addEventListener('pointercancel', endDrag);

document.getElementById('playBtn').addEventListener('click', () => { ensureAudio(); startLevel(); });

// ---------------------------------------------------------------------
// Boot + main loop
// ---------------------------------------------------------------------
buildField();
resetHole();
camX = holeX; camZ = holeZ;
resize();
document.getElementById('loading').style.display = 'none';
refreshGoalsBadge();
maybeShowDaily();

const BASE_MOVE_SPEED = 3.4;
let lastT = performance.now();

function tick(now) {
  const elapsed = (now - lastT) / 1000;
  const dt = Math.min(0.05, elapsed);   // movement stays stable on frame spikes
  lastT = now;

  if (state === 'playing') {
    // countdown follows wall-clock so it is not slowed by a low frame rate,
    // but a backgrounded tab must not drain the whole clock at once
    timeLeft -= Math.min(0.25, elapsed);
    if (timeLeft <= 0) { timeLeft = 0; updateTimeUI(); onTimeUp(); }
    else updateTimeUI();

    if (joyX || joyY) {
      const speed = BASE_MOVE_SPEED * (1 + upg('speed') * 0.08);
      holeX += joyX * speed * dt;
      holeZ += joyY * speed * dt;
      const mX = fieldHalfX - holeRadius * 0.5;
      const mZ = fieldHalfZ - holeRadius * 0.5;
      holeX = Math.max(-mX, Math.min(mX, holeX));
      holeZ = Math.max(-mZ, Math.min(mZ, holeZ));

      // rocks block the hole: push it back out of any overlap
      for (const k of rocks) {
        const rx = holeX - k.x, rz = holeZ - k.z;
        const d = Math.hypot(rx, rz);
        const minD = k.r + holeRadius * 0.45;
        if (d < minD && d > 0.0001) {
          holeX = k.x + (rx / d) * minD;
          holeZ = k.z + (rz / d) * minD;
        }
      }
    }

    // magnet upgrade: fruit the hole could swallow drifts toward it, so a
    // near miss still counts. Oversized fruit is not pulled -- it has to
    // stay where it is until the hole has grown enough to take it.
    const mag = 0.6 + upg('magnet') * 0.28 + (now < magnetBoostUntil ? 1.6 : 0);
    if (mag > 0) {
      for (const f of fruits) {
        if (f.eaten || f.r > holeRadius * 0.92) continue;
        const dx = holeX - f.x, dz = holeZ - f.z;
        const d = Math.hypot(dx, dz);
        const reach = holeRadius + mag;
        if (d > 0.001 && d < reach) {
          const pull = ((reach - d) / reach) * 3.4 * dt;
          f.x += (dx / d) * pull;
          f.z += (dz / d) * pull;
          f.mesh.position.x = f.x;
          f.mesh.position.z = f.z;
        }
      }
    }

    checkEat(now);
    updateProgressUI();
  }

  // uneatable fruits jiggle when bumped
  for (const f of fruits) {
    if (f.eaten || f.nudge <= 0) continue;
    f.nudge = Math.max(0, f.nudge - dt);
    f.mesh.position.y = f.baseY + Math.sin(f.nudge * 60) * 0.09 * (f.nudge / 0.28);
  }

  holeGroup.position.set(holeX, 0, holeZ);
  const s = holeRadius / BASE_HOLE_R;
  holeGroup.scale.set(s, 1, s);

  camX += (holeX - camX) * 0.09;
  camZ += (holeZ - camZ) * 0.09;
  clampCamera();
  camera.position.set(camX, 14, camZ + 2.0);
  camera.lookAt(camX, 0, camZ);
  camera.updateMatrixWorld();
  if (state === 'playing') updateSizeTag();

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
