<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Fruit Hole</title>
<meta name="theme-color" content="#e8c07d" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fruit Hole" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #e8c07d; }
  #app { position: fixed; inset: 0; touch-action: none; }
  canvas { display: block; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #7a5a2a; font-size: 16px; z-index: 30; background: #e8c07d; }

  /* ---- top bar: level badge left, clock centre, pause right ---- */
  #topbar { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0;
    padding: 10px 12px 0; pointer-events: none; z-index: 5;
    opacity: 0; transition: opacity .25s ease; }
  #topbar.show { opacity: 1; }

  #levelBadge { position: absolute; left: 12px; top: 10px;
    background: #fff8ec; color: #5b2d8e; font-weight: 800; font-size: 15px;
    letter-spacing: .04em; border-radius: 14px; padding: 9px 16px;
    border: 3px solid #6b4fc0; box-shadow: 0 4px 0 rgba(0,0,0,.22); }

  #pauseBtn { position: absolute; right: 12px; top: 10px; pointer-events: auto; cursor: pointer;
    width: 46px; height: 46px; border-radius: 14px; font-size: 15px; letter-spacing: 1px;
    color: #fff; background: linear-gradient(180deg,#8a6fd8,#6b4fc0);
    border: 3px solid rgba(255,255,255,.55); box-shadow: 0 4px 0 #4a349a; }

  #centerCol { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  #timeTag { display: flex; align-items: center; gap: 7px;
    background: linear-gradient(180deg,#8a6fd8,#5b3fb0); color: #fff;
    font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums;
    border-radius: 999px; padding: 7px 20px;
    border: 3px solid rgba(255,255,255,.5); box-shadow: 0 4px 0 rgba(0,0,0,.22); }
  #timeTag .clock { font-size: 16px; }
  #timeTag.low { background: linear-gradient(180deg,#ff7a6b,#d62f2f); animation: pulse .6s ease infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }

  /* progress bar with the three stars sitting on it */
  #progWrap { position: relative; width: min(44vw, 178px); }
  #progBar { width: 100%; height: 13px; border-radius: 999px; background: #5b3fb0;
    border: 3px solid rgba(255,255,255,.5); overflow: hidden; box-shadow: 0 3px 0 rgba(0,0,0,.2); }
  #progFill { height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg,#8ef07f,#33c74d); transition: width .18s ease; }
  #starRow { position: absolute; inset: 0; display: flex; align-items: center;
    gap: 0; pointer-events: none; }
  #starRow span { position: absolute; font-size: 19px; line-height: 1; transform: translate(-50%,-50%);
    top: 50%; color: #7c6aa8; text-shadow: 0 2px 3px rgba(0,0,0,.35); transition: color .2s ease, transform .2s ease; }
  #starRow span:nth-child(1) { left: 14%; }
  #starRow span:nth-child(2) { left: 34%; }
  #starRow span:nth-child(3) { left: 54%; }
  #starRow span.on { color: #ffc82e; transform: translate(-50%,-50%) scale(1.15); }

  /* fruit wallet cards under the level badge — kept small and slightly
     see-through: they sit over the playfield, so they must read as a
     counter, not as a wall the fruit hides behind */
  #wallet { position: absolute; left: 12px; top: 82px; display: flex; gap: 4px; opacity: .88; }
  .card { width: 36px; border-radius: 11px; background: linear-gradient(180deg,#7a5fd0,#5b3fb0);
    border: 2px solid rgba(255,255,255,.45); box-shadow: 0 3px 0 rgba(0,0,0,.22);
    padding: 3px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .card .n { color: #fff; font-weight: 800; font-size: 11px; font-variant-numeric: tabular-nums; }
  .card .n.bump { animation: bump .2s ease; }
  .card .dot { width: 17px; height: 17px; border-radius: 50%;
    box-shadow: inset 0 -3px 5px rgba(0,0,0,.35), inset 0 2px 3px rgba(255,255,255,.55); }
  @keyframes bump { 0%{transform:scale(1)} 45%{transform:scale(1.35)} 100%{transform:scale(1)} }

  /* clears the wallet row above it, so the level name stays readable */
  #patternTag { position: absolute; left: 0; right: 0; top: 126px; text-align: center;
    color: #7a5a2a; font-weight: 700; font-size: 12px; opacity: .8;
    text-shadow: 0 1px 0 rgba(255,255,255,.4); }

  #combo { position: fixed; top: 30%; left: 0; right: 0; text-align: center; pointer-events: none;
    font-weight: 800; font-size: clamp(24px, 8vw, 52px); color: #ffd23f; z-index: 6;
    text-shadow: 0 3px 12px rgba(0,0,0,.45); opacity: 0; }
  #combo.show { animation: comboPop .7s ease; }
  @keyframes comboPop {
    0%{opacity:0;transform:scale(.6)} 22%{opacity:1;transform:scale(1.18)}
    70%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(1)}
  }

  /* upgrades */
  #upgrades { background: rgba(60,35,10,.72); backdrop-filter: blur(3px); justify-content: flex-start;
    padding-top: calc(env(safe-area-inset-top,0px) + 26px); overflow-y: auto; }
  #upgWallet { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #upgWallet .counter { display: flex; align-items: center; gap: 5px; background: rgba(90,50,140,.88);
    border: 2px solid rgba(255,255,255,.32); border-radius: 999px; padding: 4px 10px 4px 4px; }
  #upgWallet .counter .dot { width: 18px; height: 18px; border-radius: 50%;
    box-shadow: inset 0 -3px 4px rgba(0,0,0,.35), inset 0 2px 3px rgba(255,255,255,.5); }
  #upgWallet .counter .n { color: #fff; font-weight: 800; font-size: 13px; }
  #upgList { display: flex; flex-direction: column; gap: 9px; width: min(94vw, 420px); margin: 4px 0 8px; }
  .upg { display: flex; align-items: center; gap: 10px; text-align: left;
    background: rgba(255,255,255,.13); border: 2px solid rgba(255,255,255,.18);
    border-radius: 16px; padding: 9px 11px; }
  .upg .ico { font-size: 24px; width: 30px; text-align: center; }
  .upg .mid { flex: 1; min-width: 0; }
  .upg .nm { color: #fff; font-weight: 800; font-size: 15px; }
  .upg .ds { color: rgba(255,255,255,.75); font-weight: 600; font-size: 12px; }
  .upg .pips { display: flex; gap: 3px; margin-top: 4px; }
  .upg .pip { width: 16px; height: 5px; border-radius: 999px; background: rgba(255,255,255,.22); }
  .upg .pip.on { background: linear-gradient(90deg,#ffd97a,#ffb23f); }
  .upg .buy { pointer-events: auto; cursor: pointer; border: none; border-radius: 999px;
    padding: 9px 13px; font-weight: 800; font-size: 13px; color: #5a3200; white-space: nowrap;
    background: linear-gradient(180deg,#ffd97a,#ffb23f); box-shadow: 0 3px 0 #c67e12; }
  .upg .buy:disabled { background: rgba(255,255,255,.16); color: rgba(255,255,255,.5); box-shadow: none; }
  .upg .buy .cost { display: block; font-size: 11px; font-weight: 700; opacity: .85; }
  #upgrades .sect, #goals .sect { font-size: 15px; font-weight: 800; opacity: .9; margin-top: 2px; }
  .menuRow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .menuRow .btn { margin-top: 0; }

  #goals { background: rgba(60,35,10,.72); backdrop-filter: blur(3px); justify-content: flex-start;
    padding-top: calc(env(safe-area-inset-top,0px) + 26px); overflow-y: auto; }
  #missionList, #achList { display: flex; flex-direction: column; gap: 9px;
    width: min(94vw, 420px); margin-bottom: 4px; }
  .upg.done { border-color: rgba(126,231,135,.6); background: rgba(126,231,135,.14); }
  .mbar { height: 6px; border-radius: 999px; background: rgba(255,255,255,.2);
    margin-top: 5px; overflow: hidden; }
  .mfill { height: 100%; border-radius: 999px; background: linear-gradient(90deg,#7ee787,#39c760); }

  #daily { background: rgba(60,35,10,.8); backdrop-filter: blur(4px); }
  #dailyLoot .pill { font-size: 16px; }

  #shop { background: rgba(60,35,10,.72); backdrop-filter: blur(3px); justify-content: flex-start;
    padding-top: calc(env(safe-area-inset-top,0px) + 26px); overflow-y: auto; }
  #shopList { display: flex; flex-direction: column; gap: 9px; width: min(94vw, 420px); margin-bottom: 4px; }
  .screen .muted { font-size: 12px; opacity: .7; max-width: min(94vw, 420px); }
  .upg .buy.owned { background: rgba(126,231,135,.3); color: #eaffef; box-shadow: none; }

  #pause { background: rgba(40,22,8,.8); backdrop-filter: blur(4px); }

  /* size badge pinned under the hole, like the other hole games */
  #sizeTag { position: fixed; left: 0; top: 0; display: none; z-index: 6; pointer-events: none;
    transform: translate(-50%, 0); white-space: nowrap;
    background: linear-gradient(180deg,#4aa8ff,#1f77dd); color: #fff;
    font-weight: 800; font-size: 14px; border-radius: 999px; padding: 5px 16px;
    border: 2px solid rgba(255,255,255,.5); box-shadow: 0 3px 0 rgba(0,0,0,.22); }
  #sizeTag.show { display: block; }
  #sizeTag.grow { animation: sizePop .38s ease; }
  @keyframes sizePop { 0%{transform:translate(-50%,0) scale(1)} 45%{transform:translate(-50%,0) scale(1.3)} 100%{transform:translate(-50%,0) scale(1)} }

  /* boosters */
  #boosterBar { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom,0px) + 52px);
    display: none; gap: 16px; justify-content: center; z-index: 7; }
  #boosterBar.show { display: flex; }
  /* Chunky keys: white rim, lit top edge, thick dark base that the button
     drops onto when pressed, and a count badge that overhangs the corner. */
  .slot { position: relative; pointer-events: auto; cursor: pointer;
    width: 66px; height: 66px; border-radius: 20px; font-size: 30px;
    border: 3px solid #fff;
    background: linear-gradient(180deg,#9b81e6 0%,#7d61d2 45%,#6247b5 100%);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.4),
      inset 0 -6px 10px rgba(30,16,70,.35),
      0 6px 0 #43308f, 0 10px 14px rgba(0,0,0,.3);
    display: flex; align-items: center; justify-content: center;
    text-shadow: 0 2px 3px rgba(30,16,70,.5); }
  .slot:active { transform: translateY(4px);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.4), 0 2px 0 #43308f; }
  .slot.locked { background: linear-gradient(180deg,#8d84ac,#635b85);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.25), 0 6px 0 #3e3660;
    font-size: 12px; font-weight: 800; color: #fff; cursor: default; }
  .slot.empty { filter: grayscale(.6); opacity: .6; }
  .slot .badge { position: absolute; top: -9px; right: -9px; min-width: 26px; height: 26px;
    border-radius: 999px; background: linear-gradient(180deg,#ff5a5a,#d5252d);
    border: 3px solid #fff; color: #fff; font-size: 13px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; padding: 0 5px;
    box-shadow: 0 3px 0 rgba(120,10,20,.55); }

  #hint { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom,0px) + 18px);
    text-align: center; pointer-events: none; color: #7a5a2a; font-size: 14px; font-weight: 600;
    opacity: 0; transition: opacity .5s ease; z-index: 5; text-shadow: 0 1px 0 rgba(255,255,255,.4); }

  /* ---- joystick ---- */
  #joyBase { position: fixed; width: 110px; height: 110px; margin: -55px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.5); background: rgba(255,255,255,.12);
    opacity: 0; pointer-events: none; z-index: 8; transition: opacity .15s ease; }
  #joyKnob { position: fixed; width: 46px; height: 46px; margin: -23px; border-radius: 50%;
    background: rgba(255,255,255,.55); pointer-events: none; z-index: 9; opacity: 0; transition: opacity .15s ease; }
  #joyBase.show, #joyKnob.show { opacity: .55; }
  #joyBase.drag, #joyKnob.drag { opacity: 1; }

  /* ---- screens ---- */
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; z-index: 20; text-align: center; padding: 26px; }
  .screen.show { display: flex; }
  .screen h1 { color: #fff; font-size: clamp(30px,10vw,52px); font-weight: 800;
    text-shadow: 0 3px 12px rgba(0,0,0,.45); letter-spacing: -.5px; }
  .screen p { color: #fff; font-size: clamp(14px,4.2vw,18px); font-weight: 600; opacity: .92;
    text-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .screen .btn { pointer-events: auto; cursor: pointer; border: none; border-radius: 999px;
    padding: 15px 46px; font-size: 19px; font-weight: 800; color: #5a3200;
    background: linear-gradient(180deg,#ffd97a,#ffb23f); box-shadow: 0 5px 0 #c67e12; margin-top: 6px; }
  .screen .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c67e12; }
  .screen .btn.ghost { background: rgba(255,255,255,.18); color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.22);
    padding: 12px 34px; font-size: 16px; }
  .screen .btn.ghost:active { box-shadow: 0 2px 0 rgba(0,0,0,.22); }
  .screen .btn[hidden] { display: none; }

  /* ---- main menu ----
     Three flat bands: grass, the sand the level is played on, grass again
     under the nav bar. Flat colour reads cleaner at phone size than a
     painted scene faked with gradients, and it leaves the hole as the
     loudest thing on screen. The logo used to be the emoji, which every
     phone draws differently (Samsung paints it as a blue disc). */
  #menu { gap: 8px; justify-content: flex-start; padding: 0 20px;
    background: linear-gradient(180deg,
      #22c9cd 0%, #22c9cd 19%,
      #ffe08a 19%, #ffd76b 55%, #ffcf55 86%,
      #22c9cd 86%, #16a8bd 100%);
    overflow: hidden; }
  /* scalloped seams, so the bands do not meet on a ruled line */
  #menu::before, #menu::after { content: ''; position: absolute; left: -2%; width: 104%;
    height: 22px; pointer-events: none;
    background: radial-gradient(circle at 50% 0, #22c9cd 0 52%, rgba(34,201,205,0) 53%) 0 0/32px 22px repeat-x; }
  #menu::before { top: calc(19% - 1px); }
  #menu::after { bottom: calc(14% - 1px); transform: scaleY(-1); }

  #menu > * { position: relative; z-index: 1; }

  /* the hole, with the level you are about to play sitting inside it */
  #menu .logo { position: relative; width: clamp(148px,45vw,215px); aspect-ratio: 1;
    display: grid; place-items: center; margin: 12vh 0 0; }
  #menu .logo::before { content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 42%,
      #123048 0 60%, #0b2033 67%, #eef2f6 69%, #ffffff 79%, #b9c3cd 89%, #79838f 100%);
    box-shadow: 0 12px 0 rgba(0,0,0,.16), 0 20px 28px rgba(0,0,0,.25),
      inset 0 -10px 20px rgba(0,0,0,.45); }
  #menu .logo .lvl { position: relative; text-align: center; line-height: 1; color: #fff;
    -webkit-text-stroke: 3px #0b2033; paint-order: stroke fill;
    text-shadow: 0 3px 0 rgba(0,0,0,.3); }
  #menu .logo .lvl small { display: block; font-size: clamp(12px,3.8vw,16px); font-weight: 800;
    letter-spacing: 1px; text-transform: uppercase; color: #bfe6f7; -webkit-text-stroke-width: 2px; }
  #menu .logo .lvl b { display: block; font-size: clamp(42px,14vw,64px); font-weight: 800; }
  #menu .logo .pip { position: absolute; font-size: clamp(28px,9vw,42px);
    filter: drop-shadow(0 4px 4px rgba(0,0,0,.3)); }
  #menu .logo .pip:nth-child(1) { left: -11%;  top: 3%;   transform: rotate(-16deg); }
  #menu .logo .pip:nth-child(2) { right: -12%; top: -3%;  transform: rotate(14deg); }
  #menu .logo .pip:nth-child(3) { right: -9%;  bottom: 6%;  transform: rotate(-9deg); }

  #menu h1 { margin-top: 8.5vh; font-size: clamp(32px,10.5vw,50px); letter-spacing: -1px; color: #fff;
    -webkit-text-stroke: 3px #0d7b8c; paint-order: stroke fill;
    text-shadow: 0 5px 0 #0d7b8c, 0 9px 14px rgba(0,0,0,.22); }
  #menuSub { margin: 10px 0 auto; letter-spacing: 2px; font-size: 16px; font-weight: 800;
    color: #fff; -webkit-text-stroke: 3px #d08a12; paint-order: stroke fill;
    text-shadow: 0 2px 0 rgba(120,60,0,.28); }

  /* the primary action is the one thing that should shout */
  /* A slab seated in a tray, not a pill with a ring drawn round it. The
     tray is deeper below the button than above, which is what makes the
     button look dropped into it rather than stuck on top. */
  #playTray { margin-top: auto; padding: 9px 11px 15px; border-radius: 28px;
    background: linear-gradient(180deg,#7a68d8,#4a3a99);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.28), 0 7px 0 #362a78,
      0 16px 22px rgba(0,0,0,.3); }
  #playBtn { display: block; padding: 15px 72px; font-size: 30px; color: #fff;
    border-radius: 19px; border: none; margin: 0;
    -webkit-text-stroke: 4px #123c0c; paint-order: stroke fill;
    background: linear-gradient(180deg,#6ade46 0%,#4cc32f 52%,#37a521 100%);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.5),
      inset 0 -5px 8px rgba(20,60,10,.35), 0 5px 0 #2a8419; }
  #playTray:active { padding-bottom: 11px; padding-top: 13px; }
  #playTray:active #playBtn { box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 2px 0 #2a8419; }

  /* top strip: fruit counts on the left, sound on the right */
  #menuTop { position: absolute; z-index: 2; top: calc(env(safe-area-inset-top,0px) + 10px);
    left: 10px; right: 10px; display: flex; align-items: center; gap: 6px; }
  /* Every control shares one shape: cream face, white rim, dark bottom edge.
     Flat chips beside a bevelled Play button look like a different app. */
  #menuWallet { display: flex; gap: 6px; }
  #menuWallet .mw { display: flex; align-items: center; gap: 5px; padding: 5px 12px 5px 5px;
    border-radius: 999px; background: linear-gradient(180deg,#fffdf5,#ffefcf);
    border: 3px solid #fff; box-shadow: 0 4px 0 rgba(90,50,0,.3); }
  #menuWallet .mw i { width: 19px; height: 19px; border-radius: 50%; border: 2px solid #fff;
    box-shadow: inset 0 -3px 4px rgba(0,0,0,.35), inset 0 2px 3px rgba(255,255,255,.5),
      0 2px 0 rgba(90,50,0,.25); }
  #menuWallet .mw b { color: #6b3d00; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #menuSound { margin-left: auto; pointer-events: auto; cursor: pointer;
    width: 44px; height: 44px; border-radius: 14px; border: 3px solid #fff;
    font-size: 19px; line-height: 1; color: #fff;
    background: linear-gradient(180deg,#7a68d8,#5444ab);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.3), 0 4px 0 #3d2f86; }
  #menuSound:active { transform: translateY(2px); box-shadow: 0 2px 0 #3d2f86; }

  /* bottom bar, so the secondary screens stop competing with Play */
  /* One solid bar across the bottom instead of three floating cards.
     The icons stand free rather than on tiles — that is what the bars in
     these games actually look like — and the selected column gets a lighter
     panel behind it instead of a badge. */
  #menuNav { display: flex; gap: 0; width: calc(100% + 40px); margin: 3.5vh -20px 0;
    padding: 0 6px calc(env(safe-area-inset-bottom,0px) + 6px);
    background: linear-gradient(180deg,#6a58c9,#5444ab);
    box-shadow: inset 0 4px 0 rgba(255,255,255,.18); }
  #menuNav .nav { pointer-events: auto; cursor: pointer; flex: 1; border: none; background: transparent;
    padding: 10px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    position: relative; border-radius: 0 0 16px 16px; }
  #menuNav .nav .ic { font-size: 30px; line-height: 1;
    filter: drop-shadow(0 3px 2px rgba(30,16,70,.55)); transition: transform .08s; }
  #menuNav .nav:active .ic { transform: translateY(3px) scale(.94); }
  #menuNav .nav .lb { font-size: 11px; font-weight: 800; color: #d9d2ff;
    text-shadow: 0 2px 0 rgba(0,0,0,.3); }

  /* centre column: lighter panel, larger icon, sitting proud of the bar */
  #menuNav .nav:nth-child(2) { background: linear-gradient(180deg,#8b79e8,#6d5ac6);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.3); margin-top: -14px;
    padding-top: 22px; border-radius: 16px 16px 16px 16px; }
  #menuNav .nav:nth-child(2) .ic { font-size: 36px; }
  #menuNav .nav:nth-child(2) .lb { color: #fff; }

  #menuNav .nav.alert::after { content: ''; position: absolute; right: 24%; top: 12px;
    width: 12px; height: 12px; border-radius: 50%; background: #ff3b30;
    border: 2px solid #fff; animation: bump 1.1s ease infinite; }

  /* what the sand used to be: empty. It now shows what is coming next and
     what is already earned, which is the only reason to look at a menu. */
  #menuBanner { display: flex; align-items: center; gap: 9px; margin-top: 12px;
    padding: 9px 18px; border-radius: 999px; max-width: 94%;
    background: linear-gradient(180deg,#4a3a99,#382b78); border: 3px solid #7a68d8;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.16), 0 4px 0 rgba(0,0,0,.22); }
  #menuBanner .bi { font-size: 19px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
  #menuBanner .bt { color: #fff; font-size: 13px; font-weight: 800;
    text-shadow: 0 2px 0 rgba(0,0,0,.35); }

  #menuShelf { position: absolute; z-index: 1; inset: 22% 12px auto 12px;
    display: flex; justify-content: space-between; pointer-events: none; }
  /* item standing on a plinth, label on a chip beneath it */
  #menuShelf .slot2 { width: 78px; text-align: center; }

<script type="module">
import * as THREE from 'three';

// The camera is nearly overhead, so a fruit is recognised by what its top
// face looks like, not by its outline. Each type is built around that: the
// strawberry shows its seeded shoulders and green calyx, the watermelon and
// banana are cut slices seen face-on.
// The ids are storage keys (currency, upgrades) and must not change.
const TYPES = [
  { id: 'berry',  label: 'Strawberry', base: '#f5232f', dark: '#c00d1c', light: '#ff6a5c', speck: '#8f0713' },
  { id: 'lychee', label: 'Lychee',     base: '#fdf3e6', dark: '#e6c6a8', light: '#ffffff', speck: '#ff9d8a' },
  { id: 'banana', label: 'Banana',     base: '#ffdc3d', dark: '#f0b41f', light: '#fff7b8', speck: '#d99512' },
  // The watermelon's flesh is red like the strawberry's, so its counter
  // uses the rind colours instead — two identical dots would be unreadable.
  { id: 'melon',  label: 'Watermelon', base: '#f22c43', dark: '#2f9a3c', light: '#ff6f6a', speck: '#177029',
    uiLight: '#8ce063', uiBase: '#3fae38', uiDark: '#1d6a28' },
];
function dotFill(t) {
  return `radial-gradient(circle at 34% 30%, ${t.uiLight || t.light}, ${t.uiBase || t.base} 58%, ${t.uiDark || t.dark})`;
}
const TYPE_BY_ID = Object.fromEntries(TYPES.map(t => [t.id, t]));

const COLS = 13;
let rows = 22;
let level = parseInt(localStorage.getItem('fruithole_level') || '1', 10);
let sizeStage = level;
let currentPattern = null;   // set by buildField()

const currency = JSON.parse(localStorage.getItem('fruithole_currency') || '{}');
TYPES.forEach(t => { if (!(t.id in currency)) currency[t.id] = 0; });
function saveCurrency() { localStorage.setItem('fruithole_currency', JSON.stringify(currency)); }

// Best star rating per level, so a replay can improve it but never lose it.
const stars = JSON.parse(localStorage.getItem('fruithole_stars') || '{}');
function saveStars() { localStorage.setItem('fruithole_stars', JSON.stringify(stars)); }

// ---------------------------------------------------------------------
// Upgrades
//
// Each track is paid for with a different fruit, so every counter on the
// HUD is worth collecting rather than just the common ones. Costs double
// each step: 25, 50, 100, 200, 400.
// ---------------------------------------------------------------------
const UPGRADES = [
  { id: 'speed',  icon: '💨', name: 'Speed',          pay: 'berry',  base: 25,
    desc: lv => `Hole moves ${lv * 8}% faster` },
  { id: 'size',   icon: '⭕', name: 'Starting size',  pay: 'banana', base: 20,
    desc: lv => `Hole starts ${(lv * 0.06).toFixed(2)} wider` },
  { id: 'time',   icon: '⏱',  name: 'Extra time',     pay: 'lychee', base: 25,
    desc: lv => `+${lv * 5} seconds every level` },
  { id: 'magnet', icon: '🧲', name: 'Magnet',         pay: 'melon',  base: 30,
    desc: lv => `Pulls fruit in from ${(lv * 0.28).toFixed(2)} further out` },
];
const UPG_MAX = 5;

const upgrades = JSON.parse(localStorage.getItem('fruithole_upgrades') || '{}');
UPGRADES.forEach(u => { if (!(u.id in upgrades)) upgrades[u.id] = 0; });
function saveUpgrades() { localStorage.setItem('fruithole_upgrades', JSON.stringify(upgrades)); }
function upg(id) { return upgrades[id] || 0; }
function upgCost(u) { return u.base * Math.pow(2, upg(u.id)); }

// ---------------------------------------------------------------------
// Boosters
//
// Consumables spent mid-run from the bar at the bottom. Slots unlock as
// levels are cleared, so the bar fills out over time instead of dumping
// three unexplained buttons on a new player. Each starts with a couple
// free so the first use costs nothing to learn.
// ---------------------------------------------------------------------
const BOOSTERS = [
  { id: 'time',   icon: '⏰', name: 'Time',     unlock: 4,  pay: 'lychee', cost: 40, free: 2,
    desc: '+15 seconds' },
  { id: 'grow',   icon: '💥', name: 'Grow',     unlock: 7,  pay: 'banana', cost: 50, free: 1,
    desc: 'Hole grows at once' },
  { id: 'magnet', icon: '🌟', name: 'Super magnet', unlock: 10, pay: 'melon', cost: 45, free: 1,
    desc: '8 seconds of strong pull' },
];

const boosterStore = JSON.parse(localStorage.getItem('fruithole_boosters') || 'null');
const boosters = boosterStore || Object.fromEntries(BOOSTERS.map(b => [b.id, b.free]));
BOOSTERS.forEach(b => { if (!(b.id in boosters)) boosters[b.id] = b.free; });
function saveBoosters() { localStorage.setItem('fruithole_boosters', JSON.stringify(boosters)); }
function boosterUnlocked(b) { return level >= b.unlock; }

// ---------------------------------------------------------------------
// Stats, daily missions, achievements, daily reward
//
// Daily work is counted in its own bucket that resets with the date,
// rather than diffing lifetime totals against a snapshot -- that way a
// mission cannot be completed by progress made before it was handed out.
// ---------------------------------------------------------------------
const stats = JSON.parse(localStorage.getItem('fruithole_stats') || '{}');
['fruits', 'levels', 'stars', 'bestCombo'].forEach(k => { if (!(k in stats)) stats[k] = 0; });
function saveStats() { localStorage.setItem('fruithole_stats', JSON.stringify(stats)); }

function dayKey(d) { return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }

const MISSION_POOL = [
  { id: 'eat',   icon: '🍇', track: 'fruits',    text: n => `Eat ${n} fruit`,     roll: () => 60 + Math.floor(Math.random() * 5) * 20 },
  { id: 'lvl',   icon: '🏁', track: 'levels',    text: n => `Finish ${n} levels`,  roll: () => 2 + Math.floor(Math.random() * 3) },
  { id: 'star',  icon: '⭐', track: 'stars',     text: n => `Earn ${n} stars`, roll: () => 4 + Math.floor(Math.random() * 5) },
  { id: 'combo', icon: '🔥', track: 'bestCombo', text: n => `Hit an x${n} combo`,   roll: () => 3 + Math.floor(Math.random() * 3) },
];
const MISSION_BY_ID = Object.fromEntries(MISSION_POOL.map(m => [m.id, m]));
const MISSION_REWARD = 45;

const daily = JSON.parse(localStorage.getItem('fruithole_daily') || '{}');
function saveDaily() { localStorage.setItem('fruithole_daily', JSON.stringify(daily)); }

function ensureDaily() {
  const key = dayKey(new Date());
  if (daily.date === key) return;
  const yesterday = dayKey(new Date(Date.now() - 86400000));
  daily.streak = daily.date === yesterday ? (daily.streak || 0) + 1 : 1;
  daily.date = key;
  daily.fruits = 0; daily.levels = 0; daily.stars = 0; daily.bestCombo = 0;
  daily.missions = [...MISSION_POOL]
    .sort(() => Math.random() - 0.5)
    .slice(0, 3)
    .map(m => ({ id: m.id, goal: m.roll(), claimed: false }));
  daily.rewardClaimed = false;
  const t = TYPES[Math.floor(Math.random() * TYPES.length)];
  daily.loot = { type: t.id, amount: 25 + Math.min(daily.streak, 7) * 10 };
  saveDaily();
}
ensureDaily();

const ACHIEVEMENTS = [
  { id: 'eat100',  icon: '🍇',  name: 'Hundred bites', desc: 'Eat 100 fruit in total',  goal: 100,  at: () => stats.fruits,    pay: 'berry',  reward: 60 },
  { id: 'eat1000', icon: '🍽️', name: 'Never full',    desc: 'Eat 1000 fruit in total', goal: 1000, at: () => stats.fruits,    pay: 'berry',  reward: 220 },
  { id: 'lvl10',   icon: '🏁',  name: 'Tenth level',   desc: 'Reach level 10',      goal: 10,   at: () => level,           pay: 'banana', reward: 140 },
  { id: 'star15',  icon: '⭐',  name: 'Star hunter',   desc: 'Earn 15 stars',      goal: 15,   at: () => stats.stars,     pay: 'lychee', reward: 140 },
  { id: 'combo5',  icon: '🔥',  name: 'Chain eater',   desc: 'Hit an x5 combo',         goal: 5,    at: () => stats.bestCombo, pay: 'melon',  reward: 110 },
];
const achClaimed = JSON.parse(localStorage.getItem('fruithole_ach') || '{}');
function saveAch() { localStorage.setItem('fruithole_ach', JSON.stringify(achClaimed)); }

// how far along a daily mission is, capped at its goal
function missionAt(m) { return Math.min(daily[MISSION_BY_ID[m.id].track] || 0, m.goal); }
function missionDone(m) { return missionAt(m) >= m.goal; }

// something claimable anywhere? used to badge the menu button
function anyClaimable() {
  const mission = (daily.missions || []).some(m => missionDone(m) && !m.claimed);
  const ach = ACHIEVEMENTS.some(a => !achClaimed[a.id] && a.at() >= a.goal);
  return mission || ach;
}

const app = document.getElementById('app');
const topbarEl = document.getElementById('topbar');
const walletEl = document.getElementById('wallet');
const levelNEl = document.getElementById('levelN');
const pauseEl = document.getElementById('pause');

const timeNEl = document.getElementById('timeN');

const reviveBtnEl = document.getElementById('reviveBtn');

const upgListEl = document.getElementById('upgList');
const upgWalletEl = document.getElementById('upgWallet');

// ---------------------------------------------------------------------
// Ads (AdMob) — only live inside the native Capacitor shell. In a browser
// every call is a no-op and showRewarded() resolves true, so the game
// plays identically without an ad network.
//
// Fruit Hole's own AdMob units. They belong to this app alone — the Hole
// app's units are registered to a different app and cannot be used here.
//
// The matching AdMob App ID goes in the Android manifest, not in this file:
//   ca-app-pub-2542927456156553~4653695871
// ---------------------------------------------------------------------
const _Cap = window.Capacitor;
const _AdMob = _Cap && _Cap.Plugins ? _Cap.Plugins.AdMob : null;
const ADS_ON = !!(_Cap && _Cap.isNativePlatform && _Cap.isNativePlatform() && _AdMob);
const AD_UNITS = {
  rewarded:     'ca-app-pub-2542927456156553/4650610263',
  interstitial: 'ca-app-pub-2542927456156553/3960345120',
  banner:       'ca-app-pub-2542927456156553/9522879176',
};

// Tapping your own live ads gets an AdMob account suspended, so testing on
// a real device has to serve test ads. Leave this true while trying the app
// yourself; set it to false for the build you upload.
const ADS_TESTING = true;

let _interReady = false;

async function adsInit() {
  if (!ADS_ON) return;
  try { await _AdMob.initialize({ initializeForTesting: ADS_TESTING }); prepareInterstitial(); } catch (e) { }
}
async function prepareInterstitial() {
  if (!ADS_ON) return;
  try { await _AdMob.prepareInterstitial({ adId: AD_UNITS.interstitial }); _interReady = true; } catch (e) { _interReady = false; }
}
async function showInterstitial() {
  if (!ADS_ON || adsRemoved() || !_interReady) return;
  try { await _AdMob.showInterstitial(); } catch (e) { }
  _interReady = false;
  prepareInterstitial();
}
async function showRewarded() {
  if (!ADS_ON) return true;
  return new Promise(async (resolve) => {
    let got = false, subR = null, subD = null;
    const cleanup = () => { if (subR && subR.remove) subR.remove(); if (subD && subD.remove) subD.remove(); };
    try {
      subR = await _AdMob.addListener('onRewardedVideoAdReward', () => { got = true; });
      subD = await _AdMob.addListener('onRewardedVideoAdDismissed', () => { cleanup(); resolve(got); });
      await _AdMob.prepareRewardVideoAd({ adId: AD_UNITS.rewarded });
      await _AdMob.showRewardVideoAd();
    } catch (e) { cleanup(); resolve(false); }
  });
}
let _bannerShown = false;
async function showBanner() {
  if (!ADS_ON || adsRemoved() || _bannerShown) return;
  try {
    await _AdMob.showBanner({ adId: AD_UNITS.banner, adSize: 'ADAPTIVE_BANNER', position: 'BOTTOM_CENTER', margin: 0 });
    _bannerShown = true;
  } catch (e) { }
}
async function hideBanner() {
  if (!ADS_ON || !_bannerShown) return;
  try { await _AdMob.hideBanner(); _bannerShown = false; } catch (e) { }
}
adsInit();

// ---------------------------------------------------------------------
// In-app purchases
//
// Same shape as the ad layer: live only inside the native shell, no-op in
// a browser. The one piece that must be wired up for real money is
// purchase() below -- the supported route is RevenueCat's Capacitor
// plugin (@revenuecat/purchases-capacitor); the Cordova one is retired
// and Google stops accepting updates built on it after 2026-08-31.
//
// Prices here are placeholders for the browser build only. On device the
// store returns the real localised price and that is what must be shown.
// ---------------------------------------------------------------------
const _Purchases = _Cap && _Cap.Plugins ? _Cap.Plugins.Purchases : null;
const IS_NATIVE = !!(_Cap && _Cap.isNativePlatform && _Cap.isNativePlatform());
const IAP_ON = !!(IS_NATIVE && _Purchases);

// The shop may only be reachable on device once a billing plugin is really
// wired up: without one `purchase()` returns true and hands out paid items
// for free, which misleads players and fails Play review. In the browser it
// stays visible so the flow can still be walked through.
const SHOW_SHOP = IAP_ON || !IS_NATIVE;

const iap = JSON.parse(localStorage.getItem('fruithole_iap') || '{}');
function saveIap() { localStorage.setItem('fruithole_iap', JSON.stringify(iap)); }
function adsRemoved() { return !!iap.remove_ads; }

async function purchase(productId) {
  if (!IAP_ON) return true;   // browser: grant so the flow can be walked through
  try {
    const res = await _Purchases.purchaseStoreProduct({ productIdentifier: productId });
    return !(res && res.userCancelled);
  } catch (e) {
    return false;
  }
}

async function restorePurchases() {
  if (!IAP_ON) return false;
  try {
    const info = await _Purchases.restorePurchases();
    const owned = info && info.customerInfo && info.customerInfo.allPurchasedProductIdentifiers;
    if (Array.isArray(owned)) {
      for (const p of PRODUCTS) {
        if (p.key && owned.includes(p.id)) iap[p.key] = true;
      }
      saveIap();
    }
    return true;
  } catch (e) {
    return false;
  }
}

// ---------------------------------------------------------------------
// Sound (WebAudio synth, no files) + haptics
// ---------------------------------------------------------------------
const _AC = window.AudioContext || window.webkitAudioContext;
let _actx = null;
let muted = localStorage.getItem('fruithole_muted') === '1';

function ensureAudio() {
  try {
    if (!_actx && _AC) _actx = new _AC();
    if (_actx && _actx.state === 'suspended') _actx.resume();
  } catch (e) { }
}
function beep(freq, dur, type, vol, when) {
  if (muted || !_actx) return;
  try {
    const t = _actx.currentTime + (when || 0);
    const o = _actx.createOscillator(), g = _actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(_actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) { }
}
function vibrate(p) { try { if (!muted && navigator.vibrate) navigator.vibrate(p); } catch (e) { } }

const sfx = {
  eat(streak) { ensureAudio(); beep(340 + Math.min(streak, 14) * 24, 0.09, 'triangle', 0.14); vibrate(8); },
  blocked()   { ensureAudio(); beep(150, 0.07, 'sawtooth', 0.10); },
  click()     { ensureAudio(); beep(300, 0.05, 'sine', 0.12); },
  win()       { ensureAudio(); [523, 659, 784, 1046].forEach((f, i) => beep(f, 0.2, 'triangle', 0.18, i * 0.09)); vibrate([20, 40, 25]); },
  lose()      { ensureAudio(); [420, 320, 240].forEach((f, i) => beep(f, 0.22, 'sawtooth', 0.14, i * 0.1)); vibrate(70); },
  tick()      { ensureAudio(); beep(760, 0.05, 'square', 0.08); },
  booster()   { ensureAudio(); [660, 880, 1180].forEach((f, i) => beep(f, 0.13, 'triangle', 0.17, i * 0.06)); vibrate([15, 30]); },
};

// sound is toggled from the pause screen; nothing to mirror in the HUD
// The menu has its own sound toggle; the pause screen has another. Both
// change the same flag, so both labels are redrawn from it.
function refreshMuteBtn() {
  const b = document.getElementById('menuSound');
  if (b) b.textContent = muted ? '🔇' : '🔊';
}
document.addEventListener('pointerdown', (e) => {
  ensureAudio();
  if (e.target.closest && e.target.closest('button')) sfx.click();
}, true);

// ---------------------------------------------------------------------
// HUD
// ---------------------------------------------------------------------
function buildCounters() {
  walletEl.innerHTML = '';
  TYPES.forEach(t => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML =
      `<span class="dot" style="background:${dotFill(t)}"></span>` +
      `<span class="n" id="cur_${t.id}">${currency[t.id]}</span>`;
    walletEl.appendChild(el);
  });
}
// The in-game wallet is part of the HUD and hidden on the menu, so the menu
// carries its own read-only copy — otherwise you cannot see what you own
// without starting a run.
function buildMenuWallet() {
  const el = document.getElementById('menuWallet');
  el.innerHTML = '';
  TYPES.forEach(t => {
    const row = document.createElement('div');
    row.className = 'mw';
    row.innerHTML =
      `<i style="background:${dotFill(t)}"></i>` +
      `<b>${currency[t.id]}</b>`;
    el.appendChild(row);
  });
}
// The level lives on the Play button, the way the level-map games do it —
// the button says where you are going, not just what it does.
function refreshMenuLevel() {
  const best = stars[level] || 0;
  document.getElementById('menuLvlN').textContent = level;
  menuSubEl.textContent = best ? '★'.repeat(best) + '☆'.repeat(3 - best) : 'New level';

  // Banner: the next thing the player will be given, or the star total once
  // there is nothing left to unlock.
  const next = BOOSTERS.find(b => b.unlock > level);
  const banner = document.getElementById('menuBanner');
  if (next) {
    banner.innerHTML = `<span class="bi">🔒</span><span class="bt">${next.name} booster unlocks at level ${next.unlock}</span>`;
  } else {
    const total = Object.values(stars).reduce((a, b) => a + b, 0);
    banner.innerHTML = `<span class="bi">⭐</span><span class="bt">${total} stars collected — everything unlocked</span>`;
  }

  // Shelf: the three boosters, greyed until their level comes round.
  const shelf = document.getElementById('menuShelf');
  shelf.innerHTML = '';
  BOOSTERS.forEach(b => {
    const open = boosterUnlocked(b);
    const el = document.createElement('div');
    el.className = 'slot2' + (open ? '' : ' locked');
    el.innerHTML = `<span class="ic">${b.icon}</span>` +
      `<span class="tx">${open ? '×' + (boosters[b.id] || 0) : 'Lvl ' + b.unlock}</span>`;
    shelf.appendChild(el);
  });
}

function goalRow(icon, name, desc, at, goal, claimed, onClaim) {
  const pct = Math.min(100, Math.round((at / goal) * 100));
  const ready = at >= goal && !claimed;
  const row = document.createElement('div');
  row.className = 'upg' + (claimed ? ' done' : '');
  row.innerHTML =
    `<span class="ico">${icon}</span>` +
    `<span class="mid">` +
      `<span class="nm">${name}</span>` +
      `<div class="ds">${desc}</div>` +
      `<div class="mbar"><div class="mfill" style="width:${pct}%"></div></div>` +
      `<div class="own">${Math.min(at, goal)} / ${goal}</div>` +
    `</span>`;
  const btn = document.createElement('button');
  btn.className = 'buy';
  if (claimed) { btn.textContent = '✓'; btn.disabled = true; }
  else if (ready) { btn.textContent = 'Claim'; btn.onclick = onClaim; }
  else { btn.textContent = '…'; btn.disabled = true; }
  row.appendChild(btn);
  return row;
}

function renderGoals() {
  ensureDaily();
  const mList = document.getElementById('missionList');
  mList.innerHTML = '';
  (daily.missions || []).forEach(m => {
    const def = MISSION_BY_ID[m.id];
    mList.appendChild(goalRow(
      def.icon, def.text(m.goal), `Reward: ${MISSION_REWARD} fruit`,
      missionAt(m), m.goal, m.claimed,
      () => claimMission(m)
    ));
  });

  const aList = document.getElementById('achList');
  aList.innerHTML = '';
  ACHIEVEMENTS.forEach(a => {
    aList.appendChild(goalRow(
      a.icon, a.name, `${a.desc} · ${a.reward} ${TYPE_BY_ID[a.pay].label}`,
      a.at(), a.goal, !!achClaimed[a.id],
      () => claimAch(a)
    ));
  });
  refreshGoalsBadge();
}

function claimMission(m) {
  if (m.claimed || !missionDone(m)) return;
  m.claimed = true;
  saveDaily();
  const t = TYPES[Math.floor(Math.random() * TYPES.length)];
  bumpCurrency(t.id, MISSION_REWARD);
  sfx.win();
  renderGoals();
}

function claimAch(a) {
  if (achClaimed[a.id] || a.at() < a.goal) return;
  achClaimed[a.id] = true;
  saveAch();
  bumpCurrency(a.pay, a.reward);
  sfx.win();
  renderGoals();
}

// Pause
//
// Parks the run in its own state so the clock, the hole and eating all
// stop; resuming re-arms lastT so the paused seconds are not billed to
// the countdown in one lump.
// ---------------------------------------------------------------------
let pausedFrom = null;

function pauseGame() {
  if (state !== 'playing') return;
  pausedFrom = state;
  state = 'paused';
  joyX = 0; joyY = 0; touchId = null;
  joyBaseEl.classList.remove('drag'); joyKnobEl.classList.remove('drag');
  boosterBarEl.classList.remove('show');
  sizeTagEl.classList.remove('show');
  joyBaseEl.classList.remove('show'); joyKnobEl.classList.remove('show');
  refreshPauseMute();
  pauseEl.classList.add('show');
}

function resumeGame() {
  if (state !== 'paused') return;
  pauseEl.classList.remove('show');
  boosterBarEl.classList.add('show');
  sizeTagEl.classList.add('show');
  joyBaseEl.classList.add('show'); joyKnobEl.classList.add('show');
  lastT = performance.now();
  state = pausedFrom || 'playing';
  pausedFrom = null;
}

  document.getElementById('pauseMute').textContent = muted ? '🔇 Sound' : '🔊 Sound';
}
