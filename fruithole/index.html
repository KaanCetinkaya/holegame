<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Fruit Hole</title>
<meta name="theme-color" content="#e8c07d" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fruit Hole" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #e8c07d; }
  #app { position: fixed; inset: 0; touch-action: none; }
  canvas { display: block; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #7a5a2a; font-size: 16px; z-index: 30; background: #e8c07d; }

  #hud { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0;
    display: flex; gap: 8px; padding: 12px 14px; pointer-events: none; flex-wrap: wrap; z-index: 5; }
  .counter { display: flex; align-items: center; gap: 6px; background: rgba(90,50,140,.88);
    border: 2px solid rgba(255,255,255,.35); border-radius: 999px; padding: 6px 12px 6px 6px;
    box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .counter .dot { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 -3px 4px rgba(0,0,0,.35), inset 0 2px 3px rgba(255,255,255,.5); }
  .counter .n { color: #fff; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
  .counter .n.bump { animation: bump .2s ease; }
  @keyframes bump { 0%{transform:scale(1)} 45%{transform:scale(1.3)} 100%{transform:scale(1)} }

  #sizeTag { position: fixed; top: calc(env(safe-area-inset-top,0px) + 6px); left: 50%; transform: translateX(-50%);
    background: rgba(30,120,220,.92); color: #fff; font-weight: 800; font-size: 13px;
    border-radius: 999px; padding: 6px 16px; box-shadow: 0 3px 0 rgba(0,0,0,.2); z-index: 5; pointer-events: none; }

  #levelTag { position: fixed; top: calc(env(safe-area-inset-top,0px) + 36px); left: 50%; transform: translateX(-50%);
    color: #7a5a2a; font-weight: 700; font-size: 13px; opacity: .85; z-index: 5; pointer-events: none; text-shadow: 0 1px 0 rgba(255,255,255,.4); }

  #hint { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom,0px) + 18px);
    text-align: center; pointer-events: none; color: #7a5a2a; font-size: 14px; font-weight: 600;
    opacity: .8; transition: opacity .5s ease; z-index: 5; text-shadow: 0 1px 0 rgba(255,255,255,.4); }

  #joyBase { position: fixed; width: 110px; height: 110px; margin: -55px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.5); background: rgba(255,255,255,.12);
    opacity: 0; pointer-events: none; z-index: 8; transition: opacity .15s ease; }
  #joyKnob { position: fixed; width: 46px; height: 46px; margin: -23px; border-radius: 50%;
    background: rgba(255,255,255,.55); pointer-events: none; z-index: 9; opacity: 0; transition: opacity .15s ease; }
  #joyBase.show, #joyKnob.show { opacity: 1; }

  #overlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: rgba(60,35,10,.55); backdrop-filter: blur(3px); z-index: 20; text-align: center; padding: 24px; }
  #overlay h1 { color: #fff; font-size: clamp(26px,8vw,44px); font-weight: 800; text-shadow: 0 3px 10px rgba(0,0,0,.4); }
  #overlay button { pointer-events: auto; cursor: pointer; border: none; border-radius: 999px; padding: 14px 34px;
    font-size: 17px; font-weight: 800; color: #5a3200; background: linear-gradient(180deg,#ffd97a,#ffb23f);
    box-shadow: 0 5px 0 #c67e12; }
</style>
</head>
<body>
<div id="loading">Yükleniyor…</div>
<div id="app">
  <div id="hud"></div>
  <div id="sizeTag">Size <span id="sizeN">1</span></div>
  <div id="levelTag">Bölüm <span id="lvlN">1</span></div>
  <div id="hint">Parmağını sürükle, deliği gezdir, meyveleri ye</div>
  <div id="joyBase"></div>
  <div id="joyKnob"></div>

  <div id="overlay">
    <h1 id="overlayTitle">Bölüm Tamam! 🎉</h1>
    <button id="continueBtn">Devam</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://esm.sh/three@0.161.0" } }
</script>
<script type="module">
import * as THREE from 'three';

const TYPES = [
  { id: 'berry',  label: 'Böğürtlen', base: '#5b2d8e', dark: '#3c1a63', light: '#8a5cc9', speck: '#2a1148' },
  { id: 'lychee', label: 'Liçi',      base: '#f3e6d8', dark: '#d8b9a0', light: '#ffffff', speck: '#e8a898' },
  { id: 'banana', label: 'Muz',       base: '#f6d648', dark: '#e0a92a', light: '#fff2a0', speck: '#c98a1c' },
  { id: 'melon',  label: 'Kavun',     base: '#f0a13c', dark: '#c9711f', light: '#ffc978', speck: '#a85614' },
];
const TYPE_BY_ID = Object.fromEntries(TYPES.map(t => [t.id, t]));

const COLS = 7;
let rows = 9;
let level = 1;
let sizeStage = 1;

const currency = JSON.parse(localStorage.getItem('fruithole_currency') || '{}');
TYPES.forEach(t => { if (!(t.id in currency)) currency[t.id] = 0; });
function saveCurrency() { localStorage.setItem('fruithole_currency', JSON.stringify(currency)); }

const app = document.getElementById('app');
const hudEl = document.getElementById('hud');
const sizeNEl = document.getElementById('sizeN');
const lvlNEl = document.getElementById('lvlN');
const hintEl = document.getElementById('hint');
const overlayEl = document.getElementById('overlay');
const overlayTitleEl = document.getElementById('overlayTitle');
const joyBaseEl = document.getElementById('joyBase');
const joyKnobEl = document.getElementById('joyKnob');

function buildHud() {
  hudEl.innerHTML = '';
  TYPES.forEach(t => {
    const el = document.createElement('div');
    el.className = 'counter';
    el.innerHTML = `<span class="dot" style="background:${t.base}"></span><span class="n" id="cur_${t.id}">${currency[t.id]}</span>`;
    hudEl.appendChild(el);
  });
}
function bumpCurrency(id, amount) {
  currency[id] += amount;
  saveCurrency();
  const n = document.getElementById('cur_' + id);
  if (n) { n.textContent = currency[id]; n.classList.remove('bump'); void n.offsetWidth; n.classList.add('bump'); }
}
buildHud();

// ---------------------------------------------------------------------
// Three.js scene
// ---------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#e8c07d');
scene.fog = new THREE.Fog('#e8c07d', 20, 34);

const camera = new THREE.OrthographicCamera(-8, 8, 8, -8, 0.1, 100);

scene.add(new THREE.HemisphereLight('#fff6e0', '#c98a3c', 0.9));
const sun = new THREE.DirectionalLight('#fff2d0', 1.05);
sun.position.set(5, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: '#e8c07d', roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------------------------------------------------------------------
// Fruit textures (procedural canvas)
// ---------------------------------------------------------------------
function makeFruitMaterial(t) {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size * 0.35, size * 0.32, size * 0.05, size * 0.5, size * 0.5, size * 0.62);
  g.addColorStop(0, t.light);
  g.addColorStop(0.55, t.base);
  g.addColorStop(1, t.dark);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = t.speck;
  const specks = t.id === 'melon' ? 40 : t.id === 'berry' ? 60 : 14;
  for (let i = 0; i < specks; i++) {
    ctx.globalAlpha = 0.35 + Math.random() * 0.3;
    const x = Math.random() * size, y = Math.random() * size;
    const r = t.id === 'melon' ? 1.2 : 2 + Math.random() * 2.5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.45, metalness: 0.05 });
}
TYPES.forEach(t => { t.material = makeFruitMaterial(t); });

const UNIT_SPHERE = new THREE.SphereGeometry(1, 20, 16);
const NORMAL_R = 0.42, BIG_R = 0.64;

// ---------------------------------------------------------------------
// Field layout
// ---------------------------------------------------------------------
const CELL = 1.05;
let fieldHalfX = (COLS * CELL) / 2;
let fieldHalfZ = (rows * CELL) / 2;
const fieldGroup = new THREE.Group();
scene.add(fieldGroup);
let fruits = []; // { mesh, x, z, r, type, big, eaten }

function gridToWorld(row, col) {
  return {
    x: (col - (COLS - 1) / 2) * CELL,
    z: (row - (rows - 1) / 2) * CELL,
  };
}

function pickRegionType(row, col) {
  const bananaBlock = row >= 1 && row <= 3 && col >= 2 && col <= 4;
  if (bananaBlock && Math.random() < 0.85) return 'banana';
  const t = col < COLS / 2
    ? (Math.random() < 0.6 ? 'berry' : 'lychee')
    : (Math.random() < 0.6 ? 'lychee' : 'berry');
  return Math.random() < 0.12 ? TYPES[Math.floor(Math.random() * TYPES.length)].id : t;
}

function buildField() {
  fieldGroup.clear();
  fruits = [];
  fieldHalfX = (COLS * CELL) / 2;
  fieldHalfZ = (rows * CELL) / 2;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < COLS; c++) {
      const type = pickRegionType(r, c);
      const big = Math.random() < 0.15;
      const radius = big ? BIG_R : NORMAL_R;
      const t = TYPE_BY_ID[type];
      const mesh = new THREE.Mesh(UNIT_SPHERE, t.material);
      const { x, z } = gridToWorld(r, c);
      const yScale = type === 'banana' ? radius * 0.62 : radius;
      mesh.scale.set(radius, yScale, radius);
      mesh.position.set(x, yScale, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      fieldGroup.add(mesh);
      fruits.push({ mesh, x, z, r: radius, type, big, eaten: false });
    }
  }
}

// ---------------------------------------------------------------------
// Hole (drag-controlled, grows as it eats)
// ---------------------------------------------------------------------
const BASE_HOLE_R = 0.56;
let holeRadius = BASE_HOLE_R;
let holeX = 0, holeZ = fieldHalfZ - 1.4;
let holeGroup;
function buildHole() {
  if (holeGroup) scene.remove(holeGroup);
  holeGroup = new THREE.Group();
  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(BASE_HOLE_R, 0.13, 12, 28),
    new THREE.MeshStandardMaterial({ color: '#e08a2e', roughness: 0.5 })
  );
  rim.rotation.x = Math.PI / 2;
  rim.position.y = 0.02;
  rim.castShadow = true;
  const inner = new THREE.Mesh(
    new THREE.CircleGeometry(BASE_HOLE_R * 0.86, 28),
    new THREE.MeshBasicMaterial({ color: '#0a0603' })
  );
  inner.rotation.x = -Math.PI / 2;
  inner.position.y = 0.03;
  holeGroup.add(rim, inner);
  scene.add(holeGroup);
}

function resetHole() {
  holeRadius = BASE_HOLE_R + (sizeStage - 1) * 0.05;
  holeX = 0;
  holeZ = fieldHalfZ - 1.4;
  buildHole();
}

// ---------------------------------------------------------------------
// Camera
// ---------------------------------------------------------------------
let camX = 0, camZ = 0;
function fitCamera() {
  const aspect = innerWidth / innerHeight;
  const halfV = Math.max(6.5, (fieldHalfZ + 2));
  const halfH = halfV * aspect;
  camera.left = -halfH; camera.right = halfH;
  camera.top = halfV; camera.bottom = -halfV;
  camera.updateProjectionMatrix();
}
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  fitCamera();
}
addEventListener('resize', resize);

// ---------------------------------------------------------------------
// Eating logic
// ---------------------------------------------------------------------
function checkEat() {
  for (const f of fruits) {
    if (f.eaten) continue;
    const dx = f.x - holeX, dz = f.z - holeZ;
    const dist = Math.hypot(dx, dz);
    const sizeOk = f.r <= holeRadius * 0.92;
    if (sizeOk && dist < holeRadius * 0.62) eatFruit(f);
  }
}

function eatFruit(f) {
  f.eaten = true;
  bumpCurrency(f.type, 1);
  holeRadius = Math.min(holeRadius + (f.big ? 0.05 : 0.017), BASE_HOLE_R + 2.2);
  const mesh = f.mesh;
  const t0 = performance.now();
  const startPos = mesh.position.clone();
  const startScale = mesh.scale.clone();
  const dur = 180;
  (function step(now) {
    const p = Math.min(1, (now - t0) / dur);
    mesh.position.set(
      startPos.x + (holeX - startPos.x) * p,
      startPos.y * (1 - p),
      startPos.z + (holeZ - startPos.z) * p
    );
    mesh.scale.set(startScale.x * (1 - p), startScale.y * (1 - p), startScale.z * (1 - p));
    if (p < 1) requestAnimationFrame(step);
    else { fieldGroup.remove(mesh); checkLevelClear(); }
  })(t0);
}

function checkLevelClear() {
  if (fruits.every(f => f.eaten)) onCleared();
}

function onCleared() {
  overlayTitleEl.textContent = 'Bölüm Tamam! 🎉';
  overlayEl.style.display = 'flex';
}

document.getElementById('continueBtn').addEventListener('click', () => {
  overlayEl.style.display = 'none';
  level++;
  sizeStage++;
  rows = Math.min(9 + Math.floor(sizeStage / 2), 16);
  lvlNEl.textContent = level;
  sizeNEl.textContent = sizeStage;
  buildField();
  resetHole();
  fitCamera();
});

// ---------------------------------------------------------------------
// Drag joystick input
// ---------------------------------------------------------------------
let touchId = null, joyBaseX = 0, joyBaseY = 0;
let joyX = 0, joyY = 0;
const MAX_JOY = 55;

app.addEventListener('pointerdown', (e) => {
  touchId = e.pointerId;
  joyBaseX = e.clientX; joyBaseY = e.clientY;
  joyBaseEl.style.left = joyBaseX + 'px'; joyBaseEl.style.top = joyBaseY + 'px';
  joyKnobEl.style.left = joyBaseX + 'px'; joyKnobEl.style.top = joyBaseY + 'px';
  joyBaseEl.classList.add('show'); joyKnobEl.classList.add('show');
  app.setPointerCapture(e.pointerId);
  if (hintEl.style.opacity !== '0') hintEl.style.opacity = '0';
});
app.addEventListener('pointermove', (e) => {
  if (e.pointerId !== touchId) return;
  let dx = e.clientX - joyBaseX, dy = e.clientY - joyBaseY;
  const len = Math.hypot(dx, dy);
  if (len > MAX_JOY) { dx = dx / len * MAX_JOY; dy = dy / len * MAX_JOY; }
  joyKnobEl.style.left = (joyBaseX + dx) + 'px';
  joyKnobEl.style.top = (joyBaseY + dy) + 'px';
  joyX = dx / MAX_JOY; joyY = dy / MAX_JOY;
});
function endDrag(e) {
  if (e.pointerId !== touchId) return;
  touchId = null; joyX = 0; joyY = 0;
  joyBaseEl.classList.remove('show'); joyKnobEl.classList.remove('show');
}
app.addEventListener('pointerup', endDrag);
app.addEventListener('pointercancel', endDrag);

// ---------------------------------------------------------------------
// Boot + main loop
// ---------------------------------------------------------------------
buildField();
resetHole();
resize();
document.getElementById('loading').style.display = 'none';

const MOVE_SPEED = 3.4;
let lastT = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (joyX || joyY) {
    holeX += joyX * MOVE_SPEED * dt;
    holeZ += joyY * MOVE_SPEED * dt;
    const mX = fieldHalfX - holeRadius * 0.5;
    const mZ = fieldHalfZ - holeRadius * 0.5;
    holeX = Math.max(-mX, Math.min(mX, holeX));
    holeZ = Math.max(-mZ, Math.min(mZ, holeZ));
  }

  holeGroup.position.set(holeX, 0, holeZ);
  const s = holeRadius / BASE_HOLE_R;
  holeGroup.scale.set(s, 1, s);

  camX += (holeX - camX) * 0.09;
  camZ += (holeZ - camZ) * 0.09;
  camera.position.set(camX, 14, camZ + 3.4);
  camera.lookAt(camX, 0, camZ);

  checkEat();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
