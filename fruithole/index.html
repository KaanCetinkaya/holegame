// ---------------------------------------------------------------------
// Level patterns
//
// Levels are laid out by hand rather than scattered at random: each one
// puts the types into a readable shape, so a field looks planted instead
// of noisy and you can plan a route through it. Levels cycle through the
// list, so the shape tells you which level you are on.
//
//   type(r, c) -> type id for that cell
//   big(r, c)  -> true if the cell holds an oversized fruit (optional;
//                 oversized fruit needs a grown hole, so where they sit
//                 is what actually shapes the route)
// ---------------------------------------------------------------------
const ID = TYPES.map(t => t.id);
function midCol() { return (COLS - 1) / 2; }
function midRow() { return (rows - 1) / 2; }
function scatter(chance) { return Math.random() < chance; }

// Value noise: smooth, repeatable blobs. Regions grown from this have
// ragged edges, which is what makes a field look planted rather than
// printed -- straight rows of one fruit read as a spreadsheet.
function noiseAt(x, y, seed) {
  const rand = (xi, yi) => {
    const n = Math.sin(xi * 127.1 + yi * 311.7 + seed * 74.7) * 43758.5453;
    return n - Math.floor(n);
  };
  const smooth = t => t * t * (3 - 2 * t);
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const a = rand(xi, yi), b = rand(xi + 1, yi);
  const c = rand(xi, yi + 1), d = rand(xi + 1, yi + 1);
  const u = smooth(xf), v = smooth(yf);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

// Two octaves: big shapes with a little fray along their borders.
function blob(r, c, scale, seed) {
  return noiseAt(c * scale, r * scale, seed) * 0.72 +
         noiseAt(c * scale * 2.7, r * scale * 2.7, seed + 19) * 0.28;
}

function typeFromNoise(r, c, scale, seed) {
  // value noise bunches around the middle, so stretch the useful band
  // across all four types instead of leaving the outer two rare
  const n = (blob(r, c, scale, seed) - 0.26) / 0.48;
  return ID[Math.min(3, Math.max(0, Math.floor(n * 4)))];
}

// Clearings: patches of bare ground, so the field is not a solid carpet.
function clearing(r, c, seed, cut) {
  return blob(r, c, 0.18, seed + 51) < cut;
}

// Each level is one big shape sitting on open ground, not a carpet that
// fills the board. `empty` carves the silhouette; `type` only decides
// which fruit sits where inside it. Edges get a noise wobble so the
// outline is hand-drawn rather than stamped.
function shapeCoords(r, c) {
  return {
    nx: (c - midCol()) / (COLS / 2),
    ny: (r - midRow()) / (rows / 2),
    wob: (blob(r, c, 0.45, 91) - 0.5) * 0.22,
  };
}

// Sampling noise at a block's corner makes the whole block one fruit, so
// regions come out rectangular instead of rounded -- the packed-crate look.
function blockType(r, c, bw, bh, seed) {
  return typeFromNoise(Math.floor(r / bh) * bh, Math.floor(c / bw) * bw, 0.45, seed);
}

// Quantising a coordinate before a shape test turns a smooth outline into
// a staircase, which is how a dense field of boxes actually ends.
function stepped(v, size) { return Math.floor(v / size) * size; }

// Height profiles for the patterns.
//
// Every level used to be one layer deep, or piled by noise, which comes out
// as random lumps rather than a structure. These give each pattern a shape
// in the third dimension too — a stepped pyramid really is stepped, a wall
// really is a wall — so the board reads as something built rather than
// scattered. `t` is 0 at the outside of the form and 1 at its heart.
function ridge(t, peak) { return 1 + Math.round(Math.max(0, t) * peak); }
// distance from the middle of the board, 0 at centre and 1 at the corners
function fromCentre(r, c) {
  const { nx, ny } = shapeCoords(r, c);
  return Math.min(1, Math.hypot(nx, ny * 0.85));
}

const PATTERNS = [
  {
    name: 'Pyramid', icon: '🔺',
    // wide at the bottom, narrowing to a point at the top -- and piled
    // higher toward the middle, so it is a pyramid from the side too
    empty: (r, c) => {
      const { nx, ny, wob } = shapeCoords(r, c);
      return ny > 0.82 || Math.abs(nx) > (ny + 1) * 0.46 + wob;
    },
    stack: (r, c) => {
      const { nx, ny } = shapeCoords(r, c);
      const edge = (ny + 1) * 0.46;
      // Height has to fall off towards both ends, not just towards the
      // sides. Keyed only to the centre line it spiked at the tip — the
      // narrowest row is also the one nearest its own centre — and the
      // pyramid came out as a needle.
      const across = Math.max(0, 1 - Math.abs(nx) / Math.max(0.15, edge));
      const along = Math.max(0, 1 - Math.abs(ny - 0.15) / 0.85);
      return ridge(across * along, 3);
    },
    type: (r, c) => typeFromNoise(r, c, 0.2, 3),
    big: (r, c) => blob(r, c, 0.5, 71) > 0.72,
  },
  {
    name: 'Piles', icon: '🥞',
    // sparse ground with tall piles dotted across it
    empty: (r, c) => !(r % 2 === 1 && c % 2 === 1) || blob(r, c, 0.35, 13) < 0.32,
    stack: (r, c) => ridge((blob(r, c, 0.35, 13) - 0.32) / 0.68, 3),
    type: (r, c) => typeFromNoise(r, c, 0.5, 29),
    big: () => false,
  },
  {
    name: 'Walls', icon: '🧱',
    // winding walls with open corridors to work along
    empty: (r, c) => Math.abs(blob(r, c, 0.19, 77) - 0.5) > 0.11,
    stack: (r, c) => ridge(1 - Math.abs(blob(r, c, 0.19, 77) - 0.5) / 0.11, 3),
    type: (r, c) => typeFromNoise(r, c, 0.28, 77),
    big: (r, c) => blob(r, c, 0.45, 9) > 0.76,
  },
  {
    name: 'Blocks', icon: '🧊',
    // rectangular crates of one fruit, mass ending in a stepped edge
    empty: (r, c) => {
      const qr = stepped(r, 3), qc = stepped(c, 3);
      const nx = (qc - midCol()) / (COLS / 2), ny = (qr - midRow()) / (rows / 2);
      return Math.abs(nx) > 0.94 || ny > 0.55 || ny < -0.95;
    },
    type: (r, c) => blockType(r, c, 4, 3, 55),
    stack: (r, c) => 1 + Math.round(blob(stepped(r, 3), stepped(c, 4), 0.5, 67) * 2),
    big: (r, c) => blockType(r, c, 4, 3, 55) === 'melon' && r % 3 === 1 && c % 4 === 2,
  },
  {
    name: 'Stairs', icon: '🪜',
    // the mass descends across the board in broad steps
    empty: (r, c) => {
      const stepH = 3;
      const line = midCol() + (stepped(r, stepH) - midRow()) * 0.55;
      return c < line - 5.5 || c > line + 5.5;
    },
    type: (r, c) => blockType(r, c, 3, 3, 83),
    stack: (r) => 1 + (Math.floor(r / 3) % 4),
    big: (r, c) => blob(r, c, 0.4, 47) > 0.76,
  },
  {
    name: 'Heart', icon: '💛',
    empty: (r, c) => {
      const { nx, ny, wob } = shapeCoords(r, c);
      const x = nx / 0.9, y = -ny / 0.85 + 0.28;
      const s = x * x + y * y - 1;
      return s * s * s - x * x * y * y * y > wob * 2;
    },
    // a mound: deepest through the body, thinning out to the point
    stack: (r, c) => {
      const { nx, ny } = shapeCoords(r, c);
      return ridge(1 - Math.hypot(nx * 1.1, (ny + 0.15) * 1.5), 3);
    },
    type: (r, c) => typeFromNoise(r, c, 0.22, 61),
    big: (r, c) => blob(r, c, 0.4, 12) > 0.74,
  },
  {
    name: 'Star', icon: '⭐',
    empty: (r, c) => {
      const { nx, ny, wob } = shapeCoords(r, c);
      const d = Math.hypot(nx, ny * 0.95);
      const a = Math.atan2(ny, nx);
      return d > (0.55 + 0.4 * Math.cos(5 * a - Math.PI / 2)) + wob;
    },
    // a tower where the arms meet, the points left thin
    stack: (r, c) => ridge(1 - fromCentre(r, c) / 0.5, 4),
    type: (r, c) => typeFromNoise(r, c, 0.34, 4),
    big: (r, c) => blob(r, c, 0.45, 88) > 0.74,
  },
  {
    name: 'Island', icon: '🏝️',
    // a ragged blob, the least regular of the set
    empty: (r, c) => {
      const { nx, ny } = shapeCoords(r, c);
      const d = Math.hypot(nx, ny * 0.9);
      return d > 0.55 + (blob(r, c, 0.3, 11) - 0.5) * 0.9;
    },
    // a volcano: the ground climbs to a ridge and drops into a bowl
    stack: (r, c) => {
      const d = fromCentre(r, c);
      return ridge(1 - Math.abs(d - 0.34) / 0.3, 3);
    },
    type: (r, c) => typeFromNoise(r, c, 0.2, 11),
    big: (r, c) => blob(r, c, 0.45, 3) > 0.73,
  },
  {
    name: 'Ring', icon: '🎯',
    empty: (r, c) => {
      const { nx, ny, wob } = shapeCoords(r, c);
      const d = Math.hypot(nx, ny * 0.95);
      return d > 0.92 + wob || d < 0.42 + wob;
    },
    // a wall standing in a circle, tallest along its crest
    stack: (r, c) => {
      const { nx, ny } = shapeCoords(r, c);
      const d = Math.hypot(nx, ny * 0.95);
      return ridge(1 - Math.abs(d - 0.67) / 0.25, 3);
    },
    type: (r, c) => typeFromNoise(r, c, 0.26, 43),
    // a band of oversized fruit around the outer rim of the ring
    big: (r, c) => {
      const { nx, ny } = shapeCoords(r, c);
      const d = Math.hypot(nx, ny * 0.95);
      return d > 0.8 && d < 0.87;
    },
  },
  {
    name: 'Diamond', icon: '💎',
    empty: (r, c) => {
      const { nx, ny, wob } = shapeCoords(r, c);
      return Math.abs(nx) + Math.abs(ny) * 0.9 > 0.9 + wob;
    },
    // a faceted stone: a ridge along the middle falling away to the edges
    stack: (r, c) => {
      const { nx, ny } = shapeCoords(r, c);
      return ridge(1 - (Math.abs(nx) + Math.abs(ny) * 0.9) / 0.9, 3);
    },
    type: (r, c) => typeFromNoise(r, c, 0.22, 31),
    big: (r, c) => blob(r, c, 0.4, 19) > 0.75,
  },
  {
    name: 'Spiral', icon: '🌀',
    // an arm curling out from the middle
    empty: (r, c) => {
      const { nx, ny, wob } = shapeCoords(r, c);
      const d = Math.hypot(nx, ny * 0.95);
      if (d > 1 || d < 0.1) return true;
      const a = Math.atan2(ny, nx) + d * 4.2;
      return Math.abs(Math.sin(a)) > 0.55 + wob;
    },
    // climbs as the arm winds inward, like a ziggurat ramp
    stack: (r, c) => ridge(1 - fromCentre(r, c), 3),
    type: (r, c) => typeFromNoise(r, c, 0.3, 17),
    big: () => scatter(0.1),
  },
  {
    name: 'Cross', icon: '🔀',
    // two broad bands crossing, leaving four open corners
    empty: (r, c) => {
      const { nx, ny, wob } = shapeCoords(r, c);
      if (Math.abs(nx) > 0.95 || Math.abs(ny) > 0.92) return true;
      return Math.abs(nx - ny) > 0.42 + wob && Math.abs(nx + ny) > 0.42 + wob;
    },
    // each band is a ridge, and they pile into a tower where they meet
    stack: (r, c) => {
      const { nx, ny } = shapeCoords(r, c);
      const a = 1 - Math.abs(nx - ny) / 0.42;
      const b = 1 - Math.abs(nx + ny) / 0.42;
      return ridge(Math.max(a, b) * 0.6 + Math.max(0, 1 - fromCentre(r, c) / 0.4) * 0.7, 3);
    },
    type: (r, c) => typeFromNoise(r, c, 0.24, 97),
    big: (r, c) => blob(r, c, 0.42, 33) > 0.74,
  },
];

function buildField() {
  for (const f of flecks) { scene.remove(f.m); FLECK_POOL.push(f.m); }
  flecks.length = 0;
  rimPulse = 0; shake = 0;
  fieldGroup.clear();
  // The menu diorama turns this group, and clear() does not touch the
  // transform — without this the board starts rotated by however long you
  // sat on the menu, so the rows run diagonally and the whole field leans.
  fieldGroup.rotation.set(0, 0, 0);
  fruits = [];
  eatenCount = 0;
  fieldHalfX = (COLS * CELL) / 2;
  fieldHalfZ = (rows * CELL) / 2;
  fitGround();
  currentPattern = PATTERNS[(level - 1) % PATTERNS.length];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < COLS; c++) {
      if (currentPattern.empty && currentPattern.empty(r, c)) continue;
      const type = currentPattern.type(r, c);
      const big = currentPattern.big ? currentPattern.big(r, c) : scatter(0.12);
      const radius = big ? BIG_R : NORMAL_R;
      const vis = fruitVisual(type, radius);
      const { x, z } = gridToWorld(r, c);

      // A cell can hold a pile. Each fruit in it is its own entry, so the
      // hole takes the whole stack as it passes and the pile drops in.
      // Some cells hold a tower rather than one piece. Stacks existed before
      // only where a pattern asked for them, and never more than a couple
      // high, so from above the board was a single flat layer. These are
      // tall enough to see against the ground and they topple in one go when
      // the hole passes under them.
      let height = currentPattern.stack ? Math.max(1, currentPattern.stack(r, c)) : 1;
      if (Math.random() < 0.07) height = Math.max(height, 3 + Math.floor(Math.random() * 3));
      for (let k = 0; k < height; k++) {
        // A little jitter in size and lean. Without it every cell holds an
        // identical object and the field reads as a printed grid rather than
        // fruit that was dropped there.
        const jit = 0.96 + Math.random() * 0.08;
        const mesh = new THREE.Mesh(vis.geo, vis.mat);
        const y = vis.baseY * jit + k * vis.sy * 2.05;
        mesh.scale.set(vis.sx * jit, vis.sy * jit, vis.sx * jit);
        mesh.position.set(x, y, z);
        mesh.userData.ox = x; mesh.userData.oz = z;
        // Spin only about the upright axis. Leaning them was meant to look
        // casual, but a tilted disc seen from above sits off its own centre
        // and the rows come out wavy — the whole grid reads as crooked.
        mesh.rotation.y = Math.random() * Math.PI * 2;
        // Casts onto the ground, but never receives. In a tower each piece
        // sits square in the shadow of the one above it, leaving a lit sliver
        // down one side — every ball then looks shoved off its own centre and
        // the stack reads as toppling. Fruit lit only by the sky is cleaner.
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        fieldGroup.add(mesh);
        fruits.push({ mesh, x, z, r: radius, type, big, eaten: false, baseY: y, nudge: 0 });
      }
    }
  }
  // A level ends when every fruit on the field has been eaten.
  levelGoal = fruits.length;
}

// ---------------------------------------------------------------------
// Hole
// ---------------------------------------------------------------------
const BASE_HOLE_R = 0.62;
const HOLE_MAX = BASE_HOLE_R + 2.2;
let holeRadius = BASE_HOLE_R;
let holeX = 0, holeZ = 0;
let holeGroup;


// The pit cannot be cut out of a solid ground plane without a stencil pass,
// and a shaft modelled below the plane is simply hidden by it — the ground
// has no opening for it to show through. The mouth is therefore painted,
// but painted as a shaft: courses of brick receding into the dark, lit down
// one side and shadowed down the other, so it reads as depth from the side
// as well as from overhead.
function holeInteriorTexture() {
  const S = 512, [c, ctx] = newCanvas(S);
  const cx = S / 2, cy = S / 2, R = S / 2;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = '#4a2a12';
  ctx.fillRect(0, 0, S, S);

  // brick courses, each ring smaller and darker than the one above it
  const rings = 7;
  for (let i = 0; i < rings; i++) {
    const r0 = R * (1 - i / rings), r1 = R * (1 - (i + 1) / rings);
    const seg = 16 + i * 3;
    for (let sg = 0; sg < seg; sg++) {
      const a0 = (sg / seg) * Math.PI * 2 + (i % 2 ? Math.PI / seg : 0);
      const a1 = a0 + (Math.PI * 2 / seg) * 0.88;
      // light falls from the upper left, so bricks facing that way are lit
      const mid = (a0 + a1) / 2;
      const lit = Math.max(0, Math.cos(mid - Math.PI * 1.25));
      const base = 74 + lit * 58 - i * 7;
      ctx.fillStyle = `rgb(${base | 0}, ${(base * 0.62) | 0}, ${(base * 0.34) | 0})`;
      ctx.beginPath();
      ctx.arc(cx, cy, r0, a0, a1);
      ctx.arc(cx, cy, r1, a1, a0, true);
      ctx.closePath(); ctx.fill();
    }
  }

  // and the dark that swallows it
  const g = ctx.createRadialGradient(cx, cy, R * 0.03, cx, cy, R);
  g.addColorStop(0, 'rgba(0,0,0,1)');
  g.addColorStop(0.5, 'rgba(0,0,0,.92)');
  g.addColorStop(0.86, 'rgba(0,0,0,.42)');
  g.addColorStop(1, 'rgba(0,0,0,.1)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  ctx.restore();
  return finishTexture(c);
}
const HOLE_INTERIOR_MAT = new THREE.MeshBasicMaterial({ map: holeInteriorTexture() });
const HOLE_RIM_MAT = new THREE.MeshStandardMaterial({
  color: '#f59321', roughness: 0.35, metalness: 0.05,
});
const HOLE_LIP_MAT = new THREE.MeshStandardMaterial({ color: '#ffc978', roughness: 0.5 });

function buildHole() {
  if (holeGroup) scene.remove(holeGroup);
  holeGroup = new THREE.Group();

  // Collar: real geometry, so it takes the scene's light and throws a
  // shadow onto the sand — the part that makes the hole sit in the ground
  // rather than on it.
  const rim = new THREE.Mesh(new THREE.TorusGeometry(BASE_HOLE_R, 0.17, 18, 44), HOLE_RIM_MAT);
  rim.rotation.x = Math.PI / 2;
  rim.position.y = 0.02;
  rim.castShadow = true;
  rim.receiveShadow = true;

  // pale inner lip, to catch the light where the ground breaks away
  const lip = new THREE.Mesh(new THREE.TorusGeometry(BASE_HOLE_R * 0.91, 0.055, 12, 40), HOLE_LIP_MAT);
  lip.rotation.x = Math.PI / 2;
  lip.position.y = 0.055;

  const inner = new THREE.Mesh(new THREE.CircleGeometry(BASE_HOLE_R * 0.9, 44), HOLE_INTERIOR_MAT);
  inner.rotation.x = -Math.PI / 2;
  inner.position.y = 0.03;

  holeGroup.add(rim, lip, inner);
  scene.add(holeGroup);
}

function resetHole() {
  holeRadius = BASE_HOLE_R + (sizeStage - 1) * 0.05 + upg('size') * 0.06;
  holeX = 0;
  holeZ = fieldHalfZ * 0.55;
  buildHole();
}

// ---------------------------------------------------------------------
// Camera
// ---------------------------------------------------------------------
let camX = 0, camZ = 0;
// The field is only seven columns wide, so the width sets the zoom -- that
// keeps fruit a readable size on a phone instead of shrinking it to fit a
// tall screen. Height then follows from the aspect ratio.
function fitCamera() {
  const aspect = innerWidth / innerHeight;
  const halfH = 5.4;   // fixed view width; the field runs past it and the camera travels
  const halfV = halfH / aspect;
  camera.left = -halfH; camera.right = halfH;
  camera.top = halfV; camera.bottom = -halfV;
  camera.updateProjectionMatrix();
}

// Keep the view inside the field: following the hole to the very edge
// would otherwise park half the screen on empty ground.
// The camera used to stop right at the last row, so the board looked like
// it went on forever. It may now overshoot far enough to put the beach and
// the water's edge on screen — that is what tells you where the field ends.
function clampCamera() {
  const limX = Math.max(0, fieldHalfX + 4 - camera.right);
  const limZ = Math.max(0, fieldHalfZ + 4 - camera.top);
  camX = Math.max(-limX, Math.min(limX, camX));
  camZ = Math.max(-limZ, Math.min(limZ, camZ));
}
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  fitCamera();
}
addEventListener('resize', resize);

// ---------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------
let state = 'menu';           // 'menu' | 'playing' | 'won' | 'lost'
let timeLeft = 0;
let lastWholeSecond = -1;
let streak = 0, lastEatAt = -9999;
let runStart = 0;
let revivedThisLevel = false;

// Seconds a perfect boustrophedon sweep of the whole board would take. The
// hole clears a lane of its own diameter and that diameter grows as it eats,
// so the area is integrated rather than divided by one average radius — the
// first pass is made with a small hole and is by far the slowest part.
function sweepSeconds() {
  const area = fieldHalfX * 2 * fieldHalfZ * 2;
  const steps = 60, dA = area / steps;
  let t = 0;
  for (let i = 0; i < steps; i++) {
    const eaten = levelGoal * ((i + 0.5) / steps);
    const r = Math.min(HOLE_MAX, holeRadius + eaten * 0.017);
    t += dA / (2 * r * BASE_MOVE_SPEED);
  }
  return t;
}

function levelTime() {
  // Derived from the route the hole actually has to travel, not from the
  // fruit count. Counting fruit gave sparse patterns like Island a short
  // clock for a full-size board to sweep, while dense ones like Blocks got a
  // long clock they did not need — Island came out impossible at the same
  // setting that left Blocks 64% spare. Measuring the sweep makes every
  // pattern the same difficulty.
  //
  // 2.6x leaves roughly a third of the clock unused on a clean run and none
  // at all on a wandering one. The old formula (60 + fruit * 0.35) left
  // 42-82% spare everywhere: no level could be lost, every level scored
  // three stars, and the rewarded "+15 seconds" ad never appeared.
  const base = Math.round(sweepSeconds() * 2.6);
  const squeeze = 1 - Math.min(0.28, tier() * 0.07);   // later cycles are tighter
  return Math.round(base * squeeze) + upg('time') * 5;
}

// Stars reflect how much time is still on the clock, so clearing fast is
// worth more than clearing at all. Shown live during play, awarded on clear.
function liveStars() {
  const ratio = timeLeft / Math.max(1, levelTime());
  return ratio >= 0.45 ? 3 : ratio >= 0.2 ? 2 : 1;
}

let lastProgPct = -1, lastStarCount = -1;
function updateProgressUI() {
  const pct = levelGoal ? Math.min(100, Math.round((eatenCount / levelGoal) * 100)) : 0;
  if (pct !== lastProgPct) { progFillEl.style.width = pct + '%'; lastProgPct = pct; }
  if (state !== 'playing') return;
  const s = liveStars();
  if (s !== lastStarCount) {
    lastStarCount = s;
    [...starRowEl.children].forEach((el, i) => el.classList.toggle('on', i < s));
  }
}

// ---------------------------------------------------------------------
// Size badge
//
// Rides under the hole in screen space: the hole's world position is
// projected through the camera every frame, so the badge tracks it as
// the camera moves and the hole grows.
// ---------------------------------------------------------------------
const sizeTagEl = document.getElementById('sizeTag');
const sizeNEl = document.getElementById('sizeN');
const _proj = new THREE.Vector3();
let shownSize = 0;

function holeSizeStep() { return 1 + Math.floor((holeRadius - BASE_HOLE_R) / 0.2); }

function updateSizeTag() {
  const step = holeSizeStep();
  if (step !== shownSize) {
    shownSize = step;
    sizeNEl.textContent = step;
    sizeTagEl.classList.remove('grow');
    void sizeTagEl.offsetWidth;
    sizeTagEl.classList.add('grow');
  }
  // bottom edge of the hole, then a little further down
  _proj.set(holeX, 0, holeZ + holeRadius + 0.35).project(camera);
  sizeTagEl.style.left = ((_proj.x * 0.5 + 0.5) * innerWidth) + 'px';
  sizeTagEl.style.top = ((-_proj.y * 0.5 + 0.5) * innerHeight) + 'px';
}

function flash(text) {
  comboEl.textContent = text;
  comboEl.classList.remove('show');
  void comboEl.offsetWidth;
  comboEl.classList.add('show');
}
function showCombo(mult) { flash(`x${mult} COMBO!`); }

// ---------------------------------------------------------------------
// Booster bar
// ---------------------------------------------------------------------
let magnetBoostUntil = 0;

function renderBoosters() {
  boosterBarEl.innerHTML = '';
  // Locked slots are left out entirely: a row of "Lvl 7" plates reads as
  // nothing to a new player and sits on top of the fruit it hides. The
  // booster announces itself when it unlocks instead.
  BOOSTERS.filter(boosterUnlocked).forEach(b => {
    const n = boosters[b.id] || 0;
    const btn = document.createElement('button');
    btn.className = 'slot' + (n <= 0 ? ' empty' : '');
    btn.innerHTML = iconHTML(BOOSTER_ICON[b.id], b.icon, 'ic3') +
      (n > 0 ? `<span class="badge">${n}</span>` : '');
    btn.disabled = n <= 0;
    btn.onclick = () => useBooster(b);
    boosterBarEl.appendChild(btn);
  });
}

function useBooster(b) {
  if (state !== 'playing' || !boosterUnlocked(b) || (boosters[b.id] || 0) <= 0) return;
  boosters[b.id]--;
  saveBoosters();

  if (b.id === 'time') {
    timeLeft += 15;
    lastWholeSecond = -1;
    updateTimeUI();
  } else if (b.id === 'grow') {
    holeRadius = Math.min(HOLE_MAX, holeRadius + 0.4);
  } else if (b.id === 'magnet') {
    magnetBoostUntil = performance.now() + 8000;
  }

  sfx.booster();
  flash(`${b.icon} ${b.desc}`);
  renderBoosters();
}

function startLevel() {
  sizeStage = level;
  rows = Math.min(22 + Math.floor((level - 1) / 2) * 2, 34);
  buildField();
  resetHole();
  camX = holeX; camZ = holeZ;
  fitCamera();
  timeLeft = levelTime();
  lastWholeSecond = -1;
  streak = 0;
  revivedThisLevel = false;
  runStart = performance.now();
  showBanner();
  refreshLevelTag();
  updateTimeUI();
  lastProgPct = -1; lastStarCount = -1;
  updateProgressUI();
  magnetBoostUntil = 0;
  renderBoosters();
  boosterBarEl.classList.add('show');
  shownSize = 0;
  sizeTagEl.classList.add('show');
  parkJoystick();
  joyBaseEl.classList.add('show'); joyKnobEl.classList.add('show');
  menuEl.classList.remove('show');
  upgradesEl.classList.remove('show');
  overlayEl.classList.remove('show');
  topbarEl.classList.add('show');
  hintEl.style.opacity = '.8';
  state = 'playing';
}

function updateTimeUI() {
  const s = Math.max(0, Math.ceil(timeLeft));
  if (s !== lastWholeSecond) {
    lastWholeSecond = s;
    timeNEl.textContent = s >= 60
      ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0')
      : String(s);
    if (s <= 10 && s > 0 && state === 'playing') sfx.tick();
  }
  timeTagEl.classList.toggle('low', s <= 10);
}

function showOverlay(title, sub, btnText, action, offerRevive) {
  overlayTitleEl.textContent = title;
  overlaySubEl.textContent = sub;
  actionBtnEl.textContent = btnText;
  actionBtnEl.onclick = action;
  actionBtnEl.classList.toggle('ghost', !!offerRevive);
  reviveBtnEl.hidden = !offerRevive;
  boosterBarEl.classList.remove('show');
  sizeTagEl.classList.remove('show');
  joyBaseEl.classList.remove('show'); joyKnobEl.classList.remove('show');
  overlayEl.classList.add('show');
}

// One rewarded continue per level: watch an ad, get 15 more seconds and
// carry on with the field exactly as it was.
async function revive() {
  if (revivedThisLevel || state !== 'lost') return;
  reviveBtnEl.disabled = true;
  const ok = await showRewarded();
  reviveBtnEl.disabled = false;
  if (!ok) return;
  revivedThisLevel = true;
  timeLeft = 15;
  lastWholeSecond = -1;
  updateTimeUI();
  overlayEl.classList.remove('show');
  boosterBarEl.classList.add('show');
  sizeTagEl.classList.add('show');
  joyBaseEl.classList.add('show'); joyKnobEl.classList.add('show');
  state = 'playing';
}
reviveBtnEl.addEventListener('click', revive);

// An interstitial every third level, shown on the way into the next one
// rather than over the win screen.
function nextLevel() {
  if (level % 3 === 1 && level > 1) showInterstitial();
  startLevel();
}

function fillStats(earnedStars) {
  const secs = Math.round((performance.now() - runStart) / 1000);
  const starLine = earnedStars
    ? `<span class="pill">${'★'.repeat(earnedStars)}${'☆'.repeat(3 - earnedStars)}</span>`
    : '';
  overlayStatsEl.innerHTML = starLine +
    `<span class="pill">🍇 ${eatenCount} fruit</span>` +
    `<span class="pill">⏱ ${secs}s</span>`;
}

function onCleared() {
  if (state !== 'playing') return;
  const cleared = level;
  const earned = liveStars();
  state = 'won';
  sfx.win();
  fillStats(earned);

  const prevBest = stars[cleared] || 0;
  const isBest = earned > prevBest;
  if (isBest) { stars[cleared] = earned; saveStars(); }

  stats.levels++;
  stats.stars += earned;
  daily.levels = (daily.levels || 0) + 1;
  daily.stars = (daily.stars || 0) + earned;
  saveStats();
  saveDaily();
  refreshGoalsBadge();

  // Replaying an earlier level from the map must not roll progress back:
  // finishing level 3 when you had reached 10 leaves you on 10.
  const progress = parseInt(localStorage.getItem('fruithole_level') || '1', 10);
  level = Math.max(cleared + 1, progress);
  localStorage.setItem('fruithole_level', String(level));
  refreshMenuLevel();
  const sub = isBest && prevBest > 0 ? 'New best!' : `Next: level ${level}`;
  showOverlay('Level Complete! 🎉', sub, 'Next', nextLevel, false);
}

function onTimeUp() {
  if (state !== 'playing') return;
  state = 'lost';
  sfx.lose();
  fillStats();
  const left = Math.max(0, levelGoal - eatenCount);
  showOverlay("Time's Up! ⏱", `${left} fruit left`, 'Retry', startLevel, !revivedThisLevel);
}

// ---------------------------------------------------------------------
// Eating
// ---------------------------------------------------------------------
function checkEat(now) {
  for (const f of fruits) {
    if (f.eaten) continue;
    const dx = f.x - holeX, dz = f.z - holeZ;
    const dist = Math.hypot(dx, dz);
    if (dist > holeRadius + f.r) continue;
    if (f.r <= holeRadius * 0.92) {
      // over the opening is enough -- it falls in. Demanding a near-exact
      // pass over each centre made sweeping a field far too slow.
      if (dist < holeRadius * 0.95) eatFruit(f, now);
    } else if (dist < holeRadius && f.nudge <= 0) {
      f.nudge = 0.28;
      sfx.blocked();
    }
  }
}

// ---------------------------------------------------------------------
// Swallow feedback
//
// A fruit used to shrink and vanish, which gives the moment no weight. It
// now bursts into flecks of its own colour, the hole's collar pulses, and a
// long enough chain shakes the camera. All three are pooled and reused —
// this fires many times a second on a full sweep, so nothing is allocated
// mid-run.
// ---------------------------------------------------------------------
const FLECK_GEO = new THREE.SphereGeometry(0.09, 6, 5);
const FLECK_POOL = [];
const flecks = [];          // live ones

function fleckMaterial(type) {
  const t = TYPE_BY_ID[type];
  if (!fleckMaterial.cache) fleckMaterial.cache = {};
  if (!fleckMaterial.cache[type]) {
    fleckMaterial.cache[type] = new THREE.MeshBasicMaterial({
      color: t.uiBase || t.base, transparent: true,
    });
  }
  return fleckMaterial.cache[type];
}

function burst(x, y, z, type) {
  const mat = fleckMaterial(type);
  for (let i = 0; i < 6; i++) {
    const m = FLECK_POOL.pop() || new THREE.Mesh(FLECK_GEO, mat);
    m.material = mat;
    m.position.set(x, y + 0.1, z);
    m.scale.setScalar(1);
    m.visible = true;
    scene.add(m);
    const a = Math.random() * Math.PI * 2;
    const sp = 1.6 + Math.random() * 1.9;
    flecks.push({
      m, life: 0, ttl: 0.34 + Math.random() * 0.16,
      vx: Math.cos(a) * sp, vy: 2.6 + Math.random() * 1.8, vz: Math.sin(a) * sp,
    });
  }
}

function stepFlecks(dt) {
  for (let i = flecks.length - 1; i >= 0; i--) {
    const f = flecks[i];
    f.life += dt;
    if (f.life >= f.ttl) {
      scene.remove(f.m);
      f.m.visible = false;
      FLECK_POOL.push(f.m);
      flecks.splice(i, 1);
      continue;
    }
    f.vy -= 14 * dt;                       // gravity
    f.m.position.x += f.vx * dt;
    f.m.position.y += f.vy * dt;
    f.m.position.z += f.vz * dt;
    const k = 1 - f.life / f.ttl;
    f.m.scale.setScalar(k);
    f.m.material.opacity = k;
  }
}

// The collar swells for a moment on each swallow; repeated eats keep it up.
let rimPulse = 0;
// And a chain gives the camera a small kick, decaying on its own.
let shake = 0;

function eatFruit(f, now) {
  f.eaten = true;
  eatenCount++;
  // chaining eats pays a multiplier, so sweeping a same-type patch in one
  // pass is worth more than picking fruit off one at a time
  streak = (now - lastEatAt < 900) ? streak + 1 : 1;
  lastEatAt = now;
  const mult = Math.min(5, 1 + Math.floor(streak / 4));
  bumpCurrency(f.type, mult);
  stats.fruits++;
  daily.fruits = (daily.fruits || 0) + 1;
  if (mult > stats.bestCombo) stats.bestCombo = mult;
  if (mult > (daily.bestCombo || 0)) daily.bestCombo = mult;
  if (mult >= 2 && streak % 4 === 0) showCombo(mult);
  updateProgressUI();
  sfx.eat(streak);
  // clamp must never shrink a hole that already starts above the cap
  if (holeRadius < HOLE_MAX) holeRadius = Math.min(holeRadius + (f.big ? 0.05 : 0.017), HOLE_MAX);

  burst(f.x, f.mesh.position.y, f.z, f.type);
  rimPulse = 1;
  if (mult >= 3) shake = Math.min(0.5, shake + 0.14 * (mult - 2));

  // A piece high on a tower is not sucked straight down — it topples off
  // the stack first, then falls in. Without the delay a whole column
  // vanished at once and the towers had no weight at all.
  const mesh = f.mesh;
  const drop = Math.min(260, mesh.position.y * 150);
  const spin = (Math.random() - 0.5) * 7;
  const t0 = performance.now() + drop * 0.35;
  const startPos = mesh.position.clone();
  const startScale = mesh.scale.clone();
  const startRotX = mesh.rotation.x, startRotZ = mesh.rotation.z;
  const dur = 190 + drop * 0.5;

  (function step(t) {
    const p = Math.max(0, Math.min(1, (t - t0) / dur));
    // ease in: it tips slowly, then goes over the edge
    const e = p * p * (3 - 2 * p);
    mesh.position.set(
      startPos.x + (holeX - startPos.x) * e,
      startPos.y * (1 - e * e),
      startPos.z + (holeZ - startPos.z) * e
    );
    mesh.rotation.x = startRotX + spin * e;
    mesh.rotation.z = startRotZ + spin * 0.6 * e;
    const k = 1 - Math.max(0, (p - 0.45)) / 0.55;
    mesh.scale.set(startScale.x * k, startScale.y * k, startScale.z * k);
    if (p < 1) requestAnimationFrame(step);
    else {
      fieldGroup.remove(mesh);
      if (eatenCount >= levelGoal) onCleared();
    }
  })(performance.now());
}

// ---------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------
let touchId = null, joyBaseX = 0, joyBaseY = 0;
let joyX = 0, joyY = 0;
const MAX_JOY = 55;

// The stick sits at the bottom of the screen when idle, the way the other
// hole games show it, and only jumps to the finger while a drag is live.
function parkJoystick() {
  const x = innerWidth / 2;
  const y = innerHeight - 132;
  joyBaseEl.style.left = x + 'px'; joyBaseEl.style.top = y + 'px';
  joyKnobEl.style.left = x + 'px'; joyKnobEl.style.top = y + 'px';
}
addEventListener('resize', parkJoystick);

app.addEventListener('pointerdown', (e) => {
  if (state !== 'playing') return;
  if (e.target.closest && e.target.closest('button')) return;
  touchId = e.pointerId;
  joyBaseX = e.clientX; joyBaseY = e.clientY;
  joyBaseEl.style.left = joyBaseX + 'px'; joyBaseEl.style.top = joyBaseY + 'px';
  joyKnobEl.style.left = joyBaseX + 'px'; joyKnobEl.style.top = joyBaseY + 'px';
  joyBaseEl.classList.add('drag'); joyKnobEl.classList.add('drag');
  app.setPointerCapture(e.pointerId);
  hintEl.style.opacity = '0';
});
app.addEventListener('pointermove', (e) => {
  if (e.pointerId !== touchId) return;
  let dx = e.clientX - joyBaseX, dy = e.clientY - joyBaseY;
  const len = Math.hypot(dx, dy);
  if (len > MAX_JOY) { dx = dx / len * MAX_JOY; dy = dy / len * MAX_JOY; }
  joyKnobEl.style.left = (joyBaseX + dx) + 'px';
  joyKnobEl.style.top = (joyBaseY + dy) + 'px';
  joyX = dx / MAX_JOY; joyY = dy / MAX_JOY;
});
function endDrag(e) {
  if (e.pointerId !== touchId) return;
  touchId = null; joyX = 0; joyY = 0;
  joyBaseEl.classList.remove('drag'); joyKnobEl.classList.remove('drag');
  parkJoystick();
}
app.addEventListener('pointerup', endDrag);
app.addEventListener('pointercancel', endDrag);

document.getElementById('playBtn').addEventListener('click', () => { ensureAudio(); startLevel(); });

// ---------------------------------------------------------------------
// Interface icons
//
// The menu used emoji, which the system font draws — flat next to a 3D
// board, and different on every phone (Samsung's set looks nothing like
// Google's). These are modelled from primitives and rendered once at boot
// with the engine already loaded, then handed to CSS as images: solid,
// shadowed, and identical everywhere. Emoji stay in the markup as the
// fallback if WebGL will not give us a second context.
// ---------------------------------------------------------------------
// Glossy rather than matte. The look these icon sets share comes from a
// clearcoat hotspot and a hard key light, not from being 3D — ours were
// already rendered geometry and still read flat because they were matte.
function iconMat(color, opts = {}) {
  return new THREE.MeshPhysicalMaterial({
    color, roughness: opts.rough ?? 0.28, metalness: opts.metal ?? 0.05,
    clearcoat: 1, clearcoatRoughness: opts.cc ?? 0.12,
  });
}
const ICON_MAT = {
  gold:   iconMat('#ffc23a', { metal: 0.55, rough: 0.22 }),
  amber:  iconMat('#f09022'),
  cream:  iconMat('#fff8ea', { rough: 0.34 }),
  white:  iconMat('#ffffff', { rough: 0.36 }),
  red:    iconMat('#f22c3a'),
  green:  iconMat('#46c132'),
  blue:   iconMat('#2f9ae8'),
  purple: iconMat('#8878e2'),
  slate:  iconMat('#4a3a99', { rough: 0.34 }),
  dark:   iconMat('#2a2150', { rough: 0.4 }),
};
const OUTLINE_MAT = new THREE.MeshBasicMaterial({ color: '#1a0e40', side: THREE.BackSide });

function starShape(points, outer, inner) {
  const s = new THREE.Shape();
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 ? inner : outer;
    const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    i ? s.lineTo(x, y) : s.moveTo(x, y);
  }
  s.closePath();
  return s;
}
function extrude(shape, depth) {
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05, bevelSegments: 2,
  });
  g.center();
  return g;
}
function part(geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  return m;
}

// Each builder returns a group roughly two units across, facing +Z.
const ICON_BUILDERS = {
  // A closed book, not a folded sheet. Thin plates read as paper cut-outs at
  // this size; the reference set is all solid volumes.
  map(g) {
    g.add(part(new THREE.BoxGeometry(1.5, 1.75, 0.5), ICON_MAT.purple, 0, 0, 0));
    g.add(part(new THREE.BoxGeometry(1.34, 1.58, 0.52), ICON_MAT.cream, 0.06, 0, 0.02));
    g.add(part(new THREE.BoxGeometry(0.26, 1.75, 0.54), ICON_MAT.gold, -0.62, 0, 0));
    // bookmark ribbon over the top edge
    g.add(part(new THREE.BoxGeometry(0.2, 0.7, 0.12), ICON_MAT.gold, 0.42, 0.95, 0.2));
    g.add(part(new THREE.BoxGeometry(0.62, 0.12, 0.1), ICON_MAT.gold, 0.2, 0.2, 0.29));
    g.add(part(new THREE.BoxGeometry(0.44, 0.12, 0.1), ICON_MAT.gold, 0.11, -0.1, 0.29));
  },
  // An arrow standing on a ring, so it reads as an upgrade pad.
  arrow(g) {
    g.add(part(new THREE.ConeGeometry(0.7, 0.78, 4), ICON_MAT.green, 0, 0.5, 0)).rotation.y = Math.PI / 4;
    const stem = part(new THREE.BoxGeometry(0.6, 0.7, 0.48), ICON_MAT.green, 0, -0.2, 0);
    stem.rotation.y = Math.PI / 4;
    g.add(stem);
    const ring = part(new THREE.TorusGeometry(0.62, 0.13, 10, 24), ICON_MAT.slate, 0, -0.72, 0);
    ring.rotation.x = Math.PI / 2;
    g.add(ring);
  },
  // Cottage: ridged roof, chimney, door with a knob, one window.
  house(g) {
    g.add(part(new THREE.BoxGeometry(1.3, 0.92, 1.1), ICON_MAT.cream, 0, -0.36, 0));
    const roof = part(new THREE.ConeGeometry(1.12, 0.9, 4), ICON_MAT.red, 0, 0.55, 0);
    roof.rotation.y = Math.PI / 4;
    g.add(roof);
    g.add(part(new THREE.BoxGeometry(0.24, 0.5, 0.24), ICON_MAT.red, -0.45, 0.86, -0.2));
    const door = part(new THREE.BoxGeometry(0.36, 0.56, 0.1), ICON_MAT.amber, -0.18, -0.5, 0.57);
    g.add(door);
    g.add(part(new THREE.SphereGeometry(0.05, 10, 8), ICON_MAT.gold, -0.04, -0.5, 0.63));
    g.add(part(new THREE.BoxGeometry(0.3, 0.3, 0.08), ICON_MAT.blue, 0.32, -0.24, 0.57));
  },
  // Hex badge with a tick, in place of the thin clipboard.
  clipboard(g) {
    const plate = part(new THREE.CylinderGeometry(1.05, 1.05, 0.4, 6), ICON_MAT.purple);
    plate.rotation.x = Math.PI / 2;
    g.add(plate);
    const rim = part(new THREE.CylinderGeometry(1.16, 1.16, 0.26, 6), ICON_MAT.gold, 0, 0, -0.06);
    rim.rotation.x = Math.PI / 2;
    g.add(rim);
    const face = part(new THREE.CylinderGeometry(0.86, 0.86, 0.42, 6), ICON_MAT.cream, 0, 0, 0.04);
    face.rotation.x = Math.PI / 2;
    g.add(face);
    const t1 = part(new THREE.BoxGeometry(0.2, 0.44, 0.22), ICON_MAT.purple, -0.22, -0.12, 0.3);
    t1.rotation.z = 0.72; g.add(t1);
    const t2 = part(new THREE.BoxGeometry(0.2, 0.86, 0.22), ICON_MAT.purple, 0.14, 0.04, 0.3);
    t2.rotation.z = -0.6; g.add(t2);
  },
  // Cup with handles, a star on the bowl, a crown on the rim, fluted base.
  trophy(g) {
    g.add(part(new THREE.CylinderGeometry(0.5, 0.34, 0.72, 20), ICON_MAT.gold, 0, 0.4, 0));
    g.add(part(new THREE.SphereGeometry(0.5, 20, 14, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2),
      ICON_MAT.gold, 0, 0.04, 0));
    g.add(part(new THREE.TorusGeometry(0.5, 0.07, 10, 24), ICON_MAT.gold, 0, 0.75, 0)).rotation.x = Math.PI / 2;
    for (const sx of [-1, 1]) {
      const h = part(new THREE.TorusGeometry(0.25, 0.07, 8, 18, Math.PI), ICON_MAT.gold, sx * 0.58, 0.4, 0);
      h.rotation.z = sx > 0 ? -Math.PI / 2 : Math.PI / 2;
      g.add(h);
    }
    const star = part(extrude(starShape(5, 0.24, 0.11), 0.08), ICON_MAT.cream, 0, 0.34, 0.42);
    g.add(star);
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      g.add(part(new THREE.ConeGeometry(0.08, 0.2, 8), ICON_MAT.gold,
        Math.cos(a) * 0.44, 0.88, Math.sin(a) * 0.44));
    }
    g.add(part(new THREE.CylinderGeometry(0.12, 0.12, 0.36, 12), ICON_MAT.gold, 0, -0.34, 0));
    g.add(part(new THREE.CylinderGeometry(0.5, 0.58, 0.16, 20), ICON_MAT.slate, 0, -0.58, 0));
    g.add(part(new THREE.CylinderGeometry(0.6, 0.66, 0.16, 20), ICON_MAT.slate, 0, -0.74, 0));
  },
  // Market stall rather than a trolley: counter, striped awning, a post.
  cart(g) {
    g.add(part(new THREE.BoxGeometry(1.5, 0.66, 0.72), ICON_MAT.cream, 0, -0.5, 0));
    g.add(part(new THREE.BoxGeometry(1.56, 0.14, 0.8), ICON_MAT.amber, 0, -0.12, 0));
    for (const sx of [-1, 1])
      g.add(part(new THREE.CylinderGeometry(0.07, 0.07, 0.9, 10), ICON_MAT.amber, sx * 0.66, 0.34, -0.1));
    for (let i = 0; i < 5; i++) {
      const w = 0.3;
      const strip = part(new THREE.BoxGeometry(w, 0.1, 0.66),
        i % 2 ? ICON_MAT.red : ICON_MAT.white, -0.6 + i * w, 0.78, 0.06);

      g.add(strip);
    }
    g.add(part(new THREE.SphereGeometry(0.16, 12, 10), ICON_MAT.red, -0.32, 0.02, 0.28));
    g.add(part(new THREE.SphereGeometry(0.16, 12, 10), ICON_MAT.green, 0.06, 0.02, 0.3));
    g.add(part(new THREE.SphereGeometry(0.16, 12, 10), ICON_MAT.gold, 0.4, 0.02, 0.26));
  },
  // horseshoe magnet
  magnet(g) {
    const arc = part(new THREE.TorusGeometry(0.6, 0.26, 12, 24, Math.PI), ICON_MAT.red, 0, -0.1, 0);
    g.add(arc);
    for (const sx of [-1, 1]) {
      g.add(part(new THREE.CylinderGeometry(0.26, 0.26, 0.42, 16), ICON_MAT.cream, sx * 0.6, -0.31, 0));
    }
  },
  // open ring, for starting size
  ring(g) {
    const r = part(new THREE.TorusGeometry(0.72, 0.22, 14, 28), ICON_MAT.gold);
    r.rotation.x = 0.5;
    g.add(r);
  },
  // three speed streaks
  dash(g) {
    for (let i = 0; i < 3; i++) {
      const bar = part(new THREE.CapsuleGeometry(0.13, 0.9 - i * 0.22, 6, 12),
        ICON_MAT.blue, 0.1 * i, 0.5 - i * 0.5, 0);
      bar.rotation.z = Math.PI / 2;
      g.add(bar);
    }
  },
  // chequered flag, for level goals
  flag(g) {
    g.add(part(new THREE.CylinderGeometry(0.09, 0.11, 2.0, 12), ICON_MAT.cream, -0.72, 0, 0));
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
      const sq = part(new THREE.BoxGeometry(0.34, 0.34, 0.1),
        (r + c) % 2 ? ICON_MAT.dark : ICON_MAT.white,
        -0.5 + c * 0.35, 0.72 - r * 0.35, 0);
      g.add(sq);
    }
  },
  // bunch of fruit, for eating goals
  grapes(g) {
    const rows = [3, 2, 1];
    rows.forEach((n, r) => {
      for (let i = 0; i < n; i++) {
        g.add(part(new THREE.SphereGeometry(0.3, 14, 12), ICON_MAT.purple,
          -(n - 1) * 0.27 + i * 0.54, 0.5 - r * 0.5, r * 0.1));
      }
    });
    g.add(part(new THREE.CylinderGeometry(0.07, 0.07, 0.4, 8), ICON_MAT.amber, 0, 1.0, 0));
    const leaf = part(new THREE.SphereGeometry(0.22, 12, 10), ICON_MAT.green, 0.28, 1.12, 0);
    leaf.scale.set(1.3, 0.4, 0.9);
    g.add(leaf);
  },
  clock(g) {
    for (const sx of [-1, 1])
      g.add(part(new THREE.SphereGeometry(0.26, 14, 12), ICON_MAT.red, sx * 0.6, 0.62, -0.05));
    const body = part(new THREE.CylinderGeometry(0.88, 0.88, 0.34, 26), ICON_MAT.red);
    body.rotation.x = Math.PI / 2;
    g.add(body);
    const bezel = part(new THREE.TorusGeometry(0.78, 0.09, 10, 28), ICON_MAT.cream, 0, 0, 0.14);
    g.add(bezel);
    const face = part(new THREE.CylinderGeometry(0.7, 0.7, 0.12, 26), ICON_MAT.cream, 0, 0, 0.16);
    face.rotation.x = Math.PI / 2;
    g.add(face);
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      g.add(part(new THREE.BoxGeometry(0.06, 0.13, 0.05), ICON_MAT.dark,
        Math.cos(a) * 0.52, Math.sin(a) * 0.52, 0.23));
    }
    g.add(part(new THREE.BoxGeometry(0.09, 0.44, 0.07), ICON_MAT.dark, 0, 0.17, 0.26));
    const min = part(new THREE.BoxGeometry(0.08, 0.32, 0.07), ICON_MAT.dark, 0.11, -0.02, 0.26);
    min.rotation.z = -1.15; g.add(min);
    for (const sx of [-1, 1]) {
      const foot = part(new THREE.CylinderGeometry(0.08, 0.11, 0.24, 10), ICON_MAT.dark, sx * 0.45, -0.85, 0);
      foot.rotation.z = sx * 0.4; g.add(foot);
    }
  },
  burst(g) {
    g.add(part(extrude(starShape(8, 1.0, 0.42), 0.3), ICON_MAT.amber));
    g.add(part(extrude(starShape(8, 0.6, 0.24), 0.34), ICON_MAT.gold, 0, 0, 0.12));
    g.add(part(new THREE.SphereGeometry(0.2, 14, 12), ICON_MAT.cream, 0, 0, 0.3));
  },
  star(g) {
    g.add(part(extrude(starShape(5, 1.0, 0.45), 0.3), ICON_MAT.gold));
    g.add(part(extrude(starShape(5, 0.5, 0.22), 0.34), ICON_MAT.cream, 0, 0, 0.1));
  },
  lock(g) {
    g.add(part(new THREE.BoxGeometry(1.2, 0.98, 0.62), ICON_MAT.gold, 0, -0.3, 0));
    g.add(part(new THREE.TorusGeometry(0.42, 0.13, 10, 20, Math.PI), ICON_MAT.cream, 0, 0.32, 0));
    g.add(part(new THREE.CylinderGeometry(0.11, 0.11, 0.24, 12), ICON_MAT.dark, 0, -0.24, 0.3)).rotation.x = Math.PI / 2;
    g.add(part(new THREE.BoxGeometry(0.09, 0.2, 0.2), ICON_MAT.dark, 0, -0.44, 0.28));
  },
  speaker(g) {
    g.add(part(new THREE.BoxGeometry(0.55, 0.62, 0.55), ICON_MAT.cream, -0.5, 0, 0));
    const horn = part(new THREE.ConeGeometry(0.72, 1.0, 20), ICON_MAT.cream, -0.02, 0, 0);
    horn.rotation.z = -Math.PI / 2;
    g.add(horn);
    for (let i = 0; i < 3; i++) {
      const w = part(new THREE.TorusGeometry(0.34 + i * 0.26, 0.075, 8, 20, 1.5), ICON_MAT.gold, 0.5, 0, 0);
      w.rotation.z = -0.75;
      g.add(w);
    }
  },
};

// `plinth` puts the icon on a stand and lets it drop a shadow onto it, so
// the pedestals on the menu are modelled rather than drawn in CSS behind a
// picture — the shadow is the part that cannot be faked convincingly.
// `palette` recolours the shared materials for one pass. The bars in these
// games hold five icons in three colours — purple, gold, white — which is
// what makes a row of unrelated objects look like a set; ours were a green
// arrow beside a red house beside a grey map, and read as clip art.
const NAV_PALETTE = {
  gold: '#ffc84a', amber: '#ffb02e', cream: '#ffffff', white: '#ffffff',
  red: '#7a68d8', green: '#ffc84a', blue: '#6a58c9', purple: '#9585ea',
  slate: '#4a3a99', dark: '#332766',
};

function renderIcons(names, size = 192, plinth = false, palette = null) {
  const out = {};
  let r;
  try {
    r = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch (e) {
    return out;                       // no second context: emoji stay
  }
  r.setSize(size, plinth ? Math.round(size * 1.18) : size);
  r.setPixelRatio(1);
  r.shadowMap.enabled = true;
  r.shadowMap.type = THREE.PCFSoftShadowMap;

  // Perspective, not orthographic: the near face reads larger than the far
  // one, which is most of what makes these objects look solid.
  const cam = new THREE.PerspectiveCamera(26, size / (plinth ? size * 1.18 : size), 0.1, 60);
  cam.position.set(2.6, 3.4, 8.4);
  cam.lookAt(0, plinth ? -0.35 : 0, 0);

  const saved = {};
  if (palette) {
    for (const [k, col] of Object.entries(palette)) {
      saved[k] = ICON_MAT[k];
      ICON_MAT[k] = iconMat(col, k === 'gold' ? { metal: 0.5, rough: 0.22 } : {});
    }
  }

  for (const name of names) {
    const build = ICON_BUILDERS[name];
    if (!build) continue;
    const sc = new THREE.Scene();
    // One hard key for the hotspot and the shadow, a cool rim behind to peel
    // the silhouette off the background, and only a little ambient — soft
    // even light is what made the old icons look printed.
    sc.add(new THREE.HemisphereLight('#ffffff', '#6a5ab8', 0.75));
    const key = new THREE.DirectionalLight('#fffdf2', 2.6);
    key.position.set(3.2, 5.5, 4.5);
    key.castShadow = true;
    key.shadow.mapSize.set(512, 512);
    key.shadow.camera.left = -3; key.shadow.camera.right = 3;
    key.shadow.camera.top = 3; key.shadow.camera.bottom = -3;
    sc.add(key);
    const rim = new THREE.DirectionalLight('#8fd8ff', 1.5);
    rim.position.set(-4.5, 1.5, -3);
    sc.add(rim);
    const spark = new THREE.PointLight('#ffffff', 12, 14);
    spark.position.set(-1.6, 2.4, 3.2);
    sc.add(spark);
    const g = new THREE.Group();
    build(g);
    g.rotation.y = -0.30;
    g.rotation.x = 0.14;
    // Fit each icon to the same frame: modelled from different primitives,
    // they otherwise come out at wildly different sizes next to each other.
    const box = new THREE.Box3().setFromObject(g);
    const span = Math.max(box.max.x - box.min.x, box.max.y - box.min.y) || 1;
    const holder = new THREE.Group();
    holder.add(g);
    holder.scale.setScalar(3.55 / span);
    const mid = box.getCenter(new THREE.Vector3());
    g.position.sub(mid);
    // A dark shell one step larger, drawn back-face only, gives a genuine
    // outline that follows the silhouette — a CSS shadow only outlines the box.
    const shell = g.clone(true);
    shell.traverse(o => { if (o.isMesh) { o.material = OUTLINE_MAT; o.castShadow = false; } });
    shell.scale.multiplyScalar(1.055);
    holder.add(shell);
    if (plinth) {
      holder.scale.setScalar(2.75 / span);
      holder.position.y = 0.42;
      const top = new THREE.Mesh(
        new THREE.CylinderGeometry(1.15, 1.15, 0.3, 28),
        new THREE.MeshStandardMaterial({ color: '#7a68d8', roughness: 0.45 }));
      top.position.y = -0.95;
      top.receiveShadow = true;
      sc.add(top);
      const base = new THREE.Mesh(
        new THREE.CylinderGeometry(1.24, 1.32, 0.26, 28),
        new THREE.MeshStandardMaterial({ color: '#43349c', roughness: 0.55 }));
      base.position.y = -1.22;
      sc.add(base);
    }
    sc.add(holder);
    r.render(sc, cam);
    try { out[name] = r.domElement.toDataURL('image/png'); } catch (e) { /* tainted: skip */ }
  }
  for (const [k, m] of Object.entries(saved)) ICON_MAT[k] = m;
  r.dispose();
  return out;
}

// Swap the emoji in the markup for the rendered images.
function applyIcons() {
  // Nav icons share the bar's palette; the boosters keep their own colours
  // because they sit on pedestals over the scene, not in the bar.
  Object.assign(ICONS, renderIcons(Object.values(ICON_FOR), 192, false, NAV_PALETTE));
  for (const [k, v] of Object.entries(ICONS)) ICONS['nav_' + k] = v;
  Object.assign(ICONS, renderIcons([...new Set([
    ...Object.values(BOOSTER_ICON), ...Object.values(UPGRADE_ICON),
    ...Object.values(GOAL_ICON),
    'lock', 'speaker', 'trophy', 'clipboard', 'map', 'cart', 'house',
  ])]));
  for (const [k, v] of Object.entries(renderIcons(Object.values(BOOSTER_ICON), 192, true))) {
    ICONS['plinth_' + k] = v;
  }
  if (!Object.keys(ICONS).length) return;

  const dress = (el, name) => {
    const url = ICONS[name];
    if (!el || !url) return;
    el.textContent = '';
    el.classList.add('icon3d');
    el.style.backgroundImage = `url(${url})`;
  };
  for (const [id, name] of Object.entries(ICON_FOR)) {
    const b = document.getElementById(id);
    if (b) dress(b.querySelector('.ic'), 'nav_' + name);
  }
  // headings and section labels
  document.querySelectorAll('.hIco, .sIco, .bIco').forEach(el => {
    const url = ICONS[el.dataset.icon];
    if (url) el.style.backgroundImage = `url(${url})`;
  });

  const sound = document.getElementById('menuSound');
  if (sound && ICONS.speaker) {
    sound.textContent = '';
    sound.classList.add('icon3d');
    sound.style.backgroundImage = `url(${ICONS.speaker})`;
  }
}

// Markup for one interface icon: the rendered image when it is available,
// the emoji it replaces when it is not.
function iconHTML(name, emoji, cls) {
  const url = ICONS[name];
  return url
    ? `<span class="${cls} icon3d" style="background-image:url(${url})"></span>`
    : `<span class="${cls}">${emoji}</span>`;
}

// Same thing for containers that already carry their own background — the
// image goes inside them instead of replacing it.
function iconInner(name, emoji) {
  const url = ICONS[name];
  return url ? `<i class="icoImg" style="background-image:url(${url})"></i>` : emoji;
}

// Read-only window onto the numbers the HUD does not show, so level balance
// can be measured instead of guessed at. Builds a level's field without
// starting a run, and reports what the clock is up against.
// Sum of how far every uneaten piece has drifted from the cell it was
// placed in — zero unless something is pulling them.
window.fruitHoleDrift = () => fruits.reduce((a, f) =>
  a + (f.eaten ? 0 : Math.hypot(f.x - f.mesh.userData.ox, f.z - f.mesh.userData.oz)), 0);

// Frames a whole level from straight above and draws one frame — used to
// check that a pattern still reads as its shape.
window.fruitHoleFieldRot = () => fieldGroup.rotation.y;
window.fruitHoleFlecks = () => flecks.length;

// "Are the stacks leaning?" — projects the tallest tower's foot and crown
// into screen space. Under the orthographic camera a plumb tower must come
// out perfectly vertical, so any sideways drift here is a real lean.
window.fruitHoleLean = () => {
  let best = null;
  for (const f of fruits) {
    if (f.eaten) continue;
    if (!best || f.mesh.position.y > best.mesh.position.y) best = f;
  }
  if (!best) return null;
  const v = new THREE.Vector3();
  const toScreen = (y) => {
    v.set(best.mesh.position.x, y, best.mesh.position.z).project(camera);
    return { x: (v.x + 1) * 0.5 * innerWidth, y: (1 - v.y) * 0.5 * innerHeight };
  };
  const foot = toScreen(0), crown = toScreen(best.mesh.position.y);
  const at = (r, c) => {
    const g = gridToWorld(r, c);
    v.set(g.x, 0, g.z).project(camera);
    return { x: (v.x + 1) * 0.5 * innerWidth, y: (1 - v.y) * 0.5 * innerHeight };
  };
  const deg = (a, b) => +(Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI).toFixed(2);
  const o = at(10, 0), alongRow = at(10, 12), alongCol = at(20, 0);
  return {
    fieldRotY: fieldGroup.rotation.y,
    towerHeight: +best.mesh.position.y.toFixed(3),
    screenDx: +(crown.x - foot.x).toFixed(2),
    screenDy: +(crown.y - foot.y).toFixed(2),
    rowAngleDeg: deg(o, alongRow),   // a grid row across the screen: want 0
    colAngleDeg: deg(o, alongCol),   // a grid column down the screen: want 90
    sun: [sun.position.x, sun.position.y, sun.position.z],
  };
};

window.fruitHoleTopDown = (n, aspect, tilt = 0) => {
  window.fruitHoleProbe(n);
  const h = Math.max(fieldHalfX, fieldHalfZ) * 1.12;
  camera.left = -h; camera.right = h;
  camera.top = h * aspect; camera.bottom = -h * aspect;
  camera.updateProjectionMatrix();
  camera.position.set(0, 40, tilt);
  camera.lookAt(0, 0, 0);
  camera.updateMatrixWorld();
  renderer.render(scene, camera);
  return currentPattern.name;
};

window.fruitHoleProbe = (n) => {
  level = n; sizeStage = n;
  rows = Math.min(22 + Math.floor((n - 1) / 2) * 2, 34);
  buildField();
  resetHole();
  return {
    fruit: fruits.length, seconds: levelTime(),
    pattern: currentPattern.name,
    holeR: holeRadius, holeMax: HOLE_MAX, speed: BASE_MOVE_SPEED,
    fieldW: fieldHalfX * 2, fieldH: fieldHalfZ * 2,
  };
};

// ---------------------------------------------------------------------
// Boot + main loop
// ---------------------------------------------------------------------
buildField();
resetHole();
camX = holeX; camZ = holeZ;
resize();
document.getElementById('loading').style.display = 'none';
refreshGoalsBadge();
maybeShowDaily();

const BASE_MOVE_SPEED = 3.4;
let lastT = performance.now();

function tick(now) {
  const elapsed = (now - lastT) / 1000;
  const dt = Math.min(0.05, elapsed);   // movement stays stable on frame spikes
  lastT = now;

  if (state === 'playing') {
    // countdown follows wall-clock so it is not slowed by a low frame rate,
    // but a backgrounded tab must not drain the whole clock at once
    timeLeft -= Math.min(0.25, elapsed);
    if (timeLeft <= 0) { timeLeft = 0; updateTimeUI(); onTimeUp(); }
    else updateTimeUI();

    if (joyX || joyY) {
      const speed = BASE_MOVE_SPEED * (1 + upg('speed') * 0.08);
      holeX += joyX * speed * dt;
      holeZ += joyY * speed * dt;
      const mX = fieldHalfX - holeRadius * 0.5;
      const mZ = fieldHalfZ - holeRadius * 0.5;
      holeX = Math.max(-mX, Math.min(mX, holeX));
      holeZ = Math.max(-mZ, Math.min(mZ, holeZ));
    }

    // magnet upgrade: fruit the hole could swallow drifts toward it, so a
    // near miss still counts. Oversized fruit is not pulled -- it has to
    // stay where it is until the hole has grown enough to take it.
    //
    // No pull at all until the upgrade is bought. There used to be a free
    // 0.6 of it, which contradicted the upgrade being sold as the thing
    // that grants the pull, and once fruit came in towers it was plainly
    // wrong: a whole column would slide into the hole on its own.
    const mag = upg('magnet') * 0.28 + (now < magnetBoostUntil ? 1.6 : 0);
    if (mag > 0) {
      for (const f of fruits) {
        if (f.eaten || f.r > holeRadius * 0.92) continue;
        const dx = holeX - f.x, dz = holeZ - f.z;
        const d = Math.hypot(dx, dz);
        const reach = holeRadius + mag;
        if (d > 0.001 && d < reach) {
          const pull = ((reach - d) / reach) * 3.4 * dt;
          f.x += (dx / d) * pull;
          f.z += (dz / d) * pull;
          f.mesh.position.x = f.x;
          f.mesh.position.z = f.z;
        }
      }
    }

    checkEat(now);
    updateProgressUI();
  }

  // uneatable fruits jiggle when bumped
  for (const f of fruits) {
    if (f.eaten || f.nudge <= 0) continue;
    f.nudge = Math.max(0, f.nudge - dt);
    f.mesh.position.y = f.baseY + Math.sin(f.nudge * 60) * 0.09 * (f.nudge / 0.28);
  }

  stepFlecks(dt);

  // The collar swells a little on a swallow and settles back.
  rimPulse = Math.max(0, rimPulse - dt * 5.5);
  const pulse = 1 + rimPulse * 0.11;

  holeGroup.position.set(holeX, 0, holeZ);
  const s = holeRadius / BASE_HOLE_R;
  holeGroup.scale.set(s * pulse, 1 + rimPulse * 0.5, s * pulse);

  if (state === 'menu') {
    // The menu looks at a real diorama rather than a painted picture: same
    // island, same hole, same fruit, lit and shadowed by the engine. It sits
    // still and turns slowly, and the camera leans further back than in play
    // so the fruit are seen from the side and read as solid.
    fieldGroup.rotation.y += dt * 0.12;
    camera.position.set(0, 11, 8.5);
    camera.lookAt(0, 0, -0.4);
  } else {
    camX += (holeX - camX) * 0.09;
    camZ += (holeZ - camZ) * 0.09;
    clampCamera();
    // A chain of eats kicks the camera; it decays on its own so a long
    // sweep does not leave the view permanently unsettled.
    shake = Math.max(0, shake - dt * 1.9);
    const kx = shake ? (Math.random() - 0.5) * shake * 0.5 : 0;
    const kz = shake ? (Math.random() - 0.5) * shake * 0.5 : 0;
    // Tilted well off vertical: at the old 8 degrees anything standing was
    // foreshortened into a disc, so a board of round fruit had no skyline
    // and a post looked like a coin. This is enough to see the sides of
    // things without losing the plan view the steering depends on.
    camera.position.set(camX + kx, 13, camZ + 6.2 + kz);
    camera.lookAt(camX + kx, 0, camZ - 0.4 + kz);
  }
  camera.updateMatrixWorld();
  // Carry the shadow box along with the view so the whole field is shadowed
  // the same way, not just the patch around the origin.
  sun.target.position.set(camera.position.x, 0, camera.position.z - 3);
  sun.position.copy(sun.target.position).add(SUN_OFFSET);
  if (state === 'playing') updateSizeTag();

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
applyIcons();
requestAnimationFrame(tick);
</script>
</body>
</html>
