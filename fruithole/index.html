<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Fruit Hole</title>
<meta name="theme-color" content="#e8c07d" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fruit Hole" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #e8c07d; }
  #app { position: fixed; inset: 0; touch-action: none; }
  canvas { display: block; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #7a5a2a; font-size: 16px; z-index: 30; background: #e8c07d; }

  /* ---- top bar ---- */
  #topbar { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 12px; pointer-events: none; z-index: 5; opacity: 0; transition: opacity .25s ease; }
  #topbar.show { opacity: 1; }

  #topRow { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
  #timeTag { background: rgba(30,120,220,.92); color: #fff; font-weight: 800; font-size: 19px;
    border-radius: 999px; padding: 6px 20px; box-shadow: 0 3px 0 rgba(0,0,0,.2);
    font-variant-numeric: tabular-nums; }
  #timeTag.low { background: rgba(220,50,50,.94); animation: pulse .6s ease infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  #muteBtn { pointer-events: auto; cursor: pointer; position: absolute; right: 0;
    border: none; background: rgba(90,50,140,.88); color: #fff; font-size: 16px;
    width: 38px; height: 38px; border-radius: 50%; box-shadow: 0 3px 0 rgba(0,0,0,.18); }

  #counters { display: flex; gap: 6px; justify-content: center; }
  .counter { display: flex; align-items: center; gap: 5px; background: rgba(90,50,140,.88);
    border: 2px solid rgba(255,255,255,.32); border-radius: 999px; padding: 4px 10px 4px 4px;
    box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .counter .dot { width: 18px; height: 18px; border-radius: 50%;
    box-shadow: inset 0 -3px 4px rgba(0,0,0,.35), inset 0 2px 3px rgba(255,255,255,.5); }
  .counter .n { color: #fff; font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 12px; }
  .counter .n.bump { animation: bump .2s ease; }
  @keyframes bump { 0%{transform:scale(1)} 45%{transform:scale(1.35)} 100%{transform:scale(1)} }

  #levelTag { color: #7a5a2a; font-weight: 700; font-size: 12px; opacity: .85;
    text-shadow: 0 1px 0 rgba(255,255,255,.4); }

  /* level progress + the stars this run is currently on track for */
  #progWrap { display: flex; flex-direction: column; align-items: center; gap: 3px; width: min(62vw, 250px); }
  #progBar { width: 100%; height: 9px; border-radius: 999px; background: rgba(90,50,140,.35);
    border: 2px solid rgba(255,255,255,.35); overflow: hidden; box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  #progFill { height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg,#7ee787,#39c760); transition: width .18s ease; }
  #starRow { display: flex; gap: 14px; font-size: 17px; line-height: 1; }
  #starRow span { color: rgba(255,255,255,.32); text-shadow: 0 2px 3px rgba(0,0,0,.3); transition: color .2s ease, transform .2s ease; }
  #starRow span.on { color: #ffd23f; transform: scale(1.12); }

  #combo { position: fixed; top: 27%; left: 0; right: 0; text-align: center; pointer-events: none;
    font-weight: 800; font-size: clamp(24px, 8vw, 52px); color: #ffd23f; z-index: 6;
    text-shadow: 0 3px 12px rgba(0,0,0,.45); opacity: 0; }
  #combo.show { animation: comboPop .7s ease; }
  @keyframes comboPop {
    0%{opacity:0;transform:scale(.6)} 22%{opacity:1;transform:scale(1.18)}
    70%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(1)}
  }

  /* upgrades */
  #upgrades { background: rgba(60,35,10,.72); backdrop-filter: blur(3px); justify-content: flex-start;
    padding-top: calc(env(safe-area-inset-top,0px) + 26px); overflow-y: auto; }
  #upgWallet { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #upgList { display: flex; flex-direction: column; gap: 9px; width: min(94vw, 420px); margin: 4px 0 8px; }
  .upg { display: flex; align-items: center; gap: 10px; text-align: left;
    background: rgba(255,255,255,.13); border: 2px solid rgba(255,255,255,.18);
    border-radius: 16px; padding: 9px 11px; }
  .upg .ico { font-size: 24px; width: 30px; text-align: center; }
  .upg .mid { flex: 1; min-width: 0; }
  .upg .nm { color: #fff; font-weight: 800; font-size: 15px; }
  .upg .ds { color: rgba(255,255,255,.75); font-weight: 600; font-size: 12px; }
  .upg .pips { display: flex; gap: 3px; margin-top: 4px; }
  .upg .pip { width: 16px; height: 5px; border-radius: 999px; background: rgba(255,255,255,.22); }
  .upg .pip.on { background: linear-gradient(90deg,#ffd97a,#ffb23f); }
  .upg .buy { pointer-events: auto; cursor: pointer; border: none; border-radius: 999px;
    padding: 9px 13px; font-weight: 800; font-size: 13px; color: #5a3200; white-space: nowrap;
    background: linear-gradient(180deg,#ffd97a,#ffb23f); box-shadow: 0 3px 0 #c67e12; }
  .upg .buy:disabled { background: rgba(255,255,255,.16); color: rgba(255,255,255,.5); box-shadow: none; }
  .upg .buy .cost { display: block; font-size: 11px; font-weight: 700; opacity: .85; }
  #upgrades .sect, #goals .sect { font-size: 15px; font-weight: 800; opacity: .9; margin-top: 2px; }
  .menuRow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .menuRow .btn { margin-top: 0; }

  #goals { background: rgba(60,35,10,.72); backdrop-filter: blur(3px); justify-content: flex-start;
    padding-top: calc(env(safe-area-inset-top,0px) + 26px); overflow-y: auto; }
  #missionList, #achList { display: flex; flex-direction: column; gap: 9px;
    width: min(94vw, 420px); margin-bottom: 4px; }
  .upg.done { border-color: rgba(126,231,135,.6); background: rgba(126,231,135,.14); }
  .mbar { height: 6px; border-radius: 999px; background: rgba(255,255,255,.2);
    margin-top: 5px; overflow: hidden; }
  .mfill { height: 100%; border-radius: 999px; background: linear-gradient(90deg,#7ee787,#39c760); }

  #daily { background: rgba(60,35,10,.8); backdrop-filter: blur(4px); }
  #dailyLoot .pill { font-size: 16px; }
  #boostShop { display: flex; flex-direction: column; gap: 9px; width: min(94vw, 420px); margin-bottom: 6px; }
  .upg .own { color: #ffd23f; font-weight: 800; font-size: 12px; margin-top: 3px; }

  /* boosters */
  #boosterBar { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom,0px) + 52px);
    display: none; gap: 12px; justify-content: center; z-index: 7; }
  #boosterBar.show { display: flex; }
  .slot { position: relative; pointer-events: auto; cursor: pointer; border: none;
    width: 60px; height: 60px; border-radius: 17px; font-size: 25px;
    background: linear-gradient(180deg,#8a6fd8,#6b4fc0); box-shadow: 0 4px 0 #4a349a;
    display: flex; align-items: center; justify-content: center; }
  .slot:active { transform: translateY(2px); box-shadow: 0 2px 0 #4a349a; }
  .slot.locked { background: linear-gradient(180deg,#7a6ca0,#5b5080); box-shadow: 0 4px 0 #3e3660;
    font-size: 12px; font-weight: 800; color: #fff; cursor: default; opacity: .75; }
  .slot.empty { opacity: .5; }
  .slot .badge { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px;
    border-radius: 999px; background: #e2373d; color: #fff; font-size: 12px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; padding: 0 5px;
    box-shadow: 0 2px 0 rgba(0,0,0,.25); }

  #hint { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom,0px) + 18px);
    text-align: center; pointer-events: none; color: #7a5a2a; font-size: 14px; font-weight: 600;
    opacity: 0; transition: opacity .5s ease; z-index: 5; text-shadow: 0 1px 0 rgba(255,255,255,.4); }

  /* ---- joystick ---- */
  #joyBase { position: fixed; width: 110px; height: 110px; margin: -55px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.5); background: rgba(255,255,255,.12);
    opacity: 0; pointer-events: none; z-index: 8; transition: opacity .15s ease; }
  #joyKnob { position: fixed; width: 46px; height: 46px; margin: -23px; border-radius: 50%;
    background: rgba(255,255,255,.55); pointer-events: none; z-index: 9; opacity: 0; transition: opacity .15s ease; }
  #joyBase.show, #joyKnob.show { opacity: 1; }

  /* ---- screens ---- */
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; z-index: 20; text-align: center; padding: 26px; }
  .screen.show { display: flex; }
  .screen h1 { color: #fff; font-size: clamp(30px,10vw,52px); font-weight: 800;
    text-shadow: 0 3px 12px rgba(0,0,0,.45); letter-spacing: -.5px; }
  .screen p { color: #fff; font-size: clamp(14px,4.2vw,18px); font-weight: 600; opacity: .92;
    text-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .screen .btn { pointer-events: auto; cursor: pointer; border: none; border-radius: 999px;
    padding: 15px 46px; font-size: 19px; font-weight: 800; color: #5a3200;
    background: linear-gradient(180deg,#ffd97a,#ffb23f); box-shadow: 0 5px 0 #c67e12; margin-top: 6px; }
  .screen .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c67e12; }
  .screen .btn.ghost { background: rgba(255,255,255,.18); color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.22);
    padding: 12px 34px; font-size: 16px; }
  .screen .btn.ghost:active { box-shadow: 0 2px 0 rgba(0,0,0,.22); }
  .screen .btn[hidden] { display: none; }

  #menu { background: linear-gradient(180deg, rgba(60,35,10,.35), rgba(60,35,10,.7)); }
  #menu .logo { font-size: clamp(44px,15vw,84px); }
  #overlay { background: rgba(60,35,10,.62); backdrop-filter: blur(3px); }
  #overlay .stats { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
  #overlay .pill { background: rgba(255,255,255,.16); border-radius: 999px; padding: 6px 14px;
    color: #fff; font-weight: 700; font-size: 14px; }
</style>
</head>
<body>
<div id="loading">Yükleniyor…</div>
<div id="app">
  <div id="topbar">
    <div id="topRow">
      <div id="timeTag">⏱ <span id="timeN">0</span></div>
      <button id="muteBtn">🔊</button>
    </div>
    <div id="progWrap">
      <div id="progBar"><div id="progFill"></div></div>
      <div id="starRow"><span>★</span><span>★</span><span>★</span></div>
    </div>
    <div id="counters"></div>
    <div id="levelTag">Bölüm 1 · Size 1</div>
  </div>

  <div id="combo"></div>

  <div id="boosterBar"></div>
  <div id="hint">Parmağını sürükle, deliği gezdir, meyveleri ye</div>
  <div id="joyBase"></div>
  <div id="joyKnob"></div>

  <div id="menu" class="screen show">
    <div class="logo">🕳️</div>
    <h1>Fruit Hole</h1>
    <p id="menuSub">Bölüm 1</p>
    <button class="btn" id="playBtn">Başla</button>
    <div class="menuRow">
      <button class="btn ghost" id="upgBtn">⬆️ Yükseltmeler</button>
      <button class="btn ghost" id="goalsBtn">📋 Görevler</button>
    </div>
  </div>

  <div id="goals" class="screen">
    <h1>📋 Görevler</h1>
    <p class="sect">Günlük görevler</p>
    <div id="missionList"></div>
    <p class="sect">🏆 Başarımlar</p>
    <div id="achList"></div>
    <button class="btn ghost" id="goalsClose">Kapat</button>
  </div>

  <div id="daily" class="screen">
    <h1>🎁 Günlük Ödül</h1>
    <p id="dailySub"></p>
    <div class="stats" id="dailyLoot"></div>
    <button class="btn" id="dailyBtn">Al</button>
  </div>

  <div id="upgrades" class="screen">
    <h1>⬆️ Yükseltmeler</h1>
    <div id="upgWallet"></div>
    <div id="upgList"></div>
    <p class="sect">🎁 Boosterlar</p>
    <div id="boostShop"></div>
    <button class="btn ghost" id="upgClose">Kapat</button>
  </div>

  <div id="overlay" class="screen">
    <h1 id="overlayTitle">Bölüm Tamam!</h1>
    <p id="overlaySub"></p>
    <div class="stats" id="overlayStats"></div>
    <button class="btn" id="reviveBtn">📺 +15 saniye</button>
    <div class="menuRow">
      <button class="btn ghost" id="actionBtn">Devam</button>
      <button class="btn ghost" id="toMenuBtn">🏠 Menü</button>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://esm.sh/three@0.161.0" } }
</script>
<script type="module">
import * as THREE from 'three';

const TYPES = [
  { id: 'berry',  label: 'Böğürtlen', base: '#5b2d8e', dark: '#3c1a63', light: '#8a5cc9', speck: '#2a1148' },
  { id: 'lychee', label: 'Liçi',      base: '#f3e6d8', dark: '#d8b9a0', light: '#ffffff', speck: '#e8a898' },
  { id: 'banana', label: 'Muz',       base: '#f6d648', dark: '#e0a92a', light: '#fff2a0', speck: '#c98a1c' },
  { id: 'melon',  label: 'Kavun',     base: '#f0a13c', dark: '#c9711f', light: '#ffc978', speck: '#a85614' },
];
const TYPE_BY_ID = Object.fromEntries(TYPES.map(t => [t.id, t]));

const COLS = 7;
let rows = 9;
let level = parseInt(localStorage.getItem('fruithole_level') || '1', 10);
let sizeStage = level;
let currentPattern = null;   // set by buildField()

const currency = JSON.parse(localStorage.getItem('fruithole_currency') || '{}');
TYPES.forEach(t => { if (!(t.id in currency)) currency[t.id] = 0; });
function saveCurrency() { localStorage.setItem('fruithole_currency', JSON.stringify(currency)); }

// Best star rating per level, so a replay can improve it but never lose it.
const stars = JSON.parse(localStorage.getItem('fruithole_stars') || '{}');
function saveStars() { localStorage.setItem('fruithole_stars', JSON.stringify(stars)); }

// ---------------------------------------------------------------------
// Upgrades
//
// Each track is paid for with a different fruit, so every counter on the
// HUD is worth collecting rather than just the common ones. Costs double
// each step: 25, 50, 100, 200, 400.
// ---------------------------------------------------------------------
const UPGRADES = [
  { id: 'speed',  icon: '💨', name: 'Hız',              pay: 'berry',  base: 25,
    desc: lv => `Delik hızı +${lv * 8}%` },
  { id: 'size',   icon: '⭕', name: 'Başlangıç boyutu', pay: 'banana', base: 20,
    desc: lv => `Delik +${(lv * 0.06).toFixed(2)} büyük başlar` },
  { id: 'time',   icon: '⏱',  name: 'Ek süre',          pay: 'lychee', base: 25,
    desc: lv => `Her bölümde +${lv * 5} saniye` },
  { id: 'magnet', icon: '🧲', name: 'Mıknatıs',         pay: 'melon',  base: 30,
    desc: lv => `Yakındaki meyveleri ${(lv * 0.28).toFixed(2)} birim çeker` },
];
const UPG_MAX = 5;

const upgrades = JSON.parse(localStorage.getItem('fruithole_upgrades') || '{}');
UPGRADES.forEach(u => { if (!(u.id in upgrades)) upgrades[u.id] = 0; });
function saveUpgrades() { localStorage.setItem('fruithole_upgrades', JSON.stringify(upgrades)); }
function upg(id) { return upgrades[id] || 0; }
function upgCost(u) { return u.base * Math.pow(2, upg(u.id)); }

// ---------------------------------------------------------------------
// Boosters
//
// Consumables spent mid-run from the bar at the bottom. Slots unlock as
// levels are cleared, so the bar fills out over time instead of dumping
// three unexplained buttons on a new player. Each starts with a couple
// free so the first use costs nothing to learn.
// ---------------------------------------------------------------------
const BOOSTERS = [
  { id: 'time',   icon: '⏰', name: 'Zaman',    unlock: 4,  pay: 'lychee', cost: 40, free: 2,
    desc: '+15 saniye' },
  { id: 'grow',   icon: '💥', name: 'Büyüt',    unlock: 7,  pay: 'banana', cost: 50, free: 1,
    desc: 'Delik anında büyür' },
  { id: 'magnet', icon: '🌟', name: 'Süper mıknatıs', unlock: 10, pay: 'melon', cost: 45, free: 1,
    desc: '8 saniye güçlü çekim' },
];

const boosterStore = JSON.parse(localStorage.getItem('fruithole_boosters') || 'null');
const boosters = boosterStore || Object.fromEntries(BOOSTERS.map(b => [b.id, b.free]));
BOOSTERS.forEach(b => { if (!(b.id in boosters)) boosters[b.id] = b.free; });
function saveBoosters() { localStorage.setItem('fruithole_boosters', JSON.stringify(boosters)); }
function boosterUnlocked(b) { return level >= b.unlock; }

// ---------------------------------------------------------------------
// Stats, daily missions, achievements, daily reward
//
// Daily work is counted in its own bucket that resets with the date,
// rather than diffing lifetime totals against a snapshot -- that way a
// mission cannot be completed by progress made before it was handed out.
// ---------------------------------------------------------------------
const stats = JSON.parse(localStorage.getItem('fruithole_stats') || '{}');
['fruits', 'levels', 'stars', 'bestCombo'].forEach(k => { if (!(k in stats)) stats[k] = 0; });
function saveStats() { localStorage.setItem('fruithole_stats', JSON.stringify(stats)); }

function dayKey(d) { return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }

const MISSION_POOL = [
  { id: 'eat',   icon: '🍇', track: 'fruits',    text: n => `${n} meyve ye`,     roll: () => 60 + Math.floor(Math.random() * 5) * 20 },
  { id: 'lvl',   icon: '🏁', track: 'levels',    text: n => `${n} bölüm bitir`,  roll: () => 2 + Math.floor(Math.random() * 3) },
  { id: 'star',  icon: '⭐', track: 'stars',     text: n => `${n} yıldız kazan`, roll: () => 4 + Math.floor(Math.random() * 5) },
  { id: 'combo', icon: '🔥', track: 'bestCombo', text: n => `x${n} kombo yap`,   roll: () => 3 + Math.floor(Math.random() * 3) },
];
const MISSION_BY_ID = Object.fromEntries(MISSION_POOL.map(m => [m.id, m]));
const MISSION_REWARD = 45;

const daily = JSON.parse(localStorage.getItem('fruithole_daily') || '{}');
function saveDaily() { localStorage.setItem('fruithole_daily', JSON.stringify(daily)); }

function ensureDaily() {
  const key = dayKey(new Date());
  if (daily.date === key) return;
  const yesterday = dayKey(new Date(Date.now() - 86400000));
  daily.streak = daily.date === yesterday ? (daily.streak || 0) + 1 : 1;
  daily.date = key;
  daily.fruits = 0; daily.levels = 0; daily.stars = 0; daily.bestCombo = 0;
  daily.missions = [...MISSION_POOL]
    .sort(() => Math.random() - 0.5)
    .slice(0, 3)
    .map(m => ({ id: m.id, goal: m.roll(), claimed: false }));
  daily.rewardClaimed = false;
  const t = TYPES[Math.floor(Math.random() * TYPES.length)];
  daily.loot = { type: t.id, amount: 25 + Math.min(daily.streak, 7) * 10 };
  saveDaily();
}
ensureDaily();

const ACHIEVEMENTS = [
  { id: 'eat100',  icon: '🍇',  name: 'Yüz lokma',     desc: 'Toplam 100 meyve ye',  goal: 100,  at: () => stats.fruits,    pay: 'berry',  reward: 60 },
  { id: 'eat1000', icon: '🍽️', name: 'Doymak bilmez', desc: 'Toplam 1000 meyve ye', goal: 1000, at: () => stats.fruits,    pay: 'berry',  reward: 220 },
  { id: 'lvl10',   icon: '🏁',  name: 'Onuncu bölüm',  desc: "Bölüm 10'a ulaş",      goal: 10,   at: () => level,           pay: 'banana', reward: 140 },
  { id: 'star15',  icon: '⭐',  name: 'Yıldız avcısı', desc: '15 yıldız kazan',      goal: 15,   at: () => stats.stars,     pay: 'lychee', reward: 140 },
  { id: 'combo5',  icon: '🔥',  name: 'Zincirleme',    desc: 'x5 kombo yap',         goal: 5,    at: () => stats.bestCombo, pay: 'melon',  reward: 110 },
];
const achClaimed = JSON.parse(localStorage.getItem('fruithole_ach') || '{}');
function saveAch() { localStorage.setItem('fruithole_ach', JSON.stringify(achClaimed)); }

// how far along a daily mission is, capped at its goal
function missionAt(m) { return Math.min(daily[MISSION_BY_ID[m.id].track] || 0, m.goal); }
function missionDone(m) { return missionAt(m) >= m.goal; }

// something claimable anywhere? used to badge the menu button
function anyClaimable() {
  const mission = (daily.missions || []).some(m => missionDone(m) && !m.claimed);
  const ach = ACHIEVEMENTS.some(a => !achClaimed[a.id] && a.at() >= a.goal);
  return mission || ach;
}

const app = document.getElementById('app');
const topbarEl = document.getElementById('topbar');
const countersEl = document.getElementById('counters');
const timeTagEl = document.getElementById('timeTag');
const timeNEl = document.getElementById('timeN');
const levelTagEl = document.getElementById('levelTag');
const hintEl = document.getElementById('hint');
const joyBaseEl = document.getElementById('joyBase');
const joyKnobEl = document.getElementById('joyKnob');
const menuEl = document.getElementById('menu');
const menuSubEl = document.getElementById('menuSub');
const overlayEl = document.getElementById('overlay');
const overlayTitleEl = document.getElementById('overlayTitle');
const overlaySubEl = document.getElementById('overlaySub');
const overlayStatsEl = document.getElementById('overlayStats');
const actionBtnEl = document.getElementById('actionBtn');
const reviveBtnEl = document.getElementById('reviveBtn');
const muteBtnEl = document.getElementById('muteBtn');
const progFillEl = document.getElementById('progFill');
const starRowEl = document.getElementById('starRow');
const comboEl = document.getElementById('combo');
const upgradesEl = document.getElementById('upgrades');

// ---------------------------------------------------------------------
// Ads (AdMob) — only live inside the native Capacitor shell. In a browser
// every call is a no-op and showRewarded() resolves true, so the game
// plays identically without an ad network.
//
// These are Google's public TEST units. Fruit Hole ships as its own app,
// so it needs its own AdMob units — the Hole app's units must not be
// reused here. Replace all three before release.
// ---------------------------------------------------------------------
const _Cap = window.Capacitor;
const _AdMob = _Cap && _Cap.Plugins ? _Cap.Plugins.AdMob : null;
const ADS_ON = !!(_Cap && _Cap.isNativePlatform && _Cap.isNativePlatform() && _AdMob);
const AD_UNITS = {
  rewarded:     'ca-app-pub-3940256099942544/5224354917',
  interstitial: 'ca-app-pub-3940256099942544/1033173712',
  banner:       'ca-app-pub-3940256099942544/6300978111',
};
let _interReady = false;

async function adsInit() {
  if (!ADS_ON) return;
  try { await _AdMob.initialize({ initializeForTesting: true }); prepareInterstitial(); } catch (e) { }
}
async function prepareInterstitial() {
  if (!ADS_ON) return;
  try { await _AdMob.prepareInterstitial({ adId: AD_UNITS.interstitial }); _interReady = true; } catch (e) { _interReady = false; }
}
async function showInterstitial() {
  if (!ADS_ON || !_interReady) return;
  try { await _AdMob.showInterstitial(); } catch (e) { }
  _interReady = false;
  prepareInterstitial();
}
async function showRewarded() {
  if (!ADS_ON) return true;
  return new Promise(async (resolve) => {
    let got = false, subR = null, subD = null;
    const cleanup = () => { if (subR && subR.remove) subR.remove(); if (subD && subD.remove) subD.remove(); };
    try {
      subR = await _AdMob.addListener('onRewardedVideoAdReward', () => { got = true; });
      subD = await _AdMob.addListener('onRewardedVideoAdDismissed', () => { cleanup(); resolve(got); });
      await _AdMob.prepareRewardVideoAd({ adId: AD_UNITS.rewarded });
      await _AdMob.showRewardVideoAd();
    } catch (e) { cleanup(); resolve(false); }
  });
}
let _bannerShown = false;
async function showBanner() {
  if (!ADS_ON || _bannerShown) return;
  try {
    await _AdMob.showBanner({ adId: AD_UNITS.banner, adSize: 'ADAPTIVE_BANNER', position: 'BOTTOM_CENTER', margin: 0 });
    _bannerShown = true;
  } catch (e) { }
}
adsInit();

// ---------------------------------------------------------------------
// Sound (WebAudio synth, no files) + haptics
// ---------------------------------------------------------------------
const _AC = window.AudioContext || window.webkitAudioContext;
let _actx = null;
let muted = localStorage.getItem('fruithole_muted') === '1';

function ensureAudio() {
  try {
    if (!_actx && _AC) _actx = new _AC();
    if (_actx && _actx.state === 'suspended') _actx.resume();
  } catch (e) { }
}
function beep(freq, dur, type, vol, when) {
  if (muted || !_actx) return;
  try {
    const t = _actx.currentTime + (when || 0);
    const o = _actx.createOscillator(), g = _actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(_actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) { }
}
function vibrate(p) { try { if (!muted && navigator.vibrate) navigator.vibrate(p); } catch (e) { } }

const sfx = {
  eat(streak) { ensureAudio(); beep(340 + Math.min(streak, 14) * 24, 0.09, 'triangle', 0.14); vibrate(8); },
  blocked()   { ensureAudio(); beep(150, 0.07, 'sawtooth', 0.10); },
  click()     { ensureAudio(); beep(300, 0.05, 'sine', 0.12); },
  win()       { ensureAudio(); [523, 659, 784, 1046].forEach((f, i) => beep(f, 0.2, 'triangle', 0.18, i * 0.09)); vibrate([20, 40, 25]); },
  lose()      { ensureAudio(); [420, 320, 240].forEach((f, i) => beep(f, 0.22, 'sawtooth', 0.14, i * 0.1)); vibrate(70); },
  tick()      { ensureAudio(); beep(760, 0.05, 'square', 0.08); },
  booster()   { ensureAudio(); [660, 880, 1180].forEach((f, i) => beep(f, 0.13, 'triangle', 0.17, i * 0.06)); vibrate([15, 30]); },
};

function buildCounters() {
  countersEl.innerHTML = '';
  TYPES.forEach(t => {
    const el = document.createElement('div');
    el.className = 'counter';
    el.innerHTML = `<span class="dot" style="background:${t.base}"></span><span class="n" id="cur_${t.id}">${currency[t.id]}</span>`;
    countersEl.appendChild(el);
  });

function bumpCurrency(id, amount) {
  currency[id] += amount;
  saveCurrency();
  const n = document.getElementById('cur_' + id);
  if (n) { n.textContent = currency[id]; n.classList.remove('bump'); void n.offsetWidth; n.classList.add('bump'); }
}
function refreshLevelTag() {
  const p = currentPattern;
  const best = stars[level] ? ' · ' + '★'.repeat(stars[level]) : '';

function renderUpgrades() {
  upgWalletEl.innerHTML = TYPES.map(t =>
    `<div class="counter"><span class="dot" style="background:${t.base}"></span><span class="n">${currency[t.id]}</span></div>`
  ).join('');

  upgListEl.innerHTML = '';
  UPGRADES.forEach(u => {
    const lv = upg(u.id);
    const maxed = lv >= UPG_MAX;
    const cost = upgCost(u);
    const pay = TYPE_BY_ID[u.pay];
    const afford = currency[u.pay] >= cost;

    const row = document.createElement('div');
    row.className = 'upg';
    row.innerHTML =
      `<span class="ico">${u.icon}</span>` +
      `<span class="mid">` +
        `<span class="nm">${u.name}</span>` +
        `<div class="ds">${lv ? u.desc(lv) : 'Henüz yükseltilmedi'}</div>` +
        `<div class="pips">${Array.from({ length: UPG_MAX }, (_, i) =>
          `<span class="pip${i < lv ? ' on' : ''}"></span>`).join('')}</div>` +
      `</span>`;

    const btn = document.createElement('button');
    btn.className = 'buy';
    if (maxed) {
      btn.textContent = 'TAM';
      btn.disabled = true;
    } else {
      btn.innerHTML = `Yükselt<span class="cost">${cost} ${pay.label}</span>`;
      btn.disabled = !afford;
      btn.onclick = () => buyUpgrade(u);
    }
    row.appendChild(btn);
    upgListEl.appendChild(row);
  });

  renderBoostShop();
}

function renderBoostShop() {
  const shop = document.getElementById('boostShop');
  shop.innerHTML = '';
  BOOSTERS.forEach(b => {
    const pay = TYPE_BY_ID[b.pay];
    const locked = !boosterUnlocked(b);
    const afford = currency[b.pay] >= b.cost;

    const row = document.createElement('div');
    row.className = 'upg';
    row.innerHTML =
      `<span class="ico">${b.icon}</span>` +
      `<span class="mid">` +
        `<span class="nm">${b.name}</span>` +
        `<div class="ds">${b.desc}</div>` +
        `<div class="own">${locked ? `Bölüm ${b.unlock}'da açılır` : `Elinde: ${boosters[b.id] || 0}`}</div>` +
      `</span>`;

    const btn = document.createElement('button');
    btn.className = 'buy';
    if (locked) {
      btn.textContent = '🔒';
      btn.disabled = true;
    } else {
      btn.innerHTML = `Satın al<span class="cost">${b.cost} ${pay.label}</span>`;
      btn.disabled = !afford;
      btn.onclick = () => buyBooster(b);
    }
    row.appendChild(btn);
    shop.appendChild(row);
  });
}

function goalRow(icon, name, desc, at, goal, claimed, onClaim) {
  const pct = Math.min(100, Math.round((at / goal) * 100));
  const ready = at >= goal && !claimed;
  const row = document.createElement('div');
  row.className = 'upg' + (claimed ? ' done' : '');
  row.innerHTML =
    `<span class="ico">${icon}</span>` +
    `<span class="mid">` +
      `<span class="nm">${name}</span>` +
      `<div class="ds">${desc}</div>` +
      `<div class="mbar"><div class="mfill" style="width:${pct}%"></div></div>` +
      `<div class="own">${Math.min(at, goal)} / ${goal}</div>` +
    `</span>`;
  const btn = document.createElement('button');
  btn.className = 'buy';
  if (claimed) { btn.textContent = '✓'; btn.disabled = true; }
  else if (ready) { btn.textContent = 'Al'; btn.onclick = onClaim; }
  else { btn.textContent = '…'; btn.disabled = true; }
  row.appendChild(btn);
  return row;
}

function renderGoals() {
  ensureDaily();
  const mList = document.getElementById('missionList');
  mList.innerHTML = '';
  (daily.missions || []).forEach(m => {
    const def = MISSION_BY_ID[m.id];
    mList.appendChild(goalRow(
      def.icon, def.text(m.goal), `Ödül: ${MISSION_REWARD} meyve`,
      missionAt(m), m.goal, m.claimed,
      () => claimMission(m)
    ));
  });

  const aList = document.getElementById('achList');
  aList.innerHTML = '';
  ACHIEVEMENTS.forEach(a => {
    aList.appendChild(goalRow(
      a.icon, a.name, `${a.desc} · ${a.reward} ${TYPE_BY_ID[a.pay].label}`,
      a.at(), a.goal, !!achClaimed[a.id],
      () => claimAch(a)
    ));
  });
  refreshGoalsBadge();
}

function claimMission(m) {
  if (m.claimed || !missionDone(m)) return;
  m.claimed = true;
  saveDaily();
  const t = TYPES[Math.floor(Math.random() * TYPES.length)];
  bumpCurrency(t.id, MISSION_REWARD);
  sfx.win();
  renderGoals();
}

function claimAch(a) {
  if (achClaimed[a.id] || a.at() < a.goal) return;
  achClaimed[a.id] = true;
  saveAch();
  bumpCurrency(a.pay, a.reward);
  sfx.win();
  renderGoals();
}

function refreshGoalsBadge() {
  const b = document.getElementById('goalsBtn');
  b.textContent = anyClaimable() ? '📋 Görevler ❗' : '📋 Görevler';
}

    daily.rewardClaimed = true;
    saveDaily();
    bumpCurrency(daily.loot.type, daily.loot.amount);
    sfx.win();
  }
  document.getElementById('daily').classList.remove('show');
  menuEl.classList.add('show');
});

function buyBooster(b) {
  if (!boosterUnlocked(b) || currency[b.pay] < b.cost) return;
  currency[b.pay] -= b.cost;
  boosters[b.id] = (boosters[b.id] || 0) + 1;
  saveCurrency();
  saveBoosters();
  sfx.booster();
  buildCounters();
  renderUpgrades();
}

function buyUpgrade(u) {
  const cost = upgCost(u);
  if (upg(u.id) >= UPG_MAX || currency[u.pay] < cost) return;
  currency[u.pay] -= cost;
  upgrades[u.id]++;
  saveCurrency();
  saveUpgrades();
  sfx.win();
  buildCounters();
  renderUpgrades();
}

// ---------------------------------------------------------------------
// Fruit look: procedural textures + per-type geometry
//
// The camera sits nearly overhead, so what reads is the top of each
// fruit. Sphere UVs put the canvas top row at the north pole, which is
// where the top-facing detail is drawn.
// ---------------------------------------------------------------------
function newCanvas(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  return [c, c.getContext('2d')];
}
function finishTexture(canvas) {
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

function berryTexture(t) {
  const S = 256, [c, ctx] = newCanvas(S);
  ctx.fillStyle = t.dark;
  ctx.fillRect(0, 0, S, S);
  // drupelets: small rounded cells lit from the upper-left
  const cell = 20;
  for (let y = -cell; y < S + cell; y += cell) {
    for (let x = -cell; x < S + cell; x += cell) {
      const ox = ((y / cell) & 1) ? cell / 2 : 0;
      const cx = x + ox + (Math.random() - 0.5) * 3;
      const cy = y + (Math.random() - 0.5) * 3;
      const r = cell * 0.52;
      const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.35, r * 0.1, cx, cy, r);
      g.addColorStop(0, t.light);
      g.addColorStop(0.6, t.base);
      g.addColorStop(1, t.speck);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    }
  }
  return finishTexture(c);
}

function lycheeTexture(t) {
  const S = 256, [c, ctx] = newCanvas(S);
  ctx.fillStyle = t.base;
  ctx.fillRect(0, 0, S, S);
  // soft mottling
  for (let i = 0; i < 180; i++) {
    ctx.globalAlpha = 0.05 + Math.random() * 0.09;
    ctx.fillStyle = Math.random() < 0.5 ? t.dark : t.light;
    const x = Math.random() * S, y = Math.random() * S, r = 6 + Math.random() * 16;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // blush ring around the pole -> reads as the dimple on top
  const band = ctx.createLinearGradient(0, 0, 0, S * 0.13);
  band.addColorStop(0, t.speck);
  band.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = band;
  ctx.fillRect(0, 0, S, S * 0.13);
  return finishTexture(c);
}

function melonTexture(t) {
  const S = 256, [c, ctx] = newCanvas(S);
  const g = ctx.createLinearGradient(0, 0, 0, S);
  g.addColorStop(0, t.light);
  g.addColorStop(0.5, t.base);
  g.addColorStop(1, t.dark);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  // cantaloupe netting
  ctx.strokeStyle = '#ffe0b0';
  ctx.lineWidth = 3.2;
  ctx.lineCap = 'round';
  for (let i = -S; i < S * 2; i += 26) {
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    for (let y = 0; y <= S; y += 16) ctx.lineTo(i + y + Math.sin(y * 0.08) * 7, y);
    ctx.stroke();
    ctx.beginPath();
    for (let y = 0; y <= S; y += 16) ctx.lineTo(i - y + Math.cos(y * 0.08) * 7, y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  return finishTexture(c);
}

function bananaCapTexture(t) {
  const S = 256, [c, ctx] = newCanvas(S);
  ctx.clearRect(0, 0, S, S);
  const cx = S / 2, cy = S / 2, R = S / 2;
  // peel edge
  ctx.fillStyle = t.dark;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
  // flesh
  const g = ctx.createRadialGradient(cx - R * 0.2, cy - R * 0.25, R * 0.1, cx, cy, R * 0.92);
  g.addColorStop(0, '#fffbe0');
  g.addColorStop(0.65, t.light);
  g.addColorStop(1, t.base);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.88, 0, Math.PI * 2); ctx.fill();
  // three-lobed core with seeds
  ctx.fillStyle = 'rgba(210,165,60,.5)';
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.24, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(180,135,45,.55)';
  ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * Math.PI * 2 - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * R * 0.24, cy + Math.sin(a) * R * 0.24);
    ctx.stroke();
    ctx.fillStyle = 'rgba(120,85,25,.75)';
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a + 1.05) * R * 0.12, cy + Math.sin(a + 1.05) * R * 0.12, R * 0.035, 0, Math.PI * 2);
    ctx.fill();
  }
  return finishTexture(c);
}

// A sphere pushed out along a repeating 3D wave: real bumps, so the
// blackberry keeps its texture from the overhead camera angle.
function bumpySphere(freq, amp, wSeg, hSeg) {
  const geo = new THREE.SphereGeometry(1, wSeg, hSeg);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = v.clone().normalize();
    const bump = Math.sin(n.x * freq) * Math.sin(n.y * freq) * Math.sin(n.z * freq);
    v.setLength(1 + bump * amp);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

const GEO = {
  berry:  bumpySphere(9, 0.085, 34, 26),
  lychee: new THREE.SphereGeometry(1, 24, 18),
  melon:  bumpySphere(7, 0.022, 28, 20),
  banana: new THREE.CylinderGeometry(1, 1, 1, 30),
};

const MAT = {};
TYPES.forEach(t => {
  if (t.id === 'berry') {
    MAT.berry = new THREE.MeshStandardMaterial({ map: berryTexture(t), roughness: 0.36, metalness: 0.04 });
  } else if (t.id === 'lychee') {
    MAT.lychee = new THREE.MeshStandardMaterial({ map: lycheeTexture(t), roughness: 0.52 });
  } else if (t.id === 'melon') {
    MAT.melon = new THREE.MeshStandardMaterial({ map: melonTexture(t), roughness: 0.62 });
  } else {
    const cap = new THREE.MeshStandardMaterial({ map: bananaCapTexture(t), roughness: 0.5 });
    const side = new THREE.MeshStandardMaterial({ color: t.dark, roughness: 0.55 });
    MAT.banana = [side, cap, cap];   // CylinderGeometry groups: side, top, bottom
  }
});

// Sphere fruits sit on the ground at y = radius; the banana disc is a
// cylinder centred on its own origin, so it sits at half its height.
function fruitVisual(type, radius) {
  if (type === 'banana') {
    const sy = radius * 0.5;
    return { geo: GEO.banana, mat: MAT.banana, sx: radius, sy, baseY: sy / 2 };
  }
  return { geo: GEO[type], mat: MAT[type], sx: radius, sy: radius, baseY: radius };
}

const NORMAL_R = 0.42, BIG_R = 0.64;

const ROCK_GEO = bumpySphere(5, 0.16, 18, 12);
ROCK_GEO.scale(1, 0.72, 1);
function rockTexture() {
  const S = 128, [c, ctx] = newCanvas(S);
  ctx.fillStyle = '#8d8f96';
  ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 150; i++) {
    ctx.globalAlpha = 0.1 + Math.random() * 0.25;
    ctx.fillStyle = Math.random() < 0.5 ? '#6b6d74' : '#b3b6bd';
    const x = Math.random() * S, y = Math.random() * S, r = 2 + Math.random() * 7;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  return finishTexture(c);
}
const ROCK_MAT = new THREE.MeshStandardMaterial({ map: rockTexture(), roughness: 0.95 });

// ---------------------------------------------------------------------
// Ground
// ---------------------------------------------------------------------
function groundTexture() {
  const S = 256, [c, ctx] = newCanvas(S);
  ctx.fillStyle = '#e8c07d';
  ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 2400; i++) {
    ctx.globalAlpha = 0.04 + Math.random() * 0.07;
    ctx.fillStyle = Math.random() < 0.5 ? '#d3a45c' : '#f5d69c';
    const x = Math.random() * S, y = Math.random() * S, r = 1 + Math.random() * 2.6;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const tex = finishTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(14, 14);
  return tex;
}
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ map: groundTexture(), roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------------------------------------------------------------------
// Field
// ---------------------------------------------------------------------
const CELL = 1.05;
let fieldHalfX = (COLS * CELL) / 2;
let fieldHalfZ = (rows * CELL) / 2;
const fieldGroup = new THREE.Group();
scene.add(fieldGroup);
let fruits = [];
let eatenCount = 0;
let rocks = [];   // never edible, and they block the hole -- they shape the route

// Levels keep going after the pattern list runs out; each full cycle is a
// harder tier with less time and more rocks in the way.
function tier() { return Math.floor((level - 1) / PATTERNS.length); }

function gridToWorld(row, col) {
  return {
    x: (col - (COLS - 1) / 2) * CELL,
    z: (row - (rows - 1) / 2) * CELL,
  };
}

// ---------------------------------------------------------------------
// Level patterns
//
// Levels are laid out by hand rather than scattered at random: each one
// puts the types into a readable shape, so a field looks planted instead
// of noisy and you can plan a route through it. Levels cycle through the
// list, so the shape tells you which level you are on.
//
//   type(r, c) -> type id for that cell
//   big(r, c)  -> true if the cell holds an oversized fruit (optional;
//                 oversized fruit needs a grown hole, so where they sit
//                 is what actually shapes the route)
// ---------------------------------------------------------------------
const ID = TYPES.map(t => t.id);
function midCol() { return (COLS - 1) / 2; }
function midRow() { return (rows - 1) / 2; }
function scatter(chance) { return Math.random() < chance; }

const PATTERNS = [
  {
    name: 'Tarla', icon: '🌾',
    // wide vertical bands, like planted rows
    type: (r, c) => ID[Math.floor(c / 2) % 4],
    big: (r, c) => c % 2 === 1 && r % 4 === 2,
  },
  {
    name: 'Şeritler', icon: '🍬',
    // horizontal belts; each belt is one type to clear in a sweep
    type: (r, c) => ID[Math.floor(r / 2) % 4],
    big: (r, c) => r % 4 === 3 && (c === 0 || c === COLS - 1),
  },
  {
    name: 'Damalı', icon: '🏁',
    type: (r, c) => ID[(Math.floor(r / 2) + Math.floor(c / 2)) % 4],
    big: () => scatter(0.1),
  },
  {
    name: 'Halkalar', icon: '🎯',
    // concentric rings out from the middle
    type: (r, c) => {
      const d = Math.round(Math.hypot(c - midCol(), (r - midRow()) * 0.85));
      return ID[d % 4];
    },
    // a ring of big fruit walls off the centre until the hole has grown
    big: (r, c) => Math.round(Math.hypot(c - midCol(), (r - midRow()) * 0.85)) === 2,
  },
  {
    name: 'Bahçe', icon: '🌳',
    // soft blobs: neighbouring cells usually share a type
    type: (r, c) => {
      const n = Math.sin(c * 0.9) * Math.cos(r * 0.7) + Math.sin(r * 0.45 + c * 0.3);
      return ID[Math.min(3, Math.floor(((n + 2) / 4) * 4))];
    },
    big: () => scatter(0.12),
  },
  {
    name: 'Çapraz', icon: '🔀',
    type: (r, c) => ID[Math.floor((r + c) / 2) % 4],
    big: (r, c) => (r + c) % 6 === 0,
  },
  {
    name: 'Kalp', icon: '💛',
    // banana heart on a blackberry field
    type: (r, c) => {
      const x = (c - midCol()) / (COLS * 0.42);
      const y = -(r - midRow()) / (rows * 0.34) + 0.35;
      const s = x * x + y * y - 1;
      return (s * s * s - x * x * y * y * y <= 0) ? 'banana' : 'berry';
    },
    big: (r, c) => {
      const x = (c - midCol()) / (COLS * 0.42);
      const y = -(r - midRow()) / (rows * 0.34) + 0.35;
      const s = x * x + y * y - 1;
      return (s * s * s - x * x * y * y * y > 0) && scatter(0.16);
    },
  },
  {
    name: 'Sarmal', icon: '🌀',
    // type follows the angle around the middle, so it reads as arms
    type: (r, c) => {
      const dx = c - midCol(), dy = (r - midRow()) * 0.85;
      const a = Math.atan2(dy, dx) + Math.hypot(dx, dy) * 0.55;
      return ID[((Math.floor(a / (Math.PI / 2)) % 4) + 4) % 4];
    },
    big: () => scatter(0.1),
  },
];

// Rocks replace fruit cells, so the field never gains cells the level
// goal counts -- clearing still means "every fruit eaten".
function placeRocks() {
  rocks = [];
  const count = level < 3 ? 0 : Math.min(14, 2 + tier() * 3 + Math.floor((level % PATTERNS.length) / 3));
  if (!count) return;
  const taken = new Set();
  // keep the bottom row clear: that is where the hole starts
  for (let i = 0; i < count * 6 && rocks.length < count; i++) {
    const r = Math.floor(Math.random() * (rows - 2));
    const c = Math.floor(Math.random() * COLS);
    const key = r + '_' + c;
    if (taken.has(key)) continue;
    taken.add(key);
    rocks.push({ row: r, col: c });
  }
}

function buildField() {
  fieldGroup.clear();
  fruits = [];
  eatenCount = 0;
  fieldHalfX = (COLS * CELL) / 2;
  fieldHalfZ = (rows * CELL) / 2;
  currentPattern = PATTERNS[(level - 1) % PATTERNS.length];
  placeRocks();
  const rockAt = new Set(rocks.map(k => k.row + '_' + k.col));

  for (const k of rocks) {
    const { x, z } = gridToWorld(k.row, k.col);
    const radius = 0.5;
    const mesh = new THREE.Mesh(ROCK_GEO, ROCK_MAT);
    mesh.scale.setScalar(radius);
    mesh.position.set(x, radius * 0.72, z);
    mesh.rotation.y = Math.random() * Math.PI * 2;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    fieldGroup.add(mesh);
    k.x = x; k.z = z; k.r = radius;
  }

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < COLS; c++) {
      if (rockAt.has(r + '_' + c)) continue;
      const type = currentPattern.type(r, c);
      const big = currentPattern.big ? currentPattern.big(r, c) : scatter(0.12);
      const radius = big ? BIG_R : NORMAL_R;
      const vis = fruitVisual(type, radius);
      const mesh = new THREE.Mesh(vis.geo, vis.mat);
      const { x, z } = gridToWorld(r, c);
      mesh.scale.set(vis.sx, vis.sy, vis.sx);
      mesh.position.set(x, vis.baseY, z);
      mesh.rotation.y = Math.random() * Math.PI * 2;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      fieldGroup.add(mesh);
      fruits.push({ mesh, x, z, r: radius, type, big, eaten: false, baseY: vis.baseY, nudge: 0 });
    }
  }
}

// ---------------------------------------------------------------------
// Hole
// ---------------------------------------------------------------------
const BASE_HOLE_R = 0.56;
const HOLE_MAX = BASE_HOLE_R + 2.2;
let holeRadius = BASE_HOLE_R;
let holeX = 0, holeZ = 0;
let holeGroup;

// The ground is a solid plane, so the pit cannot be real geometry without
// a stencil cut-out. From this near-overhead camera a disc painted as a
// brick shaft falling away into darkness reads as depth just as well.
function holeInteriorTexture() {
  const S = 256, [c, ctx] = newCanvas(S);
  const cx = S / 2, cy = S / 2, R = S / 2;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = '#5c3517';
  ctx.fillRect(0, 0, S, S);
  const rings = 5;
  for (let i = 0; i < rings; i++) {
    const r0 = R * (1 - i / rings), r1 = R * (1 - (i + 1) / rings);
    const seg = 14 + i * 2;
    for (let s = 0; s < seg; s++) {
      const a0 = (s / seg) * Math.PI * 2 + (i % 2 ? Math.PI / seg : 0);
      const a1 = a0 + (Math.PI * 2 / seg) * 0.86;
      ctx.fillStyle = ['#6b3d18', '#5a3213', '#7a4a20'][s % 3];
      ctx.beginPath();
      ctx.arc(cx, cy, r0, a0, a1);
      ctx.arc(cx, cy, r1, a1, a0, true);
      ctx.closePath(); ctx.fill();
    }
  }
  const g = ctx.createRadialGradient(cx, cy, R * 0.04, cx, cy, R);
  g.addColorStop(0, 'rgba(0,0,0,1)');
  g.addColorStop(0.45, 'rgba(0,0,0,.94)');
  g.addColorStop(1, 'rgba(0,0,0,.18)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  ctx.restore();
  return finishTexture(c);
}
const HOLE_INTERIOR_MAT = new THREE.MeshBasicMaterial({ map: holeInteriorTexture() });

function buildHole() {
  if (holeGroup) scene.remove(holeGroup);
  holeGroup = new THREE.Group();
  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(BASE_HOLE_R, 0.14, 14, 32),
    new THREE.MeshStandardMaterial({ color: '#f59321', roughness: 0.42 })
  );
  rim.rotation.x = Math.PI / 2;
  rim.position.y = 0.02;
  rim.castShadow = true;
  const inner = new THREE.Mesh(
    new THREE.CircleGeometry(BASE_HOLE_R * 0.92, 32),
    HOLE_INTERIOR_MAT
  );
  inner.rotation.x = -Math.PI / 2;
  inner.position.y = 0.03;
  holeGroup.add(rim, inner);
  scene.add(holeGroup);
}

function resetHole() {
  holeRadius = BASE_HOLE_R + (sizeStage - 1) * 0.05 + upg('size') * 0.06;
  holeX = 0;
  holeZ = fieldHalfZ - 1.4;
  buildHole();
}

// ---------------------------------------------------------------------
// Camera
// ---------------------------------------------------------------------
let camX = 0, camZ = 0;
// The field is only seven columns wide, so the width sets the zoom -- that
// keeps fruit a readable size on a phone instead of shrinking it to fit a
// tall screen. Height then follows from the aspect ratio.
function fitCamera() {
  const aspect = innerWidth / innerHeight;
  const halfH = fieldHalfX + 0.9;
  const halfV = halfH / aspect;
  camera.left = -halfH; camera.right = halfH;
  camera.top = halfV; camera.bottom = -halfV;
  camera.updateProjectionMatrix();
}

// Keep the view inside the field: following the hole to the very edge
// would otherwise park half the screen on empty ground.
function clampCamera() {
  const limX = Math.max(0, fieldHalfX + 1 - camera.right);
  const limZ = Math.max(0, fieldHalfZ + 1 - camera.top);
  camX = Math.max(-limX, Math.min(limX, camX));
  camZ = Math.max(-limZ, Math.min(limZ, camZ));
}
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  fitCamera();
}
addEventListener('resize', resize);

// ---------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------
let state = 'menu';           // 'menu' | 'playing' | 'won' | 'lost'
let timeLeft = 0;
let lastWholeSecond = -1;
let streak = 0, lastEatAt = -9999;
let runStart = 0;
let revivedThisLevel = false;

function levelTime() {
  const base = Math.round(40 + rows * COLS * 0.6);
  const squeeze = 1 - Math.min(0.28, tier() * 0.07);   // later cycles are tighter
  return Math.round(base * squeeze) + upg('time') * 5;
}

// Stars reflect how much time is still on the clock, so clearing fast is
// worth more than clearing at all. Shown live during play, awarded on clear.
function liveStars() {
  const ratio = timeLeft / Math.max(1, levelTime());
  return ratio >= 0.45 ? 3 : ratio >= 0.2 ? 2 : 1;
}

let lastProgPct = -1, lastStarCount = -1;
function updateProgressUI() {
  const pct = fruits.length ? Math.round((eatenCount / fruits.length) * 100) : 0;
  if (pct !== lastProgPct) { progFillEl.style.width = pct + '%'; lastProgPct = pct; }
  if (state !== 'playing') return;
  const s = liveStars();
  if (s !== lastStarCount) {
    lastStarCount = s;
    [...starRowEl.children].forEach((el, i) => el.classList.toggle('on', i < s));
  }
}

function flash(text) {
  comboEl.textContent = text;
  comboEl.classList.remove('show');
  void comboEl.offsetWidth;
  comboEl.classList.add('show');
}
function showCombo(mult) { flash(`x${mult} KOMBO!`); }

// ---------------------------------------------------------------------
// Booster bar
// ---------------------------------------------------------------------
let magnetBoostUntil = 0;

function renderBoosters() {
  boosterBarEl.innerHTML = '';
  BOOSTERS.forEach(b => {
    const btn = document.createElement('button');
    if (!boosterUnlocked(b)) {
      btn.className = 'slot locked';
      btn.textContent = 'Lvl ' + b.unlock;
      btn.disabled = true;
    } else {
      const n = boosters[b.id] || 0;
      btn.className = 'slot' + (n <= 0 ? ' empty' : '');
      btn.innerHTML = b.icon + (n > 0 ? `<span class="badge">${n}</span>` : '');
      btn.disabled = n <= 0;
      btn.onclick = () => useBooster(b);
    }
    boosterBarEl.appendChild(btn);
  });
}

function useBooster(b) {
  if (state !== 'playing' || !boosterUnlocked(b) || (boosters[b.id] || 0) <= 0) return;
  boosters[b.id]--;
  saveBoosters();

  if (b.id === 'time') {
    timeLeft += 15;
    lastWholeSecond = -1;
    updateTimeUI();
  } else if (b.id === 'grow') {
    holeRadius = Math.min(HOLE_MAX, holeRadius + 0.4);
  } else if (b.id === 'magnet') {
    magnetBoostUntil = performance.now() + 8000;
  }

  sfx.booster();
  flash(`${b.icon} ${b.desc}`);
  renderBoosters();
}

function startLevel() {
  sizeStage = level;
  rows = Math.min(9 + Math.floor((level - 1) / 2), 16);
  buildField();
  resetHole();
  camX = holeX; camZ = holeZ;
  fitCamera();
  timeLeft = levelTime();
  lastWholeSecond = -1;
  streak = 0;
  revivedThisLevel = false;
  runStart = performance.now();
  showBanner();
  refreshLevelTag();
  updateTimeUI();
  lastProgPct = -1; lastStarCount = -1;
  updateProgressUI();
  magnetBoostUntil = 0;
  renderBoosters();
  boosterBarEl.classList.add('show');
  menuEl.classList.remove('show');
  upgradesEl.classList.remove('show');
  overlayEl.classList.remove('show');
  topbarEl.classList.add('show');
  hintEl.style.opacity = '.8';
  state = 'playing';
}

function updateTimeUI() {
  const s = Math.max(0, Math.ceil(timeLeft));
  if (s !== lastWholeSecond) {
    lastWholeSecond = s;
    timeNEl.textContent = s;
    if (s <= 10 && s > 0 && state === 'playing') sfx.tick();
  }
  timeTagEl.classList.toggle('low', s <= 10);
}

function showOverlay(title, sub, btnText, action, offerRevive) {
  overlayTitleEl.textContent = title;
  overlaySubEl.textContent = sub;
  actionBtnEl.textContent = btnText;
  actionBtnEl.onclick = action;
  actionBtnEl.classList.toggle('ghost', !!offerRevive);
  reviveBtnEl.hidden = !offerRevive;
  boosterBarEl.classList.remove('show');
  overlayEl.classList.add('show');
}

// One rewarded continue per level: watch an ad, get 15 more seconds and
// carry on with the field exactly as it was.
async function revive() {
  if (revivedThisLevel || state !== 'lost') return;
  reviveBtnEl.disabled = true;
  const ok = await showRewarded();
  reviveBtnEl.disabled = false;
  if (!ok) return;
  revivedThisLevel = true;
  timeLeft = 15;
  lastWholeSecond = -1;
  updateTimeUI();
  overlayEl.classList.remove('show');
  boosterBarEl.classList.add('show');
  state = 'playing';
}
reviveBtnEl.addEventListener('click', revive);

// An interstitial every third level, shown on the way into the next one
// rather than over the win screen.
function nextLevel() {
  if (level % 3 === 1 && level > 1) showInterstitial();
  startLevel();
}

function fillStats(earnedStars) {
  const secs = Math.round((performance.now() - runStart) / 1000);
  const starLine = earnedStars
    ? `<span class="pill">${'★'.repeat(earnedStars)}${'☆'.repeat(3 - earnedStars)}</span>`
    : '';
  overlayStatsEl.innerHTML = starLine +
    `<span class="pill">🍇 ${eatenCount} meyve</span>` +
    `<span class="pill">⏱ ${secs} sn</span>`;
}

function onCleared() {
  if (state !== 'playing') return;
  const cleared = level;
  const earned = liveStars();
  state = 'won';
  sfx.win();
  fillStats(earned);

  const prevBest = stars[cleared] || 0;
  const isBest = earned > prevBest;
  if (isBest) { stars[cleared] = earned; saveStars(); }

  stats.levels++;
  stats.stars += earned;
  daily.levels = (daily.levels || 0) + 1;
  daily.stars = (daily.stars || 0) + earned;
  saveStats();
  saveDaily();
  refreshGoalsBadge();

  level++;
  localStorage.setItem('fruithole_level', String(level));
  menuSubEl.textContent = 'Bölüm ' + level;
  const sub = isBest && prevBest > 0 ? 'Yeni rekor!' : `Sıradaki: Bölüm ${level}`;
  showOverlay('Bölüm Tamam! 🎉', sub, 'Devam', nextLevel, false);
}

function onTimeUp() {
  if (state !== 'playing') return;
  state = 'lost';
  sfx.lose();
  fillStats();
  const left = fruits.length - eatenCount;
  showOverlay('Süre Bitti! ⏱', `${left} meyve kaldı`, 'Tekrar Dene', startLevel, !revivedThisLevel);
}

// ---------------------------------------------------------------------
// Eating
// ---------------------------------------------------------------------
function checkEat(now) {
  for (const f of fruits) {
    if (f.eaten) continue;
    const dx = f.x - holeX, dz = f.z - holeZ;
    const dist = Math.hypot(dx, dz);
    if (dist > holeRadius + f.r) continue;
    if (f.r <= holeRadius * 0.92) {
      if (dist < holeRadius * 0.65) eatFruit(f, now);
    } else if (dist < holeRadius * 0.8 && f.nudge <= 0) {
      f.nudge = 0.28;
      sfx.blocked();
    }
  }
}

function eatFruit(f, now) {
  f.eaten = true;
  eatenCount++;
  // chaining eats pays a multiplier, so sweeping a same-type patch in one
  // pass is worth more than picking fruit off one at a time
  streak = (now - lastEatAt < 900) ? streak + 1 : 1;
  lastEatAt = now;
  const mult = Math.min(5, 1 + Math.floor(streak / 4));
  bumpCurrency(f.type, mult);
  stats.fruits++;
  daily.fruits = (daily.fruits || 0) + 1;
  if (mult > stats.bestCombo) stats.bestCombo = mult;
  if (mult > (daily.bestCombo || 0)) daily.bestCombo = mult;
  if (mult >= 2 && streak % 4 === 0) showCombo(mult);
  updateProgressUI();
  sfx.eat(streak);
  // clamp must never shrink a hole that already starts above the cap
  if (holeRadius < HOLE_MAX) holeRadius = Math.min(holeRadius + (f.big ? 0.05 : 0.017), HOLE_MAX);

  const mesh = f.mesh;
  const t0 = performance.now();
  const startPos = mesh.position.clone();
  const startScale = mesh.scale.clone();
  const dur = 180;
  (function step(t) {
    const p = Math.min(1, (t - t0) / dur);
    mesh.position.set(
      startPos.x + (holeX - startPos.x) * p,
      startPos.y * (1 - p),
      startPos.z + (holeZ - startPos.z) * p
    );
    mesh.scale.set(startScale.x * (1 - p), startScale.y * (1 - p), startScale.z * (1 - p));
    if (p < 1) requestAnimationFrame(step);
    else {
      fieldGroup.remove(mesh);
      if (eatenCount === fruits.length) onCleared();
    }
  })(t0);
}

// Input

let touchId = null, joyBaseX = 0, joyBaseY = 0;
let joyX = 0, joyY = 0;
const MAX_JOY = 55;

app.addEventListener('pointerdown', (e) => {
  if (state !== 'playing') return;
  if (e.target.closest && e.target.closest('button')) return;
  touchId = e.pointerId;
  joyBaseX = e.clientX; joyBaseY = e.clientY;
  joyBaseEl.style.left = joyBaseX + 'px'; joyBaseEl.style.top = joyBaseY + 'px';
  joyKnobEl.style.left = joyBaseX + 'px'; joyKnobEl.style.top = joyBaseY + 'px';
  joyBaseEl.classList.add('show'); joyKnobEl.classList.add('show');
  app.setPointerCapture(e.pointerId);
  hintEl.style.opacity = '0';
});
app.addEventListener('pointermove', (e) => {
  if (e.pointerId !== touchId) return;
  let dx = e.clientX - joyBaseX, dy = e.clientY - joyBaseY;
  const len = Math.hypot(dx, dy);
  if (len > MAX_JOY) { dx = dx / len * MAX_JOY; dy = dy / len * MAX_JOY; }
  joyKnobEl.style.left = (joyBaseX + dx) + 'px';
  joyKnobEl.style.top = (joyBaseY + dy) + 'px';
  joyX = dx / MAX_JOY; joyY = dy / MAX_JOY;
});
function endDrag(e) {
  if (e.pointerId !== touchId) return;
  touchId = null; joyX = 0; joyY = 0;
  joyBaseEl.classList.remove('show'); joyKnobEl.classList.remove('show');
}
app.addEventListener('pointerup', endDrag);
app.addEventListener('pointercancel', endDrag);

document.getElementById('playBtn').addEventListener('click', () => { ensureAudio(); startLevel(); });

// ---------------------------------------------------------------------
// Boot + main loop
// ---------------------------------------------------------------------
buildField();
resetHole();
camX = holeX; camZ = holeZ;
resize();
document.getElementById('loading').style.display = 'none';
refreshGoalsBadge();
maybeShowDaily();

const BASE_MOVE_SPEED = 3.4;
let lastT = performance.now();

function tick(now) {
  const elapsed = (now - lastT) / 1000;
  const dt = Math.min(0.05, elapsed);   // movement stays stable on frame spikes
  lastT = now;

  if (state === 'playing') {
    // countdown follows wall-clock so it is not slowed by a low frame rate,
    // but a backgrounded tab must not drain the whole clock at once
    timeLeft -= Math.min(0.25, elapsed);
    if (timeLeft <= 0) { timeLeft = 0; updateTimeUI(); onTimeUp(); }
    else updateTimeUI();

    if (joyX || joyY) {
      const speed = BASE_MOVE_SPEED * (1 + upg('speed') * 0.08);
      holeX += joyX * speed * dt;
      holeZ += joyY * speed * dt;
      const mX = fieldHalfX - holeRadius * 0.5;
      const mZ = fieldHalfZ - holeRadius * 0.5;
      holeX = Math.max(-mX, Math.min(mX, holeX));
      holeZ = Math.max(-mZ, Math.min(mZ, holeZ));

      // rocks block the hole: push it back out of any overlap
      for (const k of rocks) {
        const rx = holeX - k.x, rz = holeZ - k.z;
        const d = Math.hypot(rx, rz);
        const minD = k.r + holeRadius * 0.45;
        if (d < minD && d > 0.0001) {
          holeX = k.x + (rx / d) * minD;
          holeZ = k.z + (rz / d) * minD;
        }
      }
    }

    // magnet upgrade: fruit the hole could swallow drifts toward it, so a
    // near miss still counts. Oversized fruit is not pulled -- it has to
    // stay where it is until the hole has grown enough to take it.
    const mag = upg('magnet') * 0.28 + (now < magnetBoostUntil ? 1.6 : 0);
    if (mag > 0) {
      for (const f of fruits) {
        if (f.eaten || f.r > holeRadius * 0.92) continue;
        const dx = holeX - f.x, dz = holeZ - f.z;
        const d = Math.hypot(dx, dz);
        const reach = holeRadius + mag;
        if (d > 0.001 && d < reach) {
          const pull = ((reach - d) / reach) * 2.4 * dt;
          f.x += (dx / d) * pull;
          f.z += (dz / d) * pull;
          f.mesh.position.x = f.x;
          f.mesh.position.z = f.z;
        }
      }
    }

    checkEat(now);
    updateProgressUI();
  }

  // uneatable fruits jiggle when bumped
  for (const f of fruits) {
    if (f.eaten || f.nudge <= 0) continue;
    f.nudge = Math.max(0, f.nudge - dt);
    f.mesh.position.y = f.baseY + Math.sin(f.nudge * 60) * 0.09 * (f.nudge / 0.28);
  }

  holeGroup.position.set(holeX, 0, holeZ);
  const s = holeRadius / BASE_HOLE_R;
  holeGroup.scale.set(s, 1, s);

  camX += (holeX - camX) * 0.09;
  camZ += (holeZ - camZ) * 0.09;
  clampCamera();
  camera.position.set(camX, 14, camZ + 2.0);
  camera.lookAt(camX, 0, camZ);

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
